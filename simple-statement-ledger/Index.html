<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --ink: #222;
        --muted: #667085;
        --line: #d9e2df;
        --paper: #fffdf8;
        --panel: #ffffff;
        --green: #216e4e;
        --gold: #b7791f;
        --red: #a43b32;
        --blue: #2f5f98;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      header {
        padding: 18px 16px 10px;
        background: #f7f1e3;
        border-bottom: 1px solid var(--line);
      }
      h1, h2, h3 { margin: 0 0 8px; line-height: 1.2; }
      h1 { font-size: 22px; }
      h2 { font-size: 20px; }
      h3 { font-size: 16px; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }
      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 16px;
        background: #fffaf0;
        border-bottom: 1px solid var(--line);
      }
      .nav button, .action {
        border: 0;
        border-radius: 6px;
        background: var(--green);
        color: white;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }
      .nav button {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .nav button.active {
        background: var(--green);
        color: white;
      }
      .action.secondary { background: var(--blue); }
      .action.warning { background: var(--gold); }
      .action.danger { background: var(--red); }
      .action[disabled] { opacity: .55; cursor: wait; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fbfdfb;
      }
      .metric strong { display: block; font-size: 20px; margin-top: 6px; }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      label { display: block; font-weight: 700; font-size: 13px; }
      input, select, textarea {
        width: 100%;
        margin-top: 5px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }
      textarea { min-height: 100px; }
      .full { grid-column: 1 / -1; }
      .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .table-wrap { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; min-width: 760px; }
      th, td { border-bottom: 1px solid var(--line); padding: 9px; text-align: left; vertical-align: top; }
      th { background: #f4f7f5; font-size: 13px; }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 8px;
        background: #eef6f0;
        border: 1px solid #c8e0d0;
        font-size: 12px;
      }
      #toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        background: #1f2937;
        color: white;
        padding: 12px 14px;
        border-radius: 8px;
        display: none;
      }
      #toast.show { display: block; }
      @media (max-width: 640px) {
        main { padding: 12px; }
        .panel { padding: 12px; }
        .action { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="appTitle">NACO'94 Simple Statement Ledger</h1>
      <div id="userLine" class="muted small">Loading...</div>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="app"></main>
    <div id="toast"></div>

    <script>
      const state = {
        bootstrap: null,
        activeSection: 'dashboard',
        workspace: null,
        previewRows: []
      };

      function loadApp() {
        google.script.run
          .withSuccessHandler(function(data) {
            state.bootstrap = data;
            document.getElementById('appTitle').textContent = data.appName;
            render();
          })
          .withFailureHandler(function(error) {
            renderError(error.message || String(error));
          })
          .getBootstrapData();
      }

      function render() {
        const data = state.bootstrap;
        if (!data.configured) {
          document.getElementById('userLine').textContent = 'Setup required';
          document.getElementById('nav').innerHTML = '';
          document.getElementById('app').innerHTML = `
            <section class="panel">
              <h2>Set Up Simple Statement Ledger</h2>
              <p class="muted">This creates a separate Google Sheet and Drive folders for the simplified bank-statement app.</p>
              <button class="action" type="button" id="setupButton">Run Setup</button>
            </section>
          `;
          document.getElementById('setupButton').addEventListener('click', function() {
            callServer('setupSimpleLedger', [], function() {
              showToast('Setup completed.');
              loadApp();
            });
          });
          return;
        }

        if (!data.user) {
          document.getElementById('userLine').textContent = 'Access needed';
          document.getElementById('nav').innerHTML = '';
          document.getElementById('app').innerHTML = '<section class="panel"><h2>Access Needed</h2><p class="muted">Ask the System Administrator to add your Google account email.</p></section>';
          return;
        }

        document.getElementById('userLine').textContent = data.user.fullName + ' | ' + data.user.roles.join(', ');
        renderNav();
        renderSection(state.activeSection);
      }

      function renderNav() {
        document.getElementById('nav').innerHTML = state.bootstrap.navigation.map(function(item) {
          const active = item.key === state.activeSection ? 'active' : '';
          return `<button class="${active}" type="button" data-section="${item.key}">${escapeHtml(item.label)}</button>`;
        }).join('');
        document.querySelectorAll('[data-section]').forEach(function(button) {
          button.addEventListener('click', function() {
            state.activeSection = button.dataset.section;
            renderSection(state.activeSection);
          });
        });
      }

      function renderSection(section) {
        if (section === 'statements') return renderStatements();
        if (section === 'reports') return renderReports();
        if (section === 'members') return renderMembers();
        if (section === 'myProfile') return renderMyProfile();
        if (section === 'administration') return renderAdministration();
        return renderDashboard();
      }

      function renderDashboard() {
        document.getElementById('app').innerHTML = '<section class="panel"><h2>Dashboard</h2><p class="muted">Loading...</p></section>';
        callServer('getDashboardData', [], drawDashboard);
      }

      function drawDashboard(data) {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Dashboard</h2>
            <p class="muted">This app starts from the bank statement. The main job is to explain each bank line.</p>
          </section>
          <section class="grid">
            ${metric('Money In', formatMoney(data.summary.moneyIn))}
            ${metric('Money Out', formatMoney(data.summary.moneyOut))}
            ${metric('Net Movement', formatMoney(data.summary.netMovement))}
            ${metric('Unclassified', data.progress.unclassifiedLines)}
          </section>
          <section class="panel">
            <h3>Recent Bank Lines</h3>
            ${renderBankLinesTable(data.recentLines, false)}
          </section>
        `;
      }

      function renderStatements() {
        document.getElementById('app').innerHTML = '<section class="panel"><h2>Bank Statements</h2><p class="muted">Loading...</p></section>';
        callServer('getStatementWorkspace', [], function(data) {
          state.workspace = data;
          drawStatements(data);
        });
      }

      function drawStatements(data) {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Bank Statements</h2>
            <p class="muted">Upload CSV, paste rows, store a PDF, or enter a bank line manually. Then classify each bank line.</p>
          </section>
          <section class="grid">
            ${metric('Total Lines', data.summary.totalLines)}
            ${metric('Classified', data.summary.classifiedLines)}
            ${metric('Needs Review', data.summary.needsReviewLines)}
            ${metric('Unclassified', data.summary.unclassifiedLines)}
          </section>
          <section class="panel">
            <h3>Import Statement Rows</h3>
            <form id="pasteForm" class="form-grid">
              ${selectField('Bank Account', 'accountId', data.accounts.map(accountOption))}
              <label class="full">Paste rows from CSV, Excel, bank portal, email, or copied PDF text
                <textarea name="rowsText" placeholder="Date, Description, Money In, Money Out, Balance, Reference"></textarea>
              </label>
              <div class="full action-row">
                <button class="action" type="submit">Preview Pasted Rows</button>
                <button class="action secondary" type="button" id="importPreviewButton">Import Preview</button>
              </div>
            </form>
            <div id="previewArea"></div>
          </section>
          <section class="panel">
            <h3>Upload CSV or PDF</h3>
            <form id="fileForm" class="form-grid">
              ${selectField('Bank Account', 'accountId', data.accounts.map(accountOption))}
              <label>CSV or text file<input type="file" name="statementFile" accept=".csv,.txt,text/csv,text/plain"></label>
              <label>PDF statement for storage<input type="file" name="pdfFile" accept="application/pdf,.pdf"></label>
              <div class="full action-row">
                <button class="action" type="button" id="previewCsvButton">Preview CSV</button>
                <button class="action secondary" type="button" id="uploadPdfButton">Store PDF</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <h3>Manual Bank Line</h3>
            <form id="manualLineForm" class="form-grid">
              ${selectField('Bank Account', 'accountId', data.accounts.map(accountOption))}
              ${inputField('Date', 'statementDate', todayDisplay())}
              ${inputField('Description', 'description', '')}
              ${inputField('Reference Number', 'referenceNumber', '')}
              ${inputField('Money In', 'moneyIn', '')}
              ${inputField('Money Out', 'moneyOut', '')}
              ${inputField('Running Balance', 'runningBalance', '')}
              <div class="full"><button class="action" type="submit">Save Manual Line</button></div>
            </form>
          </section>
          <section class="panel">
            <h3>Classify Bank Lines</h3>
            ${renderBankLinesTable(data.bankLines, true)}
          </section>
        `;
        bindStatementControls();
      }

      function bindStatementControls() {
        document.getElementById('pasteForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const values = readFormValues(event.target);
          callServer('previewPastedStatementRows', [values.rowsText], function(preview) {
            state.previewRows = preview.rows;
            renderPreviewRows(preview.rows);
          });
        });
        document.getElementById('importPreviewButton').addEventListener('click', function() {
          const values = readFormValues(document.getElementById('pasteForm'));
          importRows(values.accountId, 'Pasted Rows', state.previewRows);
        });
        document.getElementById('previewCsvButton').addEventListener('click', function() {
          const file = document.querySelector('[name="statementFile"]').files[0];
          readFileAsBase64(file, function(fileData) {
            callServer('previewStatementCsv', [fileData], function(preview) {
              state.previewRows = preview.rows;
              renderPreviewRows(preview.rows);
            });
          });
        });
        document.getElementById('uploadPdfButton').addEventListener('click', function() {
          const file = document.querySelector('[name="pdfFile"]').files[0];
          readFileAsBase64(file, function(fileData) {
            callServer('uploadStatementPdf', [fileData], function() {
              showToast('PDF stored. Enter or paste the PDF lines manually if needed.');
            });
          });
        });
        document.getElementById('manualLineForm').addEventListener('submit', function(event) {
          event.preventDefault();
          callServer('addManualBankLine', [readFormValues(event.target)], function() {
            showToast('Manual bank line saved.');
            renderStatements();
          });
        });
        document.querySelectorAll('[data-classify]').forEach(function(button) {
          button.addEventListener('click', function() {
            showClassificationForm(button.dataset.classify);
          });
        });
      }

      function renderPreviewRows(rows) {
        document.getElementById('previewArea').innerHTML = `
          <h3>Preview</h3>
          ${renderBankLinesTable(rows.map(function(row, index) {
            return Object.assign({ bankLineId: 'Preview ' + (index + 1), classificationStatus: 'Preview' }, row);
          }), false)}
        `;
      }

      function importRows(accountId, sourceType, rows) {
        if (!rows.length) {
          showToast('Preview rows first.');
          return;
        }
        callServer('importStatementRows', [{ accountId: accountId, sourceType: sourceType, rows: rows }], function(result) {
          showToast(result.rowsImported + ' rows imported.');
          renderStatements();
        });
      }

      function showClassificationForm(bankLineId) {
        const line = state.workspace.bankLines.find(function(item) { return item.bankLineId === bankLineId; });
        const amount = line.moneyIn > 0 ? line.moneyIn : line.moneyOut;
        const options = state.workspace.categories.map(categoryOption).join('');
        const members = ['<option value="">No member link</option>'].concat(state.workspace.members.map(function(member) {
          return `<option value="${escapeAttr(member.memberId)}">${escapeHtml(member.name)}</option>`;
        })).join('');
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Classify Bank Line</h2>
            <p><strong>${escapeHtml(line.description)}</strong></p>
            <p class="muted">${escapeHtml(line.statementDate)} | Amount: ${formatMoney(amount)}</p>
            <p class="muted small">For lump sums, add more split rows. The split total must equal the bank amount.</p>
          </section>
          <section class="panel">
            <form id="classificationForm">
              <div id="splits"></div>
              <div class="action-row">
                <button class="action secondary" type="button" id="addSplitButton">Add Split</button>
                <button class="action" type="submit">Save Classification</button>
                <button class="action warning" type="button" id="cancelClassifyButton">Back</button>
              </div>
            </form>
          </section>
        `;
        function addSplit(defaultAmount) {
          const holder = document.createElement('div');
          holder.className = 'panel';
          holder.innerHTML = `
            <div class="form-grid">
              <label>Category<select name="categoryId">${options}</select></label>
              <label>Member<select name="memberId">${members}</select></label>
              <label>Amount<input name="amount" value="${escapeAttr(defaultAmount || '')}"></label>
              <label>Notes<input name="notes"></label>
            </div>
          `;
          document.getElementById('splits').appendChild(holder);
        }
        addSplit(amount);
        document.getElementById('addSplitButton').addEventListener('click', function() { addSplit(''); });
        document.getElementById('cancelClassifyButton').addEventListener('click', renderStatements);
        document.getElementById('classificationForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const splits = Array.from(document.querySelectorAll('#splits .panel')).map(function(panel) {
            return readFormValues(panel);
          });
          callServer('saveBankLineClassification', [bankLineId, splits], function() {
            showToast('Classification saved.');
            renderStatements();
          });
        });
      }

      function renderReports() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Reports</h2>
            <p class="muted">Reports are built from classified bank lines. Unclassified lines are shown as warnings.</p>
            <form id="reportForm" class="form-grid">
              ${inputField('Start Date', 'startDate', todayDisplay())}
              ${inputField('End Date', 'endDate', todayDisplay())}
              <div class="full action-row">
                <button class="action" type="submit">View Report</button>
                <button class="action secondary" type="button" id="exportReportButton">Export CSV</button>
              </div>
            </form>
          </section>
          <section id="reportOutput"></section>
        `;
        document.getElementById('reportForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const values = readFormValues(event.target);
          callServer('getSimpleReportData', [values.startDate, values.endDate], drawReport);
        });
        document.getElementById('exportReportButton').addEventListener('click', function() {
          const values = readFormValues(document.getElementById('reportForm'));
          callServer('exportSimpleReportCsv', [values.startDate, values.endDate], function(csv) {
            downloadCsv(csv, 'naco-94-simple-statement-ledger-' + todayIso() + '.csv');
            showToast('CSV exported.');
          });
        });
      }

      function drawReport(report) {
        document.getElementById('reportOutput').innerHTML = `
          <section class="grid">
            ${metric('Money In', formatMoney(report.summary.moneyIn))}
            ${metric('Money Out', formatMoney(report.summary.moneyOut))}
            ${metric('Net Movement', formatMoney(report.summary.netMovement))}
            ${metric('Needs Review', report.summary.needsReviewLines)}
          </section>
          <section class="panel">
            <h3>By Category</h3>
            ${renderCategoryRows(report.categoryRows)}
          </section>
          <section class="panel">
            <h3>Details</h3>
            ${renderDetailRows(report.detailRows)}
          </section>
        `;
      }

      function renderMembers() {
        callServer('getMemberDirectory', [], function(members) {
          document.getElementById('app').innerHTML = `
            <section class="panel"><h2>Members</h2><p class="muted">Only details each member agrees to share are shown.</p></section>
            <section class="grid">
              ${members.map(function(member) {
                return `<div class="panel"><h3>${escapeHtml(member.name)}</h3><p>${escapeHtml(member.cityCountry || '')}</p><p>${escapeHtml(member.occupation || '')}</p><p class="small">${escapeHtml(member.phoneNumber || '')}</p><p class="small">${escapeHtml(member.emailAddress || '')}</p></div>`;
              }).join('') || '<div class="panel">No visible members yet.</div>'}
            </section>
          `;
        });
      }

      function renderMyProfile() {
        callServer('getMyProfile', [], function(data) {
          const member = data.member || {};
          document.getElementById('app').innerHTML = `
            <section class="panel"><h2>My Profile</h2><p class="muted">Update your details and choose what appears in the directory.</p></section>
            <section class="panel">
              <form id="profileForm" class="form-grid">
                ${inputField('Full Name', 'Full Name', member.fullName || '')}
                ${inputField('Preferred Name', 'Preferred Name', member.preferredName || '')}
                ${inputField('Email Address', 'Email Address', member.emailAddress || data.user.email)}
                ${inputField('Phone Number', 'Phone Number', member.phoneNumber || '')}
                ${inputField('City', 'City', member.city || '')}
                ${inputField('Country', 'Country', member.country || 'Nigeria')}
                ${inputField('Occupation', 'Occupation', member.occupation || '')}
                ${inputField('Birthday dd/mm', 'Birthday', member.birthday || '')}
                ${yesNoField('Show Name', 'Show Name', member.showName || 'Yes')}
                ${yesNoField('Show City/Country', 'Show City Country', member.showCityCountry || 'Yes')}
                ${yesNoField('Show Occupation', 'Show Occupation', member.showOccupation || 'No')}
                ${yesNoField('Show Phone', 'Show Phone', member.showPhone || 'No')}
                ${yesNoField('Show Email', 'Show Email', member.showEmail || 'No')}
                <div class="full"><button class="action" type="submit">Save Profile</button></div>
              </form>
            </section>
          `;
          document.getElementById('profileForm').addEventListener('submit', function(event) {
            event.preventDefault();
            callServer('saveMyProfile', [readFormValues(event.target)], function() {
              showToast('Profile saved.');
            });
          });
        });
      }

      function renderAdministration() {
        callServer('getAdministrationData', [], function(data) {
          document.getElementById('app').innerHTML = `
            <section class="panel"><h2>Administration</h2><p class="muted">Manage users, members, categories, bank accounts, and backups.</p></section>
            <section class="panel">
              <h3>Add Member</h3>
              <form id="addMemberForm" class="form-grid">
                ${inputField('Full Name', 'Full Name', '')}
                ${inputField('Email Address', 'Email Address', '')}
                ${inputField('Phone Number', 'Phone Number', '')}
                ${inputField('City', 'City', '')}
                <div class="full"><button class="action" type="submit">Add Member</button></div>
              </form>
            </section>
            <section class="panel">
              <h3>User Access</h3>
              <form id="userForm" class="form-grid">
                ${inputField('Email', 'Email', '')}
                ${inputField('Full Name', 'Full Name', '')}
                ${inputField('Roles', 'Roles', 'Member')}
                ${selectField('Linked Member', 'Member ID', ['<option value="">None</option>'].concat(data.members.map(function(member) { return `<option value="${escapeAttr(member.memberId)}">${escapeHtml(member.fullName)}</option>`; })))}
                <div class="full"><button class="action" type="submit">Save User</button></div>
              </form>
            </section>
            <section class="panel">
              <h3>Bank Account</h3>
              <form id="accountForm" class="form-grid">
                ${inputField('Account Name', 'accountName', '')}
                ${inputField('Bank Name', 'bankName', '')}
                ${inputField('Masked Account Number', 'maskedAccountNumber', '')}
                ${inputField('Opening Balance', 'openingBalance', '0')}
                ${inputField('Opening Date', 'openingDate', todayDisplay())}
                <div class="full"><button class="action" type="submit">Add Bank Account</button></div>
              </form>
            </section>
            <section class="panel">
              <h3>Category</h3>
              <form id="categoryForm" class="form-grid">
                ${selectField('Type', 'categoryType', ['Money In', 'Money Out', 'Transfer', 'Review'].map(function(type) { return `<option value="${type}">${type}</option>`; }))}
                ${inputField('Category Name', 'categoryName', '')}
                ${inputField('Report Group', 'reportGroup', '')}
                <div class="full"><button class="action" type="submit">Add Category</button></div>
              </form>
            </section>
            <section class="panel">
              <h3>Maintenance</h3>
              <div class="action-row">
                <button class="action secondary" type="button" id="backupButton">Back Up Data Now</button>
                <button class="action secondary" type="button" id="demoButton">Add Demo Starter Data</button>
              </div>
            </section>
          `;
          bindAdminForms();
        });
      }

      function bindAdminForms() {
        document.getElementById('addMemberForm').addEventListener('submit', function(event) {
          event.preventDefault();
          callServer('addMember', [readFormValues(event.target)], function() { showToast('Member added.'); renderAdministration(); });
        });
        document.getElementById('userForm').addEventListener('submit', function(event) {
          event.preventDefault();
          callServer('saveUserAccess', [readFormValues(event.target)], function() { showToast('User saved.'); renderAdministration(); });
        });
        document.getElementById('accountForm').addEventListener('submit', function(event) {
          event.preventDefault();
          callServer('addBankAccount', [readFormValues(event.target)], function() { showToast('Bank account added.'); renderAdministration(); });
        });
        document.getElementById('categoryForm').addEventListener('submit', function(event) {
          event.preventDefault();
          callServer('addCategory', [readFormValues(event.target)], function() { showToast('Category added.'); renderAdministration(); });
        });
        document.getElementById('backupButton').addEventListener('click', function() {
          callServer('backupSimpleLedgerNow', [], function() { showToast('Backup created.'); });
        });
        document.getElementById('demoButton').addEventListener('click', function() {
          callServer('seedSimpleDemoData', [], function() { showToast('Demo starter data added.'); renderAdministration(); });
        });
      }

      function renderBankLinesTable(lines, withActions) {
        if (!lines || !lines.length) return '<p class="muted">No bank lines yet.</p>';
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Description</th><th>Money In</th><th>Money Out</th><th>Balance</th><th>Status</th>${withActions ? '<th>Action</th>' : ''}</tr></thead>
              <tbody>
                ${lines.map(function(line) {
                  return `<tr>
                    <td>${escapeHtml(line.statementDate)}</td>
                    <td>${escapeHtml(line.description)}<br><span class="small muted">${escapeHtml(line.referenceNumber || '')}</span></td>
                    <td>${formatMoney(line.moneyIn)}</td>
                    <td>${formatMoney(line.moneyOut)}</td>
                    <td>${formatMoney(line.runningBalance)}</td>
                    <td><span class="badge">${escapeHtml(line.classificationStatus || '')}</span></td>
                    ${withActions ? `<td><button class="action secondary" type="button" data-classify="${escapeAttr(line.bankLineId)}">Classify</button></td>` : ''}
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderCategoryRows(rows) {
        if (!rows.length) return '<p class="muted">No classified income or expense rows for this period.</p>';
        return `<div class="table-wrap"><table><thead><tr><th>Category</th><th>Type</th><th>Amount</th></tr></thead><tbody>${rows.map(function(row) {
          return `<tr><td>${escapeHtml(row.categoryName)}</td><td>${escapeHtml(row.categoryType)}</td><td>${formatMoney(row.amount)}</td></tr>`;
        }).join('')}</tbody></table></div>`;
      }

      function renderDetailRows(rows) {
        if (!rows.length) return '<p class="muted">No classified details for this period.</p>';
        return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Member</th><th>Amount</th><th>Notes</th></tr></thead><tbody>${rows.map(function(row) {
          return `<tr><td>${escapeHtml(row.statementDate)}</td><td>${escapeHtml(row.description)}</td><td>${escapeHtml(row.categoryName)}</td><td>${escapeHtml(row.memberId || '')}</td><td>${formatMoney(row.amount)}</td><td>${escapeHtml(row.notes || '')}</td></tr>`;
        }).join('')}</tbody></table></div>`;
      }

      function callServer(methodName, args, onSuccess) {
        setBusy(true);
        const runner = google.script.run
          .withSuccessHandler(function(result) {
            setBusy(false);
            onSuccess(result);
          })
          .withFailureHandler(function(error) {
            setBusy(false);
            showToast(error.message || String(error));
          });
        runner[methodName].apply(runner, args || []);
      }

      function setBusy(busy) {
        document.querySelectorAll('button').forEach(function(button) { button.disabled = busy; });
      }

      function readFormValues(form) {
        const data = {};
        if (form.tagName && form.tagName.toLowerCase() === 'form') {
          new FormData(form).forEach(function(value, key) { data[key] = value; });
          return data;
        }
        form.querySelectorAll('input, select, textarea').forEach(function(field) {
          data[field.name] = field.value;
        });
        return data;
      }

      function inputField(label, name, value) {
        return `<label>${escapeHtml(label)}<input name="${escapeAttr(name)}" value="${escapeAttr(value || '')}"></label>`;
      }

      function selectField(label, name, options) {
        return `<label>${escapeHtml(label)}<select name="${escapeAttr(name)}">${options.join('')}</select></label>`;
      }

      function yesNoField(label, name, value) {
        return selectField(label, name, ['Yes', 'No'].map(function(option) {
          const selected = option === value ? ' selected' : '';
          return `<option value="${option}"${selected}>${option}</option>`;
        }));
      }

      function accountOption(account) {
        return `<option value="${escapeAttr(account.accountId)}">${escapeHtml(account.accountName)}</option>`;
      }

      function categoryOption(category) {
        return `<option value="${escapeAttr(category.categoryId)}">${escapeHtml(category.categoryName + ' - ' + category.categoryType)}</option>`;
      }

      function metric(label, value) {
        return `<div class="metric"><span class="muted">${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
      }

      function formatMoney(value) {
        return 'NGN ' + Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function todayIso() {
        return new Date().toISOString().slice(0, 10);
      }

      function todayDisplay() {
        const parts = todayIso().split('-');
        return parts[2] + '-' + parts[1] + '-' + parts[0];
      }

      function readFileAsBase64(file, callback) {
        if (!file) {
          showToast('Choose a file first.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(event) {
          callback({
            fileName: file.name,
            mimeType: file.type,
            base64: String(event.target.result).split(',')[1]
          });
        };
        reader.readAsDataURL(file);
      }

      function downloadCsv(csv, fileName) {
        const blob = new Blob([csv || ''], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message || '';
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 5000);
      }

      function renderError(message) {
        document.getElementById('app').innerHTML = `<section class="panel"><h2>Error</h2><p>${escapeHtml(message)}</p></section>`;
      }

      function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function(char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      loadApp();
    </script>
  </body>
</html>
