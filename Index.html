<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --green: #12613f;
        --green-dark: #0b3f2b;
        --green-soft: #eaf6ef;
        --gold: #c99b20;
        --gold-soft: #fff7df;
        --ink: #1d2939;
        --muted: #667085;
        --line: #dde5df;
        --soft: #f6f8f5;
        --surface: #ffffff;
        --danger: #b42318;
        --danger-soft: #fff1f2;
        --warning: #946200;
        --ok: #166534;
        --shadow: 0 10px 28px rgba(18, 97, 63, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(201, 155, 32, 0.12), transparent 32rem),
          linear-gradient(180deg, #f7fbf8 0%, #ffffff 42%);
        line-height: 1.5;
        font-size: 16px;
      }

      .app-header {
        background:
          linear-gradient(135deg, rgba(11, 63, 43, 0.96), rgba(18, 97, 63, 0.94)),
          var(--green);
        color: #ffffff;
        padding: 22px 16px 20px;
        border-bottom: 4px solid var(--gold);
      }

      .brand-row {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff3bf;
        font-weight: 900;
        letter-spacing: 0;
        flex: 0 0 auto;
      }

      .app-title {
        margin: 0;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .tagline {
        margin: 5px 0 0;
        color: #ffe7a3;
        font-size: 15px;
      }

      .status-bar {
        display: flex;
        gap: 8px;
        align-items: center;
        overflow-x: auto;
        border-bottom: 1px solid rgba(18, 97, 63, 0.12);
        padding: 12px max(12px, calc((100vw - 1120px) / 2 + 14px));
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid #d9e7dd;
        background: #ffffff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.ok {
        border-color: #bfe8cb;
        background: #effaf2;
        color: var(--ok);
      }

      .badge.warn {
        border-color: #f6d777;
        background: var(--gold-soft);
        color: var(--warning);
      }

      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px max(12px, calc((100vw - 1120px) / 2 + 14px));
        border-bottom: 1px solid rgba(18, 97, 63, 0.12);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .nav button {
        min-height: 42px;
        padding: 10px 15px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      }

      .nav button.active {
        background: var(--green);
        border-color: var(--green);
        color: #ffffff;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 22px 14px 56px;
      }

      .panel {
        border: 1px solid rgba(18, 97, 63, 0.12);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      h2 {
        margin: 0 0 8px;
        font-size: 23px;
        line-height: 1.2;
      }

      h3 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 10px;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        min-height: 100px;
        border: 1px solid rgba(18, 97, 63, 0.12);
        border-radius: 14px;
        padding: 14px;
        background: linear-gradient(180deg, #ffffff, #f8fbf8);
        box-shadow: 0 6px 18px rgba(16, 24, 40, 0.04);
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: 24px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .action-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .action {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        background: var(--green);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 8px 16px rgba(18, 97, 63, 0.18);
      }

      .action.secondary {
        background: #ffffff;
        border: 1px solid var(--green);
        color: var(--green-dark);
      }

      .action.danger {
        background: #ffffff;
        border: 1px solid var(--danger);
        color: var(--danger);
      }

      a.action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .locked {
        opacity: 0.58;
      }

      .message {
        border-left: 4px solid var(--gold);
        background: var(--gold-soft);
        padding: 12px;
        border-radius: 10px;
      }

      .error {
        border-left-color: var(--danger);
        background: #fff1f2;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .split-list {
        display: grid;
        gap: 12px;
      }

      .split-row {
        display: grid;
        grid-template-columns: minmax(92px, 0.8fr) minmax(150px, 1.2fr) minmax(150px, 1fr) minmax(180px, 1.4fr) auto;
        gap: 10px;
        align-items: end;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 5px;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        font: inherit;
        background: #ffffff;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus {
        outline: 3px solid rgba(201, 155, 32, 0.28);
        outline-offset: 2px;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      .check-list {
        display: grid;
        gap: 8px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
      }

      .check-item input {
        width: 20px;
        min-height: 20px;
      }

      .directory-list,
      .request-list {
        display: grid;
        gap: 10px;
      }

      .directory-card,
      .request-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--soft);
      }

      .statement-workbench {
        display: grid;
        gap: 12px;
      }

      .statement-grid {
        min-width: 940px;
        table-layout: fixed;
        font-size: 12px;
      }

      .statement-grid th {
        position: sticky;
        top: 0;
        z-index: 1;
        white-space: nowrap;
        padding: 7px 6px;
        font-size: 11px;
      }

      .statement-grid td {
        padding: 6px;
        vertical-align: middle;
      }

      .statement-grid input,
      .statement-grid select,
      .statement-grid textarea {
        min-height: 38px;
        border-radius: 6px;
        padding: 7px;
      }

      .statement-grid textarea {
        min-height: 46px;
        min-width: 125px;
        font-size: 12px;
        line-height: 1.3;
      }

      .statement-grid input,
      .statement-grid select {
        font-size: 12px;
      }

      .statement-grid .action {
        min-height: 32px;
        padding: 5px 7px;
        font-size: 11px;
      }

      .statement-grid .include-cell {
        text-align: center;
      }

      .statement-grid .include-cell input {
        width: 22px;
        min-height: 22px;
      }

      .statement-grid .amount-cell {
        width: 92px;
      }

      .statement-grid .description-cell {
        width: 190px;
      }

      .statement-grid .category-cell {
        width: 165px;
      }

      .statement-grid .evidence-cell {
        width: 155px;
      }

      .statement-review-scroll {
        margin-top: 10px;
        overflow-x: auto;
        scroll-behavior: smooth;
        overscroll-behavior-x: contain;
        scrollbar-color: var(--green) #e8eee9;
        scrollbar-width: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .statement-review-scroll::-webkit-scrollbar {
        height: 12px;
      }

      .statement-review-scroll::-webkit-scrollbar-track {
        background: #e8eee9;
      }

      .statement-review-scroll::-webkit-scrollbar-thumb {
        background: var(--green);
        border: 2px solid #e8eee9;
        border-radius: 999px;
      }

      .statement-scroll-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .statement-scroll-controls .action {
        min-height: 36px;
        padding: 7px 10px;
        font-size: 12px;
      }

      .statement-scroll-hint {
        flex: 1 1 190px;
        text-align: center;
        font-size: 12px;
      }

      .statement-split-row td {
        background: #f7fbf8;
        padding: 12px 16px 16px;
      }

      .statement-split-editor {
        border-left: 4px solid var(--green);
        padding-left: 12px;
      }

      .statement-split-list {
        display: grid;
        gap: 8px;
        margin: 10px 0;
      }

      .statement-split-line {
        display: grid;
        grid-template-columns: minmax(110px, 0.6fr) minmax(190px, 1.2fr) minmax(170px, 1fr) auto;
        gap: 8px;
        align-items: end;
      }

      .statement-split-line input,
      .statement-split-line select {
        min-height: 40px;
      }

      .split-balanced {
        border-left-color: var(--green);
        background: var(--green-soft);
      }

      .simple-steps {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0 16px;
      }

      .simple-step {
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 13px;
        font-weight: 800;
      }

      .statement-card {
        border: 1px solid var(--line);
        border-left: 5px solid var(--gold);
        border-radius: 12px;
        padding: 14px;
        background: #ffffff;
      }

      .statement-card.verified {
        border-left-color: var(--green);
        background: #fbfffc;
      }

      .statement-card.duplicate {
        border-left-color: var(--danger);
        background: var(--danger-soft);
      }

      .statement-card-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }

      .statement-card-head input[type="checkbox"] {
        width: 22px;
        min-height: 22px;
      }

      .statement-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .statement-description {
        grid-column: 1 / -1;
      }

      .statement-original {
        width: 100%;
        min-height: 520px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--soft);
      }

      details.legacy-tools > summary {
        cursor: pointer;
        font-weight: 800;
        color: var(--green-dark);
        padding: 12px 0;
      }

      .directory-name {
        font-size: 17px;
        font-weight: 800;
      }

      .small {
        font-size: 13px;
      }

      .busy-bar {
        display: none;
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        min-height: 46px;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--green-dark);
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
        font-weight: 800;
      }

      .toast {
        display: none;
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 11;
        min-height: 46px;
        border-radius: 12px;
        padding: 12px 14px;
        background: #ffffff;
        color: var(--ink);
        border: 1px solid rgba(18, 97, 63, 0.16);
        box-shadow: 0 16px 36px rgba(16, 24, 40, 0.18);
        font-weight: 800;
      }

      .toast.show {
        display: block;
      }

      .busy-bar.show {
        display: block;
      }

      .action[disabled],
      button[disabled] {
        cursor: wait;
        opacity: 0.62;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
        background: #ffffff;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        font-size: 13px;
        color: var(--muted);
        background: #f8fbf8;
      }

      .financial-report {
        max-width: 920px;
        margin: 0 auto;
      }

      .financial-report-cover {
        text-align: center;
        padding: 30px 18px;
        border-top: 5px solid var(--green);
      }

      .financial-report-cover h2,
      .financial-report-cover h3 {
        margin-bottom: 6px;
      }

      .financial-statement {
        break-inside: avoid;
      }

      .financial-statement table {
        min-width: 0;
      }

      .financial-statement td:last-child,
      .financial-statement th:last-child {
        text-align: right;
        white-space: nowrap;
      }

      .statement-section-row td {
        padding-top: 18px;
        color: var(--green-dark);
        font-weight: 800;
        border-bottom: 2px solid var(--green);
      }

      .statement-total-row td {
        font-weight: 800;
        border-top: 1px solid var(--ink);
        border-bottom: 3px double var(--ink);
      }

      .statement-subtotal-row td {
        font-weight: 800;
        border-top: 1px solid var(--line);
      }

      .report-note {
        border-top: 1px solid var(--line);
        padding: 16px 0 4px;
        break-inside: avoid;
      }

      .report-note h4 {
        margin: 0 0 8px;
        font-size: 15px;
      }

      .report-note table {
        min-width: 0;
        margin-top: 8px;
      }

      .report-disclosure {
        border-left: 4px solid var(--green);
        background: var(--green-soft);
        padding: 12px;
        border-radius: 8px;
      }

      @media (max-width: 640px) {
        .app-title {
          font-size: 21px;
        }

        main {
          padding: 16px 10px 42px;
        }

        .grid,
        .action-row,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .split-row {
          grid-template-columns: 1fr;
        }

        .statement-split-line {
          grid-template-columns: 1fr;
        }

        .statement-review-scroll {
          width: calc(100% + 28px);
          margin-left: -14px;
          margin-right: -14px;
          border-radius: 0;
        }

        .statement-scroll-controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .statement-scroll-hint {
          grid-column: 1 / -1;
          grid-row: 1;
        }

        .statement-fields,
        .statement-card-head {
          grid-template-columns: 1fr;
        }

        .statement-card-head input[type="checkbox"] {
          width: 24px;
        }

        .statement-original {
          min-height: 380px;
        }

        .panel {
          padding: 14px;
          border-radius: 12px;
        }

        .brand-mark {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }

        .nav button {
          min-height: 44px;
        }
      }

      @media print {
        body {
          background: #ffffff;
          font-size: 11pt;
        }

        .app-header,
        .status-bar,
        .nav,
        .busy-bar,
        .toast,
        #reportControls,
        body > main > section:not(#reportOutput) {
          display: none !important;
        }

        main {
          max-width: none;
          padding: 0;
        }

        #reportOutput {
          display: block !important;
        }

        .panel {
          border: 0;
          box-shadow: none;
          padding: 10px 0;
          margin: 0 0 14px;
        }

        .financial-report-cover {
          padding-top: 60px;
          min-height: 40vh;
        }

        .financial-statement {
          break-before: page;
        }

        .financial-report > .financial-statement:first-child {
          break-before: auto;
        }

        .table-wrap {
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark">94</div>
        <div>
          <h1 class="app-title"><?= appName ?></h1>
          <p class="tagline"><?= tagline ?></p>
        </div>
      </div>
    </header>

    <div class="busy-bar" id="busyBar" role="status" aria-live="polite">Working...</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="status-bar" id="statusBar">
      <span class="badge warn">Loading account access...</span>
    </section>

    <nav class="nav" id="nav" aria-label="Main sections"></nav>

    <main id="app">
      <section class="panel">
        <h2>Loading</h2>
            <p class="muted">Opening the NACO'94 member portal.</p>
      </section>
    </main>

    <script>
      const state = {
        bootstrap: null,
        activeSection: 'dashboard',
        myProfile: null,
        directory: [],
        pendingRequests: [],
        finance: null,
        administration: null,
        currentReport: null,
        busy: false,
        busyTimer: null,
        toastTimer: null
      };

      const sectionContent = {
        dashboard: {
          title: 'Dashboard',
          body: 'View simple financial balances and recent published records.',
          metrics: ['Total Funds Available', 'Bank Balance', 'Cash at Hand', 'Last Updated']
        },
        finances: {
          title: 'Finances',
          body: 'View published money in and money out records.',
          actions: ['Search Transactions', 'View Account Status']
        },
        bankMatching: {
          title: 'Bank Statements',
          body: 'Finance Officers upload an Excel/CSV statement or enter one bank item, then choose simple classifications.',
          actions: ['Upload Excel or CSV', 'Enter One Bank Item']
        },
        reports: {
          title: 'Reports',
          body: 'Generate nonprofit financial statements, cash flows, notes, and specialized project reports from published records.',
          actions: ['Financial Statements', 'Project Reports']
        },
        members: {
          title: 'Members',
          body: 'View the member directory. Members only appear with the details they have chosen to share.',
          actions: ['View Members']
        },
        myProfile: {
          title: 'My Profile',
          body: 'View your details, request updates, and choose what appears in the member directory.',
          actions: ['Update My Details']
        },
        administration: {
          title: 'Administration',
          body: 'System Administrators can manage settings, roles, folders and future setup tasks here.',
          actions: ['View Setup Status', 'Manage Roles']
        }
      };

      function showBusy(message) {
        state.busy = true;
        const busyBar = document.getElementById('busyBar');
        busyBar.textContent = message || 'Working...';
        busyBar.classList.add('show');
        document.querySelectorAll('button.action').forEach(function(button) {
          if (!button.disabled) {
            button.dataset.busyDisabled = '1';
            button.disabled = true;
          }
        });
        clearTimeout(state.busyTimer);
        state.busyTimer = setTimeout(function() {
          hideBusy();
        }, 30000);
      }

      function hideBusy() {
        state.busy = false;
        clearTimeout(state.busyTimer);
        document.getElementById('busyBar').classList.remove('show');
        document.querySelectorAll('button[data-busy-disabled="1"]').forEach(function(button) {
          button.disabled = false;
          delete button.dataset.busyDisabled;
        });
      }

      function showMessage(message) {
        hideBusy();
        showToast(message);
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message || '';
        toast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function() {
          toast.classList.remove('show');
        }, 5000);
      }

      window.alert = showToast;

      function flashWorking(message) {
        if (state.busy) {
          return;
        }
        const busyBar = document.getElementById('busyBar');
        busyBar.textContent = message || 'Working...';
        busyBar.classList.add('show');
        clearTimeout(state.busyTimer);
        state.busyTimer = setTimeout(function() {
          if (!state.busy) {
            busyBar.classList.remove('show');
          }
        }, 8000);
      }

      document.addEventListener('submit', function() {
        flashWorking('Saving...');
      }, true);

      document.addEventListener('click', function(event) {
        if (event.target.closest('button.action')) {
          flashWorking('Working...');
        }
      }, true);

      document.addEventListener('change', function(event) {
        if (event.target.matches('input[type="date"][data-calendar-for]')) {
          const target = document.getElementById(event.target.dataset.calendarFor);
          if (target) {
            target.value = isoToDisplayDate(event.target.value);
          }
        }
      }, true);

      document.addEventListener('blur', function(event) {
        if (event.target.matches('input[placeholder="dd-mm-yyyy"]')) {
          const calendar = document.querySelector(`input[type="date"][data-calendar-for="${event.target.id}"]`);
          if (calendar) {
            calendar.value = displayToIsoDate(event.target.value);
          }
        }
      }, true);

      function loadApp() {
        showBusy('Opening app...');
        google.script.run
          .withSuccessHandler(function(bootstrap) {
            hideBusy();
            state.bootstrap = bootstrap;
            if (bootstrap.navigation.length) {
              state.activeSection = bootstrap.navigation[0].key;
            }
            render();
          })
          .withFailureHandler(function(error) {
            hideBusy();
            renderError(error.message || String(error));
          })
          .getAppBootstrap();
      }

      function render() {
        renderStatus();
        renderNavigation();

        if (!state.bootstrap.user.allowed) {
          renderAccessDenied();
          return;
        }

        if (!state.bootstrap.configured) {
          renderSetupRequired();
          return;
        }

        renderSection(state.activeSection);
      }

      function renderStatus() {
        const user = state.bootstrap.user;
        const roles = user.roles.length ? user.roles.join(', ') : 'No role';
        document.getElementById('statusBar').innerHTML = [
          `<span class="badge ${user.allowed ? 'ok' : 'warn'}">${escapeHtml(user.status)}</span>`,
          `<span class="badge">${escapeHtml(user.email || 'No Google email detected')}</span>`,
          `<span class="badge">${escapeHtml(roles)}</span>`,
          `<span class="badge ${state.bootstrap.configured ? 'ok' : 'warn'}">${state.bootstrap.configured ? 'Configured' : 'Setup needed'}</span>`,
          `<span class="badge">App ${escapeHtml(state.bootstrap.appVersion || '')}</span>`,
          `<span class="badge ${String(state.bootstrap.schemaVersion || '').indexOf('Legacy') === -1 ? 'ok' : 'warn'}">Data ${escapeHtml(state.bootstrap.schemaVersion || '')}</span>`,
          state.bootstrap.verifiedMemberSession ? '<button class="action secondary" type="button" id="signOutButton">Sign Out</button>' : ''
        ].join('');
        const signOutButton = document.getElementById('signOutButton');
        if (signOutButton) {
          signOutButton.addEventListener('click', signOutMemberSession);
        }
      }

      function signOutMemberSession() {
        showBusy('Signing out...');
        google.script.run
          .withSuccessHandler(function() { loadApp(); })
          .withFailureHandler(function(error) { hideBusy(); showToast(error.message || String(error)); })
          .signOutCurrentUser();
      }

      function renderNavigation() {
        const nav = document.getElementById('nav');
        nav.innerHTML = state.bootstrap.navigation.map(function(item) {
          const active = item.key === state.activeSection ? 'active' : '';
          return `<button type="button" class="${active}" data-section="${item.key}">${escapeHtml(item.label)}</button>`;
        }).join('');

        nav.querySelectorAll('button').forEach(function(button) {
          button.addEventListener('click', function() {
            state.activeSection = button.dataset.section;
            render();
          });
        });
      }

      function renderAccessDenied() {
        const needsMemberSignIn = !state.bootstrap.user.allowed && state.bootstrap.memberSignInAvailable;
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Access Needed</h2>
            <p>${escapeHtml(state.bootstrap.user.message)}</p>
            ${needsMemberSignIn ? `
              <p class="muted">Enter the Google email address registered with NACO'94. We will email a six-digit code to confirm it is you.</p>
              <form id="requestSignInCodeForm" class="form-grid">
                ${inputField('Registered Google email', 'Sign-In Email', '', 'email')}
                <div style="grid-column: 1 / -1;"><button class="action" type="submit">Email Me a Code</button></div>
              </form>
              <form id="verifySignInCodeForm" class="form-grid" style="margin-top: 1rem;">
                ${inputField('Registered Google email', 'Verify Email', '', 'email')}
                ${inputField('Six-digit code', 'Sign-In Code', '', 'text')}
                <div style="grid-column: 1 / -1;"><button class="action secondary" type="submit">Verify and Open Ledger</button></div>
              </form>
              <p class="muted small">The code expires after 10 minutes. Check Spam if it does not appear in your Inbox.</p>
            ` : '<p class="muted">The Apps Script owner must complete initial setup.</p>'}
          </section>
        `;
        if (needsMemberSignIn) {
          document.getElementById('requestSignInCodeForm').addEventListener('submit', requestSignInCodeFromUi);
          document.getElementById('verifySignInCodeForm').addEventListener('submit', verifySignInCodeFromUi);
        }
      }

      function requestSignInCodeFromUi(event) {
        event.preventDefault();
        const email = event.target.querySelector('[name="Sign-In Email"]').value;
        showBusy('Sending your sign-in code...');
        google.script.run
          .withSuccessHandler(function(result) {
            hideBusy();
            document.querySelector('[name="Verify Email"]').value = email;
            showMessage(result.message);
          })
          .withFailureHandler(function(error) {
            hideBusy();
            showToast(error.message || String(error));
          })
          .requestMemberSignInCode(email);
      }

      function verifySignInCodeFromUi(event) {
        event.preventDefault();
        const email = event.target.querySelector('[name="Verify Email"]').value;
        const code = event.target.querySelector('[name="Sign-In Code"]').value;
        showBusy('Checking your sign-in code...');
        google.script.run
          .withSuccessHandler(function() { loadApp(); })
          .withFailureHandler(function(error) { hideBusy(); showToast(error.message || String(error)); })
          .verifyMemberSignInCode(email, code);
      }

      function renderSetupRequired() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Setup Needed</h2>
            <p>The app cannot find the saved data spreadsheet ID yet.</p>
            <p class="muted">In Apps Script, run <strong>setupStage1()</strong>. When it finishes, deploy a new web app version and reopen the latest web app link.</p>
          </section>
        `;
      }

      function renderSection(sectionKey) {
        if (sectionKey === 'dashboard') {
          renderDashboard();
          return;
        }

        if (sectionKey === 'finances') {
          renderFinances();
          return;
        }

        if (sectionKey === 'reports') {
          renderReports();
          return;
        }

        if (sectionKey === 'myProfile') {
          renderMyProfile();
          return;
        }

        if (sectionKey === 'members') {
          renderMembers();
          return;
        }

        if (sectionKey === 'administration') {
          renderAdministration();
          return;
        }

        if (sectionKey === 'bankMatching') {
          renderBankStatements();
          return;
        }

        const content = sectionContent[sectionKey] || sectionContent.dashboard;
        const metrics = content.metrics ? renderMetrics(content.metrics) : '';
        const actions = content.actions ? renderActions(content.actions) : '';
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>${escapeHtml(content.title)}</h2>
            <p>${escapeHtml(content.body)}</p>
            <p class="muted">Current stage: ${escapeHtml(state.bootstrap.stage)}</p>
          </section>
          ${metrics}
          ${actions}
        `;
      }

      function renderMetrics(metrics) {
        return `
          <section class="grid">
            ${metrics.map(function(metric) {
              return `
                <div class="metric">
                  <div class="metric-label">${escapeHtml(metric)}</div>
                  <div class="metric-value">--</div>
                </div>
              `;
            }).join('')}
          </section>
        `;
      }

      function renderActions(actions) {
        return `
          <section class="panel">
            <h3>Available Actions</h3>
            <div class="action-row">
              ${actions.map(function(action) {
                return `<button type="button" class="action secondary locked" disabled>${escapeHtml(action)}</button>`;
              }).join('')}
            </div>
          </section>
        `;
      }

      function renderDashboard() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Dashboard</h2>
            <p class="muted">Loading financial summary...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(data) {
            state.finance = data;
            drawDashboard(data);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Dashboard', error.message || String(error));
          })
          .getFinanceData();
      }

      function drawDashboard(data) {
        const summary = data.summary;
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Dashboard</h2>
            <p class="muted">Clear account balances from published records only.</p>
          </section>
          <section class="grid">
            ${metricCard('Total Funds Available', summary.mixedCurrencies ? 'See account currencies' : formatMoney(summary.totalFunds))}
            ${metricCard('Bank Balance', summary.mixedCurrencies ? 'Not combined' : formatMoney(summary.bankBalance))}
            ${metricCard('Cash at Hand', summary.mixedCurrencies ? 'Not combined' : formatMoney(summary.cashAtHand))}
            ${summary.mixedCurrencies ? Object.keys(summary.currencyTotals).sort().map(function(currency) { return metricCard(currency + ' Total', formatMoney(summary.currencyTotals[currency])); }).join('') : ''}
            ${metricCard('Money In This Month', formatMoney(summary.moneyInThisMonth))}
            ${metricCard('Money Out This Month', formatMoney(summary.moneyOutThisMonth))}
            ${metricCard('Money In This Year', formatMoney(summary.moneyInThisYear))}
            ${metricCard('Money Out This Year', formatMoney(summary.moneyOutThisYear))}
            ${(data.canEnterFinance || data.canPublishFinance) ? metricCard('Bank Lines Needing Classification', summary.unclassifiedBankLines) : ''}
            ${(data.canEnterFinance || data.canPublishFinance) ? metricCard('Duplicates Quarantined', summary.quarantinedDuplicates) : ''}
            ${metricCard('Last Updated', formatShortDateTime(summary.lastUpdated))}
          </section>
          ${renderAccountsPanel(data.accounts)}
          ${renderApprovedTransactionsPanel(data.approvedTransactions, false, data.approvedTransactionCount)}
        `;
      }

      function renderFinances() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Finances</h2>
            <p class="muted">Loading finance records...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(data) {
            state.finance = data;
            drawFinances(data);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Finances', error.message || String(error));
          })
          .getFinanceData();
      }

      function refreshFinances(message, focusPublished) {
        google.script.run
          .withSuccessHandler(function(data) {
            state.finance = data;
            drawFinances(data);
            if (message) {
              showMessage(message);
            }
            if (focusPublished) {
              const publishedPanel = document.getElementById('publishedTransactionsPanel');
              if (publishedPanel) { publishedPanel.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
            }
          })
          .withFailureHandler(function(error) {
            renderInlineError('Finances', error.message || String(error));
          })
          .getFinanceData();
      }

      function refreshBankStatements(message) {
        if (message) {
          showMessage(message);
        }
        renderBankStatements();
      }

      function drawFinances(data) {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Finances</h2>
            <p class="muted">Members see published records only. Finance Officers prepare records and Publishers make them visible.</p>
          </section>
          ${renderPublishPanel(data)}
          ${renderApprovedTransactionsPanel(data.approvedTransactions, data.canEnterFinance, data.approvedTransactionCount)}
          <div id="correctionPanel"></div>
          ${renderAccountsPanel(data.accounts)}
          ${renderFinanceEntryPanels(data)}
          <div id="cashPanel"></div>
          ${renderFinanceSettingsPanel(data)}
        `;

        bindFinanceForms(data);
        loadCashPanel();
      }

      function loadCashPanel() {
        google.script.run
          .withSuccessHandler(function(stage6) {
            document.getElementById('cashPanel').innerHTML = renderCashPanel(stage6);
            bindCashControls(stage6);
          })
          .withFailureHandler(function(error) {
            document.getElementById('cashPanel').innerHTML = `<section class="panel message error"><p>${escapeHtml(error.message || String(error))}</p></section>`;
          })
          .getStage6Data();
      }

      function renderCashPanel(stage6) {
        return `
          ${stage6.canEnterCash ? `
            <section class="panel">
              <h3>Cash Count</h3>
              <form id="cashCountForm" class="form-grid">
                ${selectField('Cash account', 'Account ID', stage6.cashAccounts.map(accountOption))}
                ${dateInputField('Count Date', 'Count Date', todayDisplay())}
                <div>
                  <label for="Expected Cash Balance">Expected Cash Balance</label>
                  <input id="Expected Cash Balance" name="Expected Cash Balance" value="Calculating..." readonly aria-readonly="true">
                  <p class="muted small">Calculated automatically from published ledger records.</p>
                </div>
                ${inputField('Actual Cash Counted', 'Actual Cash Counted', '0')}
                <div style="grid-column: 1 / -1;">${textAreaField('Explanation if different', 'Explanation', '')}</div>
                <div style="grid-column: 1 / -1;"><button class="action" type="submit">Save Cash Count</button></div>
              </form>
            </section>
          ` : ''}
          <section class="panel">
            <h3>Recent Cash Counts</h3>
            ${stage6.recentCashCounts.length ? renderCashCountsTable(stage6.recentCashCounts, stage6.canReviewCash) : '<p class="muted">No cash counts yet.</p>'}
          </section>
        `;
      }

      function renderCashCountsTable(cashCounts, canReviewCash) {
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Expected</th><th>Actual</th><th>Difference</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>
                ${cashCounts.map(function(item) {
                  return `<tr><td>${escapeHtml(item.countDate)}</td><td>${formatMoney(item.expectedCashBalance)}</td><td>${formatMoney(item.actualCashCounted)}</td><td>${formatMoney(item.difference)}</td><td><span class="badge">${escapeHtml(item.status)}</span></td><td>${canReviewCash && item.status !== 'Reviewed' ? `<button class="action secondary" type="button" data-review-cash="${escapeAttr(item.cashCountId)}">Review</button>` : ''}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function bindCashControls(stage6) {
        const form = document.getElementById('cashCountForm');
        if (form) {
          const accountInput = form.querySelector('[name="Account ID"]');
          const dateInput = form.querySelector('[name="Count Date"]');
          accountInput.addEventListener('change', refreshCashExpectedBalance);
          dateInput.addEventListener('change', refreshCashExpectedBalance);
          dateInput.addEventListener('blur', refreshCashExpectedBalance);
          refreshCashExpectedBalance();
          form.addEventListener('submit', function(event) {
            event.preventDefault();
          google.script.run
            .withSuccessHandler(function(result) {
              refreshFinances('Cash count saved. Difference: ' + formatMoney(result.difference));
            })
              .withFailureHandler(function(error) {
                alert(error.message || String(error));
              })
              .recordCashCount(readFormValues(event.target));
          });
        }

        document.querySelectorAll('[data-review-cash]').forEach(function(button) {
          button.addEventListener('click', function() {
            const note = prompt('Cash count review note', '') || '';
            google.script.run
              .withSuccessHandler(function() { refreshFinances('Cash count reviewed.'); })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .reviewCashCount(button.dataset.reviewCash, note);
          });
        });
      }

      function refreshCashExpectedBalance() {
        const form = document.getElementById('cashCountForm');
        if (!form) {
          return;
        }
        const accountId = form.querySelector('[name="Account ID"]').value;
        const countDate = form.querySelector('[name="Count Date"]').value;
        const expectedInput = form.querySelector('[name="Expected Cash Balance"]');
        if (!accountId || !countDate) {
          expectedInput.value = '';
          return;
        }
        expectedInput.value = 'Calculating...';
        google.script.run
          .withSuccessHandler(function(result) {
            expectedInput.value = formatMoney(result.expectedCashBalance);
          })
          .withFailureHandler(function(error) {
            expectedInput.value = '';
            showToast(error.message || String(error));
          })
          .getExpectedCashBalance(accountId, countDate);
      }

      function renderFinanceEntryPanels(data) {
        if (!data.canEnterFinance) {
          return '';
        }

        return `
          <section class="panel">
            <h3>Add Money In</h3>
            <form id="moneyInForm" class="form-grid">
              ${dateInputField('Date', 'Date', todayDisplay())}
              ${inputField('Amount', 'Amount', '')}
              ${selectField('Account received into', 'Account ID', data.accounts.map(accountOption))}
              ${inputField('Source or payer', 'Payer or Payee', '')}
              ${selectField('Category', 'Category ID', data.categories.filter(function(category) { return category.categoryType === 'Money In'; }).map(categoryOption))}
              ${inputField('Reference number', 'Reference Number', '')}
              ${inputField('Payment method', 'Payment Method', '')}
              ${selectField('Related fund or project', 'Fund ID', [{ value: '', label: 'None' }].concat(data.funds.map(fundOption)))}
              ${fileField('Receipt or proof of payment', 'Proof File', 'application/pdf,image/jpeg,image/png', 'Optional. PDF, JPG, or PNG up to 5 MB.')}
              <div style="grid-column: 1 / -1;">${textAreaField('Description', 'Description', '')}</div>
              <div style="grid-column: 1 / -1;"><button class="action" type="submit">Submit Money In</button></div>
            </form>
          </section>
          <section class="panel">
            <h3>Add Money Out</h3>
            <form id="moneyOutForm" class="form-grid">
              ${dateInputField('Date', 'Date', todayDisplay())}
              ${inputField('Amount', 'Amount', '')}
              ${selectField('Account paid from', 'Account ID', data.accounts.map(accountOption))}
              ${inputField('Payee', 'Payer or Payee', '')}
              ${selectField('Category', 'Category ID', data.categories.filter(function(category) { return category.categoryType === 'Money Out'; }).map(categoryOption))}
              ${inputField('Reference number', 'Reference Number', '')}
              ${inputField('Payment method', 'Payment Method', '')}
              ${selectField('Related fund or project', 'Fund ID', [{ value: '', label: 'None' }].concat(data.funds.map(fundOption)))}
              ${fileField('Receipt, invoice or proof', 'Proof File', 'application/pdf,image/jpeg,image/png', 'Optional. PDF, JPG, or PNG up to 5 MB.')}
              <div style="grid-column: 1 / -1;">${textAreaField('Description', 'Description', '')}</div>
              <div style="grid-column: 1 / -1;"><button class="action" type="submit">Submit Money Out</button></div>
            </form>
          </section>
        `;
      }

      function renderPublishPanel(data) {
        if (!data.canPublishFinance) {
          if (!data.pendingTransactions.length) {
            return '';
          }
          return `
            <section class="panel message">
              <h3>Waiting for a Publisher</h3>
              <p><strong>${escapeHtml(data.pendingTransactions.length)} transaction(s)</strong> have been sent for publishing.</p>
              <p class="muted">This account can view them but cannot publish them. Sign in with a separate account that has the <strong>Publisher</strong> role. The person who entered a transaction cannot publish the same transaction.</p>
              ${renderTransactionTable(data.pendingTransactions, false, false)}
            </section>
          `;
        }

        return `
          <section class="panel">
            <h3>Ready to Publish</h3>
            ${data.pendingTransactions.some(function(transaction) { return !transaction.correctionBatchId && !transaction.transferGroupId; }) ? `<div class="action-row"><button class="action secondary" type="button" id="selectPublishRows">Select Ordinary Rows</button><button class="action" type="button" id="publishSelectedRows">Publish Selected</button><button class="action danger" type="button" id="sendBackSelectedRows">Send Back Selected</button></div>` : ''}
            ${data.pendingTransactions.length ? renderTransactionTable(data.pendingTransactions, true) : '<p class="muted">No transactions are ready to publish.</p>'}
          </section>
        `;
      }

      function renderFinanceSettingsPanel(data) {
        if (!data.canManageFinanceSettings) {
          return '';
        }

        return `
          <section class="panel">
            <h3>Add Account</h3>
            <form id="accountForm" class="form-grid">
              ${inputField('Account Name', 'Account Name', '')}
              ${selectField('Account Type', 'Account Type', [
                { value: 'Bank Account', label: 'Bank Account' },
                { value: 'Cash at Hand', label: 'Cash at Hand' },
                { value: 'Welfare Fund', label: 'Welfare Fund' },
                { value: 'School Project Fund', label: 'School Project Fund' },
                { value: 'Reunion or Event Fund', label: 'Reunion or Event Fund' },
                { value: 'General Association Fund', label: 'General Association Fund' },
                { value: 'Other Special Project Fund', label: 'Other Special Project Fund' }
              ])}
              ${inputField('Opening Balance', 'Opening Balance', '0')}
              ${inputField('Currency', 'Currency', 'NGN')}
              ${inputField('Masked Bank Account Number', 'Masked Bank Account Number', '')}
              <div style="grid-column: 1 / -1;">${textAreaField('Notes', 'Notes', '')}</div>
              <div style="grid-column: 1 / -1;"><button class="action" type="submit">Add Account</button></div>
            </form>
          </section>
          <section class="panel">
            <h3>Add Fund or Project</h3>
            <form id="fundForm" class="form-grid">
              ${inputField('Fund or project name', 'name', '')}
              ${selectField('Type', 'type', [
                { value: 'General Association Fund', label: 'General Association Fund' },
                { value: 'Welfare Fund', label: 'Welfare Fund' },
                { value: 'School Project Fund', label: 'School Project Fund' },
                { value: 'Reunion or Event Fund', label: 'Reunion or Event Fund' },
                { value: 'Other Special Project Fund', label: 'Other Special Project Fund' }
              ])}
              <div style="grid-column: 1 / -1;">${textAreaField('Notes', 'notes', '')}</div>
              <div style="grid-column: 1 / -1;"><button class="action" type="submit">Add Fund or Project</button></div>
            </form>
          </section>
          <section class="panel">
            <h3>Add Income or Expense Category</h3>
            <form id="categoryForm" class="form-grid">
              ${selectField('Type', 'categoryType', [
                { value: 'Money In', label: 'Money In' },
                { value: 'Money Out', label: 'Money Out' }
              ])}
              ${inputField('Category name', 'categoryName', '')}
              <div style="grid-column: 1 / -1;"><button class="action" type="submit">Add Category</button></div>
            </form>
          </section>
        `;
      }

      function renderAccountsPanel(accounts) {
        return `
          <section class="panel">
            <h3>Account Status</h3>
            ${accounts.length ? `
              <div class="grid">
                ${accounts.map(function(account) {
                  return metricCard(account.accountName, formatMoney(account.currentBalance) + ' ' + escapeHtml(account.currency) + (account.lockedThrough ? ' · Locked through ' + isoToDisplayDate(account.lockedThrough) : ''));
                }).join('')}
              </div>
            ` : '<p class="muted">No active accounts have been added yet.</p>'}
          </section>
        `;
      }

      function renderApprovedTransactionsPanel(transactions, canCorrect, totalCount) {
        totalCount = Number(totalCount || transactions.length || 0);
        return `
          <section class="panel" id="publishedTransactionsPanel">
            <h3>Recent Published Transactions</h3>
            <p class="muted small">Newest records appear first. ${totalCount > transactions.length ? `Showing the newest ${escapeHtml(transactions.length)} of ${escapeHtml(totalCount)} published records; use Reports to find older records.` : `${escapeHtml(totalCount)} published record(s) in total.`}</p>
            ${transactions.length ? renderTransactionTable(transactions, false, canCorrect) : '<p class="muted">No published transactions yet.</p>'}
          </section>
        `;
      }

      function renderTransactionTable(transactions, reviewMode, canCorrect) {
        return `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  ${reviewMode ? '<th>Select</th>' : ''}
                  <th>Type</th>
                  <th>Description</th>
                  <th>Amount</th>
                  <th>Status</th>
                  ${(reviewMode || canCorrect) ? '<th>Action</th>' : ''}
                </tr>
              </thead>
              <tbody>
                ${transactions.map(function(transaction) {
                  return `
                    <tr>
                      <td>${escapeHtml(transaction.date)}</td>
                      ${reviewMode ? `<td>${!transaction.correctionBatchId && !transaction.transferGroupId ? `<input type="checkbox" name="Publish Selection" value="${escapeAttr(transaction.transactionId)}" style="width:22px;min-height:22px;">` : ''}</td>` : ''}
                      <td>${escapeHtml(transaction.transactionType)}</td>

      function viewFinanceEvidence(documentId) {
        const evidenceWindow = window.open('', '_blank');
        if (evidenceWindow) { evidenceWindow.document.body.textContent = 'Opening private evidence...'; }
        google.script.run
          .withSuccessHandler(function(evidence) {
            const binary = atob(evidence.base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
            const url = URL.createObjectURL(new Blob([bytes], { type: evidence.mimeType }));
            if (evidenceWindow) { evidenceWindow.location = url; } else { window.open(url, '_blank'); }
          })
          .withFailureHandler(function(error) {
            if (evidenceWindow) { evidenceWindow.close(); }
            alert(error.message || String(error));
          })
          .getStatementEvidenceForReview(documentId);
      }

        if (reason === null) { return; }

        showBusy('Reviewing selected transactions...');

          .withSuccessHandler(function(result) { hideBusy(); refreshFinances(result.count + ' transaction(s) ' + decision.toLowerCase() + '.', decision === 'Published'); })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .publishTransactionsBatch(ids, decision, reason);
      }

        const transactionAccount = (state.finance.accounts || []).filter(function(account) { return account.accountId === transaction.accountId; })[0];

        const panel = document.getElementById('correctionPanel');
        panel.innerHTML = `
          <section class="panel message">

              ${selectField('Correct type', 'Transaction Type', [

      function submitFinanceTransaction(event, methodName) {
        event.preventDefault();
        const record = readFormValues(event.target);
        const fileInput = event.target.querySelector('input[type="file"]');
        const file = fileInput && fileInput.files.length ? fileInput.files[0] : null;

        if (!file) {
          submitFinanceRecord(methodName, record);
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          alert('File is too large. Maximum size is 5 MB.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function() {
          google.script.run
            .withSuccessHandler(function(documentResult) {
              record['Document ID'] = documentResult.documentId;
              submitFinanceRecord(methodName, record);
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .uploadFinanceDocument({
              fileName: file.name,
              mimeType: file.type,
              base64: String(reader.result).split(',')[1],
              visibility: 'Finance Only'
            });
        };
        reader.readAsDataURL(file);
      }
