<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --green: #12613f;
        --green-dark: #0b3f2b;
        --green-soft: #eaf6ef;
        --gold: #c99b20;
        --gold-soft: #fff7df;
        --ink: #1d2939;
        --muted: #667085;
        --line: #dde5df;
        --soft: #f6f8f5;
        --surface: #ffffff;
        --danger: #b42318;
        --danger-soft: #fff1f2;
        --warning: #946200;
        --ok: #166534;
        --shadow: 0 10px 28px rgba(18, 97, 63, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(201, 155, 32, 0.12), transparent 32rem),
          linear-gradient(180deg, #f7fbf8 0%, #ffffff 42%);
        line-height: 1.5;
        font-size: 16px;
      }

      .app-header {
        background:
          linear-gradient(135deg, rgba(11, 63, 43, 0.96), rgba(18, 97, 63, 0.94)),
          var(--green);
        color: #ffffff;
        padding: 22px 16px 20px;
        border-bottom: 4px solid var(--gold);
      }

      .brand-row {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff3bf;
        font-weight: 900;
        letter-spacing: 0;
        flex: 0 0 auto;
      }

      .app-title {
        margin: 0;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .tagline {
        margin: 5px 0 0;
        color: #ffe7a3;
        font-size: 15px;
      }

      .status-bar {
        display: flex;
        gap: 8px;
        align-items: center;
        overflow-x: auto;
        border-bottom: 1px solid rgba(18, 97, 63, 0.12);
        padding: 12px max(12px, calc((100vw - 1120px) / 2 + 14px));
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid #d9e7dd;
        background: #ffffff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.ok {
        border-color: #bfe8cb;
        background: #effaf2;
        color: var(--ok);
      }

      .badge.warn {
        border-color: #f6d777;
        background: var(--gold-soft);
        color: var(--warning);
      }

      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px max(12px, calc((100vw - 1120px) / 2 + 14px));
        border-bottom: 1px solid rgba(18, 97, 63, 0.12);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .nav button {
        min-height: 42px;
        padding: 10px 15px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      }

      .nav button.active {
        background: var(--green);
        border-color: var(--green);
        color: #ffffff;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 22px 14px 56px;
      }

      .panel {
        border: 1px solid rgba(18, 97, 63, 0.12);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      h2 {
        margin: 0 0 8px;
        font-size: 23px;
        line-height: 1.2;
      }

      h3 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 10px;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        min-height: 100px;
        border: 1px solid rgba(18, 97, 63, 0.12);
        border-radius: 14px;
        padding: 14px;
        background: linear-gradient(180deg, #ffffff, #f8fbf8);
        box-shadow: 0 6px 18px rgba(16, 24, 40, 0.04);
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: 24px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .action-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .action {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        background: var(--green);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 8px 16px rgba(18, 97, 63, 0.18);
      }

      .action.secondary {
        background: #ffffff;
        border: 1px solid var(--green);
        color: var(--green-dark);
      }

      .action.danger {
        background: #ffffff;
        border: 1px solid var(--danger);
        color: var(--danger);
      }

      .locked {
        opacity: 0.58;
      }

      .message {
        border-left: 4px solid var(--gold);
        background: var(--gold-soft);
        padding: 12px;
        border-radius: 10px;
      }

      .error {
        border-left-color: var(--danger);
        background: #fff1f2;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 5px;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        font: inherit;
        background: #ffffff;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus {
        outline: 3px solid rgba(201, 155, 32, 0.28);
        outline-offset: 2px;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      .check-list {
        display: grid;
        gap: 8px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
      }

      .check-item input {
        width: 20px;
        min-height: 20px;
      }

      .directory-list,
      .request-list {
        display: grid;
        gap: 10px;
      }

      .directory-card,
      .request-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--soft);
      }

      .directory-name {
        font-size: 17px;
        font-weight: 800;
      }

      .small {
        font-size: 13px;
      }

      .busy-bar {
        display: none;
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        min-height: 46px;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--green-dark);
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
        font-weight: 800;
      }

      .toast {
        display: none;
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 11;
        min-height: 46px;
        border-radius: 12px;
        padding: 12px 14px;
        background: #ffffff;
        color: var(--ink);
        border: 1px solid rgba(18, 97, 63, 0.16);
        box-shadow: 0 16px 36px rgba(16, 24, 40, 0.18);
        font-weight: 800;
      }

      .toast.show {
        display: block;
      }

      .busy-bar.show {
        display: block;
      }

      .action[disabled],
      button[disabled] {
        cursor: wait;
        opacity: 0.62;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
        background: #ffffff;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        font-size: 13px;
        color: var(--muted);
        background: #f8fbf8;
      }

      @media (max-width: 640px) {
        .app-title {
          font-size: 21px;
        }

        main {
          padding: 16px 10px 42px;
        }

        .grid,
        .action-row,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 14px;
          border-radius: 12px;
        }

        .brand-mark {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }

        .nav button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark">94</div>
        <div>
          <h1 class="app-title"><?= appName ?></h1>
          <p class="tagline"><?= tagline ?></p>
        </div>
      </div>
    </header>

    <div class="busy-bar" id="busyBar" role="status" aria-live="polite">Working...</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="status-bar" id="statusBar">
      <span class="badge warn">Loading account access...</span>
    </section>

    <nav class="nav" id="nav" aria-label="Main sections"></nav>

    <main id="app">
      <section class="panel">
        <h2>Loading</h2>
            <p class="muted">Opening the NACO'94 member portal.</p>
      </section>
    </main>

    <script>
      const state = {
        bootstrap: null,
        activeSection: 'dashboard',
        myProfile: null,
        directory: [],
        pendingRequests: [],
        finance: null,
        administration: null,
        busy: false,
        busyTimer: null,
        toastTimer: null
      };

      const sectionContent = {
        dashboard: {
          title: 'Dashboard',
          body: 'View simple financial balances and recent published records.',
          metrics: ['Total Funds Available', 'Bank Balance', 'Cash at Hand', 'Last Updated']
        },
        finances: {
          title: 'Finances',
          body: 'View published money in and money out records.',
          actions: ['Search Transactions', 'View Account Status']
        },
        bankMatching: {
          title: 'Bank Matching',
          body: 'Finance Officers and Publishers will match bank statement entries to published records here in Stage 5.',
          actions: ['Upload Bank Statement', 'Match Bank Entries']
        },
        reports: {
          title: 'Reports',
          body: 'Published monthly, quarterly and annual reports will appear here when reporting is added.',
          actions: ['Monthly Summary', 'Annual Summary']
        },
        members: {
          title: 'Members',
          body: 'View the member directory. Members only appear with the details they have chosen to share.',
          actions: ['View Members']
        },
        myProfile: {
          title: 'My Profile',
          body: 'View your details, request updates, and choose what appears in the member directory.',
          actions: ['Update My Details']
        },
        administration: {
          title: 'Administration',
          body: 'System Administrators can manage settings, roles, folders and future setup tasks here.',
          actions: ['View Setup Status', 'Manage Roles']
        }
      };

      function showBusy(message) {
        state.busy = true;
        const busyBar = document.getElementById('busyBar');
        busyBar.textContent = message || 'Working...';
        busyBar.classList.add('show');
        document.querySelectorAll('button.action').forEach(function(button) {
          if (!button.disabled) {
            button.dataset.busyDisabled = '1';
            button.disabled = true;
          }
        });
        clearTimeout(state.busyTimer);
        state.busyTimer = setTimeout(function() {
          hideBusy();
        }, 30000);
      }

      function hideBusy() {
        state.busy = false;
        clearTimeout(state.busyTimer);
        document.getElementById('busyBar').classList.remove('show');
        document.querySelectorAll('button[data-busy-disabled="1"]').forEach(function(button) {
          button.disabled = false;
          delete button.dataset.busyDisabled;
        });
      }

      function showMessage(message) {
        hideBusy();
        showToast(message);
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message || '';
        toast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function() {
          toast.classList.remove('show');
        }, 5000);
      }

      window.alert = showToast;

      function flashWorking(message) {
        if (state.busy) {
          return;
        }
        const busyBar = document.getElementById('busyBar');
        busyBar.textContent = message || 'Working...';
        busyBar.classList.add('show');
        clearTimeout(state.busyTimer);
        state.busyTimer = setTimeout(function() {
          if (!state.busy) {
            busyBar.classList.remove('show');
          }
        }, 8000);
      }

      document.addEventListener('submit', function() {
        flashWorking('Saving...');
      }, true);

      document.addEventListener('click', function(event) {
        if (event.target.closest('button.action')) {
          flashWorking('Working...');
        }
      }, true);

      document.addEventListener('change', function(event) {
        if (event.target.matches('input[type="date"][data-calendar-for]')) {
          const target = document.getElementById(event.target.dataset.calendarFor);
          if (target) {
            target.value = isoToDisplayDate(event.target.value);
          }
        }
      }, true);

      document.addEventListener('blur', function(event) {
        if (event.target.matches('input[placeholder="dd-mm-yyyy"]')) {
          const calendar = document.querySelector(`input[type="date"][data-calendar-for="${event.target.id}"]`);
          if (calendar) {
            calendar.value = displayToIsoDate(event.target.value);
          }
        }
      }, true);

      function loadApp() {
        showBusy('Opening app...');
        google.script.run
          .withSuccessHandler(function(bootstrap) {
            hideBusy();
            state.bootstrap = bootstrap;
            if (bootstrap.navigation.length) {
              state.activeSection = bootstrap.navigation[0].key;
            }
            render();
          })
          .withFailureHandler(function(error) {
            hideBusy();
            renderError(error.message || String(error));
          })
          .getAppBootstrap();
      }

      function render() {
        renderStatus();
        renderNavigation();

        if (!state.bootstrap.user.allowed) {
          renderAccessDenied();
          return;
        }

        renderSection(state.activeSection);
      }

      function renderStatus() {
        const user = state.bootstrap.user;
        const roles = user.roles.length ? user.roles.join(', ') : 'No role';
        document.getElementById('statusBar').innerHTML = [
          `<span class="badge ${user.allowed ? 'ok' : 'warn'}">${escapeHtml(user.status)}</span>`,
          `<span class="badge">${escapeHtml(user.email || 'No Google email detected')}</span>`,
          `<span class="badge">${escapeHtml(roles)}</span>`,
          `<span class="badge ${state.bootstrap.configured ? 'ok' : 'warn'}">${state.bootstrap.configured ? 'Configured' : 'Setup needed'}</span>`
        ].join('');
      }

      function renderNavigation() {
        const nav = document.getElementById('nav');
        nav.innerHTML = state.bootstrap.navigation.map(function(item) {
          const active = item.key === state.activeSection ? 'active' : '';
          return `<button type="button" class="${active}" data-section="${item.key}">${escapeHtml(item.label)}</button>`;
        }).join('');

        nav.querySelectorAll('button').forEach(function(button) {
          button.addEventListener('click', function() {
            state.activeSection = button.dataset.section;
            render();
          });
        });
      }

      function renderAccessDenied() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Access Needed</h2>
            <p>${escapeHtml(state.bootstrap.user.message)}</p>
            <p class="muted">Ask the Membership Administrator or System Administrator to add your Google email address to the Users sheet.</p>
          </section>
        `;
      }

      function renderSection(sectionKey) {
        if (sectionKey === 'dashboard') {
          renderDashboard();
          return;
        }

        if (sectionKey === 'finances') {
          renderFinances();
          return;
        }

        if (sectionKey === 'reports') {
          renderReports();
          return;
        }

        if (sectionKey === 'myProfile') {
          renderMyProfile();
          return;
        }

        if (sectionKey === 'members') {
          renderMembers();
          return;
        }

        if (sectionKey === 'administration') {
          renderAdministration();
          return;
        }

        if (sectionKey === 'bankMatching') {
          renderBankStatements();
          return;
        }

        const content = sectionContent[sectionKey] || sectionContent.dashboard;
        const metrics = content.metrics ? renderMetrics(content.metrics) : '';
        const actions = content.actions ? renderActions(content.actions) : '';
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>${escapeHtml(content.title)}</h2>
            <p>${escapeHtml(content.body)}</p>
            <p class="muted">Current stage: ${escapeHtml(state.bootstrap.stage)}</p>
          </section>
          ${metrics}
          ${actions}
        `;
      }

      function renderMetrics(metrics) {
        return `
          <section class="grid">
            ${metrics.map(function(metric) {
              return `
                <div class="metric">
                  <div class="metric-label">${escapeHtml(metric)}</div>
                  <div class="metric-value">--</div>
                </div>
              `;
            }).join('')}
          </section>
        `;
      }

      function renderActions(actions) {
        return `
          <section class="panel">
            <h3>Available Actions</h3>
            <div class="action-row">
              ${actions.map(function(action) {
                return `<button type="button" class="action secondary locked" disabled>${escapeHtml(action)}</button>`;
              }).join('')}
            </div>
          </section>
        `;
      }

      function renderDashboard() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Dashboard</h2>
            <p class="muted">Loading financial summary...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(data) {
            state.finance = data;
            drawDashboard(data);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Dashboard', error.message || String(error));
          })
          .getFinanceData();
      }

      function drawDashboard(data) {
        const summary = data.summary;
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Dashboard</h2>
            <p class="muted">Clear account balances from published records only.</p>
          </section>
          <section class="grid">
            ${metricCard('Total Funds Available', formatMoney(summary.totalFunds))}
            ${metricCard('Bank Balance', formatMoney(summary.bankBalance))}
            ${metricCard('Cash at Hand', formatMoney(summary.cashAtHand))}
            ${metricCard('Money In This Month', formatMoney(summary.moneyInThisMonth))}
            ${metricCard('Money Out This Month', formatMoney(summary.moneyOutThisMonth))}
            ${metricCard('Money In This Year', formatMoney(summary.moneyInThisYear))}
            ${metricCard('Money Out This Year', formatMoney(summary.moneyOutThisYear))}
            ${metricCard('Last Updated', formatShortDateTime(summary.lastUpdated))}
          </section>
          ${renderAccountsPanel(data.accounts)}
          ${renderApprovedTransactionsPanel(data.approvedTransactions)}
        `;
      }

      function renderFinances() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Finances</h2>
            <p class="muted">Loading finance records...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(data) {
            state.finance = data;
            drawFinances(data);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Finances', error.message || String(error));
          })
          .getFinanceData();
      }

      function drawFinances(data) {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Finances</h2>
            <p class="muted">Members see published records only. Finance Officers prepare records and Publishers make them visible.</p>
          </section>
          ${renderFinanceEntryPanels(data)}
          <div id="cashPanel"></div>
          ${renderPublishPanel(data)}
          ${renderFinanceSettingsPanel(data)}
          ${renderAccountsPanel(data.accounts)}
          ${renderApprovedTransactionsPanel(data.approvedTransactions)}
        `;

        bindFinanceForms(data);
        loadCashPanel();
      }

      function loadCashPanel() {
        google.script.run
          .withSuccessHandler(function(stage6) {
            document.getElementById('cashPanel').innerHTML = renderCashPanel(stage6);
            bindCashControls(stage6);
          })
          .withFailureHandler(function(error) {
            document.getElementById('cashPanel').innerHTML = `<section class="panel message error"><p>${escapeHtml(error.message || String(error))}</p></section>`;
          })
          .getStage6Data();
      }

      function renderCashPanel(stage6) {
        return `
          ${stage6.canEnterCash ? `
            <section class="panel">
              <h3>Cash Count</h3>
              <form id="cashCountForm" class="form-grid">
                ${selectField('Cash account', 'Account ID', stage6.cashAccounts.map(accountOption))}
                ${dateInputField('Count Date', 'Count Date', todayDisplay())}
                ${inputField('Expected Cash Balance', 'Expected Cash Balance', '0')}
                ${inputField('Actual Cash Counted', 'Actual Cash Counted', '0')}
                <div style="grid-column: 1 / -1;">${textAreaField('Explanation if different', 'Explanation', '')}</div>
                <div style="grid-column: 1 / -1;"><button class="action" type="submit">Save Cash Count</button></div>
              </form>
            </section>
          ` : ''}
          <section class="panel">
            <h3>Recent Cash Counts</h3>
            ${stage6.recentCashCounts.length ? renderCashCountsTable(stage6.recentCashCounts, stage6.canReviewCash) : '<p class="muted">No cash counts yet.</p>'}
          </section>
        `;
      }

      function renderCashCountsTable(cashCounts, canReviewCash) {
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Expected</th><th>Actual</th><th>Difference</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>
                ${cashCounts.map(function(item) {
                  return `<tr><td>${escapeHtml(item.countDate)}</td><td>${formatMoney(item.expectedCashBalance)}</td><td>${formatMoney(item.actualCashCounted)}</td><td>${formatMoney(item.difference)}</td><td><span class="badge">${escapeHtml(item.status)}</span></td><td>${canReviewCash && item.status !== 'Reviewed' ? `<button class="action secondary" type="button" data-review-cash="${escapeAttr(item.cashCountId)}">Review</button>` : ''}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function bindCashControls(stage6) {
        const form = document.getElementById('cashCountForm');
        if (form) {
          form.addEventListener('submit', function(event) {
            event.preventDefault();
            google.script.run
              .withSuccessHandler(function(result) {

      function submitFinanceTransaction(event, methodName) {
        event.preventDefault();
        const record = readFormValues(event.target);
        const fileInput = event.target.querySelector('input[type="file"]');
        const file = fileInput && fileInput.files.length ? fileInput.files[0] : null;

        if (!file) {
          submitFinanceRecord(methodName, record);
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          alert('File is too large. Maximum size is 5 MB.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function() {
          google.script.run
            .withSuccessHandler(function(documentResult) {
              record['Document ID'] = documentResult.documentId;
              submitFinanceRecord(methodName, record);
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .uploadFinanceDocument({
              fileName: file.name,
              mimeType: file.type,
              base64: String(reader.result).split(',')[1],
              visibility: 'Finance Only'
            });
        };
        reader.readAsDataURL(file);
      }

      function renderCsvPreview(preview, accountId) {
        const fields = [
          { key: 'date', label: 'Date column' },
          { key: 'description', label: 'Description column' },
          { key: 'moneyIn', label: 'Money-in column' },
          { key: 'moneyOut', label: 'Money-out column' },
          { key: 'amount', label: 'Amount column' },
          { key: 'balance', label: 'Balance column' },
          { key: 'reference', label: 'Reference column' }
        ];
        const options = [{ value: '', label: 'Not used' }].concat(preview.headers.map(function(header) {
          return { value: header, label: header };
        }));

        document.getElementById('csvPreview').innerHTML = `
          <hr>
          <h3>CSV Preview</h3>
          <p class="muted">${escapeHtml(preview.rowCount)} rows found. Confirm the columns before importing.</p>
          <form id="csvImportForm" class="form-grid">
            ${fields.map(function(field) {
              return selectField(field.label, field.key, options.map(function(option) {
                return {
                  value: option.value,
                  label: option.label,
                  selected: option.value === preview.suggestedMapping[field.key]
                };
              }));
            }).join('')}
            <div style="grid-column: 1 / -1;"><button class="action" type="submit">Import CSV Lines</button></div>
          </form>
          <div class="table-wrap">
            <table>
              <thead><tr>${preview.headers.map(function(header) { return `<th>${escapeHtml(header)}</th>`; }).join('')}</tr></thead>
              <tbody>
                ${preview.previewRows.map(function(row) {
                  return `<tr>${row.map(function(value) { return `<td>${escapeHtml(value)}</td>`; }).join('')}</tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('csvImportForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const mapping = readFormValues(event.target);
          google.script.run
            .withSuccessHandler(function(result) {
              alert('Imported ' + result.rowsImported + ' bank lines' + (result.duplicateWarning ? ' with duplicate warning.' : '.'));
              renderBankStatements();
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .importBankCsv({
              accountId: accountId,
              fileName: preview.fileName,
              rawBase64: preview.rawBase64,
              mapping: mapping
            });
        });
      }

      function editUserAccess(event) {

        form.querySelector('[name="User ID"]').value = user.userId;
        form.querySelector('[name="Email"]').value = user.email;
        form.querySelector('[name="Full Name"]').value = user.fullName;
        form.querySelector('[name="Member ID"]').value = user.memberId || '';

        const roles = user.roles.split(',').map(function(role) { return role.trim(); });

          input.checked = roles.indexOf(input.value) !== -1;

            </table>
          </div>
        `;
      }

      function downloadCsv(csv, fileName) {
        const blob = new Blob([csv || ''], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function makeReportFileName(reportType) {
        const safeName = String(reportType || 'report')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'report';
        return `naco-94-${safeName}-${todayIso()}.csv`;
      }

      function drawMembers(directory) {
        const canAdminMembers = state.bootstrap.user.roles.includes('Membership Administrator') || state.bootstrap.user.roles.includes('System Administrator');
        const adminPanel = canAdminMembers ? renderMembershipAdminPanel() : '';
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Members</h2>
            <p class="muted">The directory only shows details each member has agreed to share.</p>
          </section>
          <section class="directory-list">
            ${directory.length ? directory.map(renderDirectoryCard).join('') : '<div class="panel">No members are visible in the directory yet.</div>'}
          </section>
          ${adminPanel}
        `;

        if (canAdminMembers) {
          document.getElementById('addMemberForm').addEventListener('submit', submitAddMember);
          loadPendingRequests();
        }
      }

      function renderMembershipAdminPanel() {
        return `
          <section class="panel">
            <h3>Add Member</h3>
            <form id="addMemberForm" class="form-grid">
              ${inputField('Full Name', 'Full Name', '')}
              ${inputField('Preferred Name', 'Preferred Name', '')}
              ${inputField('Email Address', 'Email Address', '')}
              ${birthdayField('Birthday Day/Month', 'Date of Birth', '')}
              ${inputField('Phone Number', 'Phone Number', '')}
              ${inputField('City', 'City', '')}
              ${inputField('State', 'State', '')}
              ${inputField('Country', 'Country', 'Nigeria')}
              ${inputField('Occupation', 'Occupation', '')}
              <div style="grid-column: 1 / -1;">
                <button class="action" type="submit">Add Member</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <h3>Profile Update Requests</h3>
            <div id="pendingRequests" class="request-list">
              <p class="muted">Loading requests...</p>
            </div>
          </section>
        `;
      }

      function renderDirectoryCard(member) {
        return `
          <article class="directory-card">
            <div class="directory-name">${escapeHtml(member.name || 'Name hidden')}</div>
            ${member.cityCountry ? `<div>${escapeHtml(member.cityCountry)}</div>` : ''}
            ${member.occupation ? `<div>${escapeHtml(member.occupation)}</div>` : ''}
            ${member.phoneNumber ? `<div class="small">Phone: ${escapeHtml(member.phoneNumber)}</div>` : ''}
            ${member.emailAddress ? `<div class="small">Email: ${escapeHtml(member.emailAddress)}</div>` : ''}
          </article>
        `;
      }

      function loadPendingRequests() {
        google.script.run
          .withSuccessHandler(function(requests) {
            state.pendingRequests = requests;
            document.getElementById('pendingRequests').innerHTML = requests.length
              ? requests.map(renderRequestCard).join('')
              : '<p class="muted">No pending profile update requests.</p>';
            document.querySelectorAll('[data-review-request]').forEach(function(button) {
              button.addEventListener('click', reviewRequest);
            });
          })
          .withFailureHandler(function(error) {
            document.getElementById('pendingRequests').innerHTML = `<p class="muted">${escapeHtml(error.message || String(error))}</p>`;
          })
          .getPendingMemberUpdateRequests();
      }

      function renderRequestCard(request) {
        return `
          <article class="request-card">
            <div><strong>${escapeHtml(request.memberId)}</strong></div>
            <div class="small">Requested by ${escapeHtml(request.requestedByEmail)}</div>
            <pre class="small">${escapeHtml(JSON.stringify(request.requestedChanges, null, 2))}</pre>
            <div class="action-row">
              <button class="action" type="button" data-review-request="${escapeHtml(request.requestId)}" data-decision="Approved">Approve</button>
              <button class="action danger" type="button" data-review-request="${escapeHtml(request.requestId)}" data-decision="Rejected">Reject</button>
            </div>
          </article>
        `;
      }

      function submitProfileUpdate(event) {
        event.preventDefault();
        const changes = readFormValues(event.target);
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            renderMyProfile();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .requestMyProfileUpdate(changes);
      }

      function submitPrivacySettings(event) {
        event.preventDefault();
        const settings = {};
        event.target.querySelectorAll('input[type="checkbox"]').forEach(function(input) {
          settings[input.name] = input.checked ? 'Yes' : 'No';
        });
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            renderMyProfile();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .updateMyPrivacySettings(settings);
      }

      function submitAddMember(event) {
        event.preventDefault();
        const record = readFormValues(event.target);
        google.script.run
          .withSuccessHandler(function(result) {
            alert('Member added: ' + result.memberId);
            renderMembers();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .addMember(record);
      }

      function reviewRequest(event) {
        const requestId = event.target.dataset.reviewRequest;
        const decision = event.target.dataset.decision;
        if (!confirm(decision + ' this profile update request?')) {
          return;
        }
        google.script.run
          .withSuccessHandler(function() {
            loadPendingRequests();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .reviewMemberUpdateRequest(requestId, decision);
      }

      function readFormValues(form) {
        const values = {};
        form.querySelectorAll('input, textarea, select').forEach(function(input) {
          values[input.name] = input.value;
        });
        return values;
      }

      function profileLine(label, value) {
        return `
          <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value" style="font-size: 17px;">${escapeHtml(value || '--')}</div>
          </div>
        `;
      }

      function inputField(label, name, value) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input id="${escapeAttr(name)}" name="${escapeAttr(name)}" value="${escapeAttr(value)}">
          </div>
        `;
      }

      function dateInputField(label, name, value) {
        const id = escapeAttr(name);
        return `
          <div>
            <label for="${id}">${escapeHtml(label)}</label>
            <input id="${id}" name="${id}" value="${escapeAttr(value)}" placeholder="dd-mm-yyyy" inputmode="numeric" pattern="\\d{1,2}-\\d{1,2}-\\d{4}">
            <input type="date" data-calendar-for="${id}" aria-label="${escapeAttr(label)} calendar">
            <p class="muted small">Enter as dd-mm-yyyy or choose from the calendar.</p>
          </div>
        `;
      }

      function selectField(label, name, options) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <select id="${escapeAttr(name)}" name="${escapeAttr(name)}">
              ${options.map(function(option) {
                return `<option value="${escapeAttr(option.value)}" ${option.selected ? 'selected' : ''}>${escapeHtml(option.label)}</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }

      function fileField(label, name, accept, helpText) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input type="file" id="${escapeAttr(name)}" name="${escapeAttr(name)}" accept="${escapeAttr(accept || 'application/pdf,image/jpeg,image/png')}">
            <p class="muted small">${escapeHtml(helpText || 'Optional. PDF, JPG, or PNG up to 5 MB.')}</p>
          </div>
        `;
      }

      function birthdayField(label, name, value) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input id="${escapeAttr(name)}" name="${escapeAttr(name)}" value="${escapeAttr(value)}" inputmode="numeric" placeholder="DD/MM">
            <p class="muted small">Use day and month only, for example 14/08. Do not enter the year.</p>
          </div>
        `;
      }

      function textAreaField(label, name, value) {
        return `
          <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
          <textarea id="${escapeAttr(name)}" name="${escapeAttr(name)}">${escapeHtml(value)}</textarea>
        `;
      }

      function privacyCheck(name, label, value) {
        return `
          <label class="check-item">
            <input type="checkbox" name="${escapeAttr(name)}" ${value === 'Yes' ? 'checked' : ''}>
            <span>${escapeHtml(label)}</span>
          </label>
        `;
      }

      function renderPendingRequests(requests) {
        if (!requests || !requests.length) {
          return '';
        }

        return `
          <section class="panel">
            <h3>Pending Requests</h3>
            <p class="muted">Your request is waiting for review by the Membership Administrator.</p>
            <div class="request-list">
              ${requests.map(function(request) {
                return `<div class="request-card"><strong>${escapeHtml(request.requestId)}</strong><pre class="small">${escapeHtml(JSON.stringify(request.requestedChanges, null, 2))}</pre></div>`;
              }).join('')}
            </div>
          </section>
        `;
      }

      function renderInlineError(title, message) {
        document.getElementById('app').innerHTML = `
          <section class="panel message error">
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      function renderError(message) {
        document.getElementById('statusBar').innerHTML = '<span class="badge warn">Error</span>';
        document.getElementById('app').innerHTML = `
          <section class="panel message error">
            <h2>Something went wrong</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function metricCard(label, value) {
        return `
          <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value">${escapeHtml(value)}</div>
          </div>
        `;
      }

      function accountOption(account) {
        return { value: account.accountId, label: account.accountName + ' - ' + account.accountType };
      }

      function categoryOption(category) {
        return { value: category.categoryId, label: category.categoryName };
      }

      function fundOption(fund) {
        return { value: fund.fundId, label: fund.fundName };
      }

      function formatMoney(value) {
        const number = Number(value || 0);
        return number.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function todayIso() {
        return new Date().toISOString().slice(0, 10);
      }

      function todayDisplay() {
        return isoToDisplayDate(todayIso());
      }

      function isoToDisplayDate(value) {
        const parts = String(value || '').split('-');
        if (parts.length !== 3) {
          return value || '';
        }
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }

      function displayToIsoDate(value) {
        const parts = String(value || '').split('-');
        if (parts.length !== 3) {
          return '';
        }
        return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }

      function formatShortDateTime(value) {
        if (!value) {
          return '--';
        }
        return String(value).slice(0, 16).replace('T', ' ');
      }

      function readFileAsBase64(file, callback) {
        if (file.size > 10 * 1024 * 1024) {
          alert('File is too large. Maximum size is 10 MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function() {
          callback(String(reader.result).split(',')[1]);
        };
        reader.readAsDataURL(file);
      }

      loadApp();
    </script>
  </body>
</html>
