<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --green: #12613f;
        --green-dark: #0b3f2b;
        --green-soft: #eaf6ef;
        --gold: #c99b20;
        --gold-soft: #fff7df;
        --ink: #1d2939;
        --muted: #667085;
        --line: #dde5df;
        --soft: #f6f8f5;
        --surface: #ffffff;
        --danger: #b42318;
        --danger-soft: #fff1f2;
        --warning: #946200;
        --ok: #166534;
        --shadow: 0 10px 28px rgba(18, 97, 63, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(201, 155, 32, 0.12), transparent 32rem),
          linear-gradient(180deg, #f7fbf8 0%, #ffffff 42%);
        line-height: 1.5;
        font-size: 16px;
      }

      .app-header {
        background:
          linear-gradient(135deg, rgba(11, 63, 43, 0.96), rgba(18, 97, 63, 0.94)),
          var(--green);
        color: #ffffff;
        padding: 22px 16px 20px;
        border-bottom: 4px solid var(--gold);
      }

      .brand-row {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff3bf;
        font-weight: 900;
        letter-spacing: 0;
        flex: 0 0 auto;
      }

      .app-title {
        margin: 0;
        font-size: 25px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .tagline {
        margin: 5px 0 0;
        color: #ffe7a3;
        font-size: 15px;
      }

      .status-bar {
        display: flex;
        gap: 8px;
        align-items: center;
        overflow-x: auto;
        border-bottom: 1px solid rgba(18, 97, 63, 0.12);
        padding: 12px max(12px, calc((100vw - 1120px) / 2 + 14px));
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid #d9e7dd;
        background: #ffffff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.ok {
        border-color: #bfe8cb;
        background: #effaf2;
        color: var(--ok);
      }

      .badge.warn {
        border-color: #f6d777;
        background: var(--gold-soft);
        color: var(--warning);
      }

      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px max(12px, calc((100vw - 1120px) / 2 + 14px));
        border-bottom: 1px solid rgba(18, 97, 63, 0.12);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .nav button {
        min-height: 42px;
        padding: 10px 15px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      }

      .nav button.active {
        background: var(--green);
        border-color: var(--green);
        color: #ffffff;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 22px 14px 56px;
      }

      .panel {
        border: 1px solid rgba(18, 97, 63, 0.12);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      h2 {
        margin: 0 0 8px;
        font-size: 23px;
        line-height: 1.2;
      }

      h3 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.25;
      }

      p {
        margin: 0 0 10px;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        min-height: 100px;
        border: 1px solid rgba(18, 97, 63, 0.12);
        border-radius: 14px;
        padding: 14px;
        background: linear-gradient(180deg, #ffffff, #f8fbf8);
        box-shadow: 0 6px 18px rgba(16, 24, 40, 0.04);
      }

      .metric-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: 24px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }

      .action-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .action {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        padding: 12px;
        background: var(--green);
        color: #ffffff;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 8px 16px rgba(18, 97, 63, 0.18);
      }

      .action.secondary {
        background: #ffffff;
        border: 1px solid var(--green);
        color: var(--green-dark);
      }

      .action.danger {
        background: #ffffff;
        border: 1px solid var(--danger);
        color: var(--danger);
      }

      a.action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .locked {
        opacity: 0.58;
      }

      .message {
        border-left: 4px solid var(--gold);
        background: var(--gold-soft);
        padding: 12px;
        border-radius: 10px;
      }

      .error {
        border-left-color: var(--danger);
        background: #fff1f2;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .split-list {
        display: grid;
        gap: 12px;
      }

      .split-row {
        display: grid;
        grid-template-columns: minmax(92px, 0.8fr) minmax(150px, 1.2fr) minmax(150px, 1fr) minmax(180px, 1.4fr) auto;
        gap: 10px;
        align-items: end;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 5px;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        font: inherit;
        background: #ffffff;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus {
        outline: 3px solid rgba(201, 155, 32, 0.28);
        outline-offset: 2px;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      .check-list {
        display: grid;
        gap: 8px;
      }

      .check-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
      }

      .check-item input {
        width: 20px;
        min-height: 20px;
      }

      .directory-list,
      .request-list {
        display: grid;
        gap: 10px;
      }

      .directory-card,
      .request-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: var(--soft);
      }

      .statement-workbench {
        display: grid;
        gap: 12px;
      }

      .statement-card {
        border: 1px solid var(--line);
        border-left: 5px solid var(--gold);
        border-radius: 12px;
        padding: 14px;
        background: #ffffff;
      }

      .statement-card.verified {
        border-left-color: var(--green);
        background: #fbfffc;
      }

      .statement-card.duplicate {
        border-left-color: var(--danger);
        background: var(--danger-soft);
      }

      .statement-card-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }

      .statement-card-head input[type="checkbox"] {
        width: 22px;
        min-height: 22px;
      }

      .statement-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .statement-description {
        grid-column: 1 / -1;
      }

      .statement-original {
        width: 100%;
        min-height: 520px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--soft);
      }

      details.legacy-tools > summary {
        cursor: pointer;
        font-weight: 800;
        color: var(--green-dark);
        padding: 12px 0;
      }

      .directory-name {
        font-size: 17px;
        font-weight: 800;
      }

      .small {
        font-size: 13px;
      }

      .busy-bar {
        display: none;
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        min-height: 46px;
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--green-dark);
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
        font-weight: 800;
      }

      .toast {
        display: none;
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 11;
        min-height: 46px;
        border-radius: 12px;
        padding: 12px 14px;
        background: #ffffff;
        color: var(--ink);
        border: 1px solid rgba(18, 97, 63, 0.16);
        box-shadow: 0 16px 36px rgba(16, 24, 40, 0.18);
        font-weight: 800;
      }

      .toast.show {
        display: block;
      }

      .busy-bar.show {
        display: block;
      }

      .action[disabled],
      button[disabled] {
        cursor: wait;
        opacity: 0.62;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
        background: #ffffff;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        font-size: 13px;
        color: var(--muted);
        background: #f8fbf8;
      }

      @media (max-width: 640px) {
        .app-title {
          font-size: 21px;
        }

        main {
          padding: 16px 10px 42px;
        }

        .grid,
        .action-row,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .split-row {
          grid-template-columns: 1fr;
        }

        .statement-fields,
        .statement-card-head {
          grid-template-columns: 1fr;
        }

        .statement-card-head input[type="checkbox"] {
          width: 24px;
        }

        .statement-original {
          min-height: 380px;
        }

        .panel {
          padding: 14px;
          border-radius: 12px;
        }

        .brand-mark {
          width: 42px;
          height: 42px;
          border-radius: 12px;
        }

        .nav button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-mark">94</div>
        <div>
          <h1 class="app-title"><?= appName ?></h1>
          <p class="tagline"><?= tagline ?></p>
        </div>
      </div>
    </header>

    <div class="busy-bar" id="busyBar" role="status" aria-live="polite">Working...</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="status-bar" id="statusBar">
      <span class="badge warn">Loading account access...</span>
    </section>

    <nav class="nav" id="nav" aria-label="Main sections"></nav>

    <main id="app">
      <section class="panel">
        <h2>Loading</h2>
            <p class="muted">Opening the NACO'94 member portal.</p>
      </section>
    </main>

    <script>
      const state = {
        bootstrap: null,
        activeSection: 'dashboard',
        myProfile: null,
        directory: [],
        pendingRequests: [],
        finance: null,
        administration: null,
        busy: false,
        busyTimer: null,
        toastTimer: null
      };

      const sectionContent = {
        dashboard: {
          title: 'Dashboard',
          body: 'View simple financial balances and recent published records.',
          metrics: ['Total Funds Available', 'Bank Balance', 'Cash at Hand', 'Last Updated']
        },
        finances: {
          title: 'Finances',
          body: 'View published money in and money out records.',
          actions: ['Search Transactions', 'View Account Status']
        },
        bankMatching: {
          title: 'Bank Statements',
          body: 'Finance Officers upload bank lines, split bulk payments into categories, and prepare reconciliations.',
          actions: ['Upload Bank Statement', 'Categorise Bank Lines']
        },
        reports: {
          title: 'Reports',
          body: 'Published monthly, quarterly and annual reports will appear here when reporting is added.',
          actions: ['Monthly Summary', 'Annual Summary']
        },
        members: {
          title: 'Members',
          body: 'View the member directory. Members only appear with the details they have chosen to share.',
          actions: ['View Members']
        },
        myProfile: {
          title: 'My Profile',
          body: 'View your details, request updates, and choose what appears in the member directory.',
          actions: ['Update My Details']
        },
        administration: {
          title: 'Administration',
          body: 'System Administrators can manage settings, roles, folders and future setup tasks here.',
          actions: ['View Setup Status', 'Manage Roles']
        }
      };

      function showBusy(message) {
        state.busy = true;
        const busyBar = document.getElementById('busyBar');
        busyBar.textContent = message || 'Working...';
        busyBar.classList.add('show');
        document.querySelectorAll('button.action').forEach(function(button) {
          if (!button.disabled) {
            button.dataset.busyDisabled = '1';
            button.disabled = true;
          }
        });
        clearTimeout(state.busyTimer);
        state.busyTimer = setTimeout(function() {
          hideBusy();
        }, 30000);
      }

      function hideBusy() {
        state.busy = false;
        clearTimeout(state.busyTimer);
        document.getElementById('busyBar').classList.remove('show');
        document.querySelectorAll('button[data-busy-disabled="1"]').forEach(function(button) {
          button.disabled = false;
          delete button.dataset.busyDisabled;
        });
      }

      function showMessage(message) {
        hideBusy();
        showToast(message);
      }

      function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message || '';
        toast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function() {
          toast.classList.remove('show');
        }, 5000);
      }

      window.alert = showToast;

      function flashWorking(message) {
        if (state.busy) {
          return;
        }
        const busyBar = document.getElementById('busyBar');
        busyBar.textContent = message || 'Working...';
        busyBar.classList.add('show');
        clearTimeout(state.busyTimer);
        state.busyTimer = setTimeout(function() {
          if (!state.busy) {
            busyBar.classList.remove('show');
          }
        }, 8000);
      }

      document.addEventListener('submit', function() {
        flashWorking('Saving...');
      }, true);

      document.addEventListener('click', function(event) {
        if (event.target.closest('button.action')) {
          flashWorking('Working...');
        }
      }, true);

      document.addEventListener('change', function(event) {
        if (event.target.matches('input[type="date"][data-calendar-for]')) {
          const target = document.getElementById(event.target.dataset.calendarFor);
          if (target) {
            target.value = isoToDisplayDate(event.target.value);
          }
        }
      }, true);

      document.addEventListener('blur', function(event) {
        if (event.target.matches('input[placeholder="dd-mm-yyyy"]')) {
          const calendar = document.querySelector(`input[type="date"][data-calendar-for="${event.target.id}"]`);
          if (calendar) {
            calendar.value = displayToIsoDate(event.target.value);
          }
        }
      }, true);

      function loadApp() {
        showBusy('Opening app...');
        google.script.run
          .withSuccessHandler(function(bootstrap) {
            hideBusy();
            state.bootstrap = bootstrap;
            if (bootstrap.navigation.length) {
              state.activeSection = bootstrap.navigation[0].key;
            }
            render();
          })
          .withFailureHandler(function(error) {
            hideBusy();
            renderError(error.message || String(error));
          })
          .getAppBootstrap();
      }

      function render() {
        renderStatus();
        renderNavigation();

        if (!state.bootstrap.user.allowed) {
          renderAccessDenied();
          return;
        }

        if (!state.bootstrap.configured) {
          renderSetupRequired();
          return;
        }

        renderSection(state.activeSection);
      }

      function renderStatus() {
        const user = state.bootstrap.user;
        const roles = user.roles.length ? user.roles.join(', ') : 'No role';
        document.getElementById('statusBar').innerHTML = [
          `<span class="badge ${user.allowed ? 'ok' : 'warn'}">${escapeHtml(user.status)}</span>`,
          `<span class="badge">${escapeHtml(user.email || 'No Google email detected')}</span>`,
          `<span class="badge">${escapeHtml(roles)}</span>`,
          `<span class="badge ${state.bootstrap.configured ? 'ok' : 'warn'}">${state.bootstrap.configured ? 'Configured' : 'Setup needed'}</span>`,
          `<span class="badge">App ${escapeHtml(state.bootstrap.appVersion || '')}</span>`,
          `<span class="badge ${String(state.bootstrap.schemaVersion || '').indexOf('Legacy') === -1 ? 'ok' : 'warn'}">Data ${escapeHtml(state.bootstrap.schemaVersion || '')}</span>`,
          state.bootstrap.verifiedMemberSession ? '<button class="action secondary" type="button" id="signOutButton">Sign Out</button>' : ''
        ].join('');
        const signOutButton = document.getElementById('signOutButton');
        if (signOutButton) {
          signOutButton.addEventListener('click', signOutMemberSession);
        }
      }

      function signOutMemberSession() {
        showBusy('Signing out...');
        google.script.run
          .withSuccessHandler(function() { loadApp(); })
          .withFailureHandler(function(error) { hideBusy(); showToast(error.message || String(error)); })
          .signOutCurrentUser();
      }

      function renderNavigation() {
        const nav = document.getElementById('nav');
        nav.innerHTML = state.bootstrap.navigation.map(function(item) {
          const active = item.key === state.activeSection ? 'active' : '';
          return `<button type="button" class="${active}" data-section="${item.key}">${escapeHtml(item.label)}</button>`;
        }).join('');

        nav.querySelectorAll('button').forEach(function(button) {
          button.addEventListener('click', function() {
            state.activeSection = button.dataset.section;
            render();
          });
        });
      }

      function renderAccessDenied() {
        const needsMemberSignIn = !state.bootstrap.user.allowed && state.bootstrap.memberSignInAvailable;
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Access Needed</h2>
            <p>${escapeHtml(state.bootstrap.user.message)}</p>
            ${needsMemberSignIn ? `
              <p class="muted">Enter the Google email address registered with NACO'94. We will email a six-digit code to confirm it is you.</p>
              <form id="requestSignInCodeForm" class="form-grid">
                ${inputField('Registered Google email', 'Sign-In Email', '', 'email')}
                <div style="grid-column: 1 / -1;"><button class="action" type="submit">Email Me a Code</button></div>
              </form>
              <form id="verifySignInCodeForm" class="form-grid" style="margin-top: 1rem;">
                ${inputField('Registered Google email', 'Verify Email', '', 'email')}
                ${inputField('Six-digit code', 'Sign-In Code', '', 'text')}
                <div style="grid-column: 1 / -1;"><button class="action secondary" type="submit">Verify and Open Ledger</button></div>
              </form>
              <p class="muted small">The code expires after 10 minutes. Check Spam if it does not appear in your Inbox.</p>
            ` : '<p class="muted">The Apps Script owner must complete initial setup.</p>'}
          </section>
        `;
        if (needsMemberSignIn) {
          document.getElementById('requestSignInCodeForm').addEventListener('submit', requestSignInCodeFromUi);
          document.getElementById('verifySignInCodeForm').addEventListener('submit', verifySignInCodeFromUi);
        }
      }

      function requestSignInCodeFromUi(event) {
        event.preventDefault();
        const email = event.target.querySelector('[name="Sign-In Email"]').value;
        showBusy('Sending your sign-in code...');
        google.script.run
          .withSuccessHandler(function(result) {
            hideBusy();
            document.querySelector('[name="Verify Email"]').value = email;
            showMessage(result.message);
          })
          .withFailureHandler(function(error) {
            hideBusy();
            showToast(error.message || String(error));
          })
          .requestMemberSignInCode(email);
      }

      function verifySignInCodeFromUi(event) {
        event.preventDefault();
        const email = event.target.querySelector('[name="Verify Email"]').value;
        const code = event.target.querySelector('[name="Sign-In Code"]').value;
        showBusy('Checking your sign-in code...');
        google.script.run
          .withSuccessHandler(function() { loadApp(); })
          .withFailureHandler(function(error) { hideBusy(); showToast(error.message || String(error)); })
          .verifyMemberSignInCode(email, code);
      }

      function renderSetupRequired() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Setup Needed</h2>
            <p>The app cannot find the saved data spreadsheet ID yet.</p>
            <p class="muted">In Apps Script, run <strong>setupStage1()</strong>. When it finishes, deploy a new web app version and reopen the latest web app link.</p>
          </section>
        `;
      }

      function renderSection(sectionKey) {
        if (sectionKey === 'dashboard') {
          renderDashboard();
          return;
        }

        if (sectionKey === 'finances') {
          renderFinances();
          return;
        }

        if (sectionKey === 'reports') {
          renderReports();
          return;
        }

        if (sectionKey === 'myProfile') {
          renderMyProfile();
          return;
        }

        if (sectionKey === 'members') {
          renderMembers();
          return;
        }

        if (sectionKey === 'administration') {
          renderAdministration();
          return;
        }

        if (sectionKey === 'bankMatching') {
          renderBankStatements();
          return;
        }

        const content = sectionContent[sectionKey] || sectionContent.dashboard;
        const metrics = content.metrics ? renderMetrics(content.metrics) : '';
        const actions = content.actions ? renderActions(content.actions) : '';
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>${escapeHtml(content.title)}</h2>
            <p>${escapeHtml(content.body)}</p>
            <p class="muted">Current stage: ${escapeHtml(state.bootstrap.stage)}</p>
          </section>
          ${metrics}
          ${actions}
        `;
      }

      function renderMetrics(metrics) {
        return `
          <section class="grid">
            ${metrics.map(function(metric) {
              return `

      function viewFinanceEvidence(documentId) {
        const evidenceWindow = window.open('', '_blank');
        if (evidenceWindow) { evidenceWindow.document.body.textContent = 'Opening private evidence...'; }
        google.script.run
          .withSuccessHandler(function(evidence) {
            const binary = atob(evidence.base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
            const url = URL.createObjectURL(new Blob([bytes], { type: evidence.mimeType }));
            if (evidenceWindow) { evidenceWindow.location = url; } else { window.open(url, '_blank'); }
          })
          .withFailureHandler(function(error) {
            if (evidenceWindow) { evidenceWindow.close(); }
            alert(error.message || String(error));
          })
          .getStatementEvidenceForReview(documentId);
      }

      function reviewSelectedTransactions(decision) {
        const ids = Array.prototype.filter.call(document.querySelectorAll('[name="Publish Selection"]'), function(input) { return input.checked; }).map(function(input) { return input.value; });
        if (!ids.length) { alert('Select at least one ordinary transaction.'); return; }
        const reason = prompt(decision + ' batch note', '');
        if (reason === null) { return; }
        if (!confirm(decision + ' ' + ids.length + ' selected transaction(s)?')) { return; }
        showBusy('Reviewing selected transactions...');
        google.script.run
          .withSuccessHandler(function(result) { hideBusy(); refreshFinances(result.count + ' transaction(s) ' + decision.toLowerCase() + '.'); })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .publishTransactionsBatch(ids, decision, reason);
      }

      function openCorrectionForm(transactionId) {
        const transaction = (state.finance.approvedTransactions || []).filter(function(item) { return item.transactionId === transactionId; })[0];
        if (!transaction) { return; }
        const transactionAccount = (state.finance.accounts || []).filter(function(account) { return account.accountId === transaction.accountId; })[0];
        const correctionDefaultDate = transactionAccount && transactionAccount.lockedThrough && (displayToIsoDate(transaction.date) || transaction.date) <= transactionAccount.lockedThrough
          ? todayDisplay()
          : transaction.date;
        const panel = document.getElementById('correctionPanel');
        panel.innerHTML = `
          <section class="panel message">
            <h3>Correct Published Record ${escapeHtml(transactionId)}</h3>
            <p class="muted">The original will remain visible. The app will prepare a reversal and a corrected replacement for the Publisher to review together.</p>
            <form id="correctionForm" class="form-grid">
              ${selectField('Correct type', 'Transaction Type', [
                { value: 'Money In', label: 'Money In', selected: transaction.transactionType === 'Money In' },
                { value: 'Money Out', label: 'Money Out', selected: transaction.transactionType === 'Money Out' }
              ])}
              ${dateInputField('Correction posting date', 'Date', correctionDefaultDate)}
              ${inputField('Correct amount', 'Amount', transaction.amount)}
              ${selectField('Account', 'Account ID', state.finance.accounts.map(function(account) {
                const option = accountOption(account); option.selected = account.accountId === transaction.accountId; return option;
              }))}
              ${inputField('Payer or payee', 'Payer or Payee', transaction.payerOrPayee || '')}
              ${selectField('Classification', 'Category ID', state.finance.categories.map(function(category) {
                return { value: category.categoryId, label: category.categoryType + ' — ' + category.categoryName, selected: category.categoryId === transaction.categoryId };
              }))}
              ${selectField('Fund or project', 'Fund ID', [{ value: '', label: 'General / none', selected: !transaction.fundId }].concat(state.finance.funds.map(function(fund) {
                return { value: fund.fundId, label: fund.fundName, selected: fund.fundId === transaction.fundId };
              })))}
              ${inputField('Reference number', 'Reference Number', transaction.referenceNumber || '')}
              <div style="grid-column:1/-1;">${textAreaField('Correct description', 'Description', transaction.description)}</div>
              <div style="grid-column:1/-1;">${textAreaField('Reason for correction', 'Correction Reason', '')}</div>
              <div class="action-row" style="grid-column:1/-1;"><button class="action" type="submit">Send Correction To Publisher</button><button class="action secondary" type="button" id="cancelCorrection">Cancel</button></div>
            </form>
          </section>`;
        document.getElementById('cancelCorrection').onclick = function() { panel.innerHTML = ''; };
        document.getElementById('correctionForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const values = readFormValues(event.target);
          const correctionReason = values['Correction Reason'];
          delete values['Correction Reason'];

      function submitFinanceTransaction(event, methodName) {
        event.preventDefault();
        const record = readFormValues(event.target);
        const fileInput = event.target.querySelector('input[type="file"]');
        const file = fileInput && fileInput.files.length ? fileInput.files[0] : null;

        if (!file) {
          submitFinanceRecord(methodName, record);
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          alert('File is too large. Maximum size is 5 MB.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function() {
          google.script.run
            .withSuccessHandler(function(documentResult) {
              record['Document ID'] = documentResult.documentId;
              submitFinanceRecord(methodName, record);
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .uploadFinanceDocument({
              fileName: file.name,
              mimeType: file.type,
              base64: String(reader.result).split(',')[1],
              visibility: 'Finance Only'
            });
        };
        reader.readAsDataURL(file);
      }

      function getBankLineById(matchData, bankLineId) {
        return (matchData.unmatchedBankLines || []).filter(function(line) {
          return line.bankLineId === bankLineId;
        })[0] || null;
      }

      function getBankLineAmount(line) {
        if (!line) {
          return 0;
        }
        return line.moneyIn > 0 ? line.moneyIn : line.moneyOut;
      }

      function getBankLineCategoryType(line) {
        return line && line.moneyIn > 0 ? 'Money In' : 'Money Out';
      }

      function renderCategoryOptionsForLine(line, selectedValue) {
        const categoryType = getBankLineCategoryType(line);
        const categories = state.finance ? state.finance.categories : [];
        return categories.filter(function(category) {
          return category.categoryType === categoryType;
        }).map(function(category) {
          return `<option value="${escapeAttr(category.categoryId)}" ${category.categoryId === selectedValue ? 'selected' : ''}>${escapeHtml(category.categoryName)}</option>`;
        }).join('');
      }

      function renderFundOptions(selectedValue) {
        const funds = state.finance ? state.finance.funds : [];
        return `<option value="">None</option>` + funds.map(function(fund) {
          return `<option value="${escapeAttr(fund.fundId)}" ${fund.fundId === selectedValue ? 'selected' : ''}>${escapeHtml(fund.fundName)}</option>`;
        }).join('');
      }

      function renderSplitRow(line, amount, index) {
        return `
          <div class="split-row" data-split-row="1">
            <div>
              <label>Amount</label>
              <input name="Split Amount" value="${escapeAttr(amount || '')}" inputmode="decimal">
            </div>
            <div>
              <label>Category</label>
              <select name="Split Category">${renderCategoryOptionsForLine(line, '')}</select>
            </div>
            <div>
              <label>Fund</label>
              <select name="Split Fund">${renderFundOptions('')}</select>
            </div>
            <div>
              <label>Description</label>
              <input name="Split Description" value="${escapeAttr(line && index === 0 ? line.description : '')}">
            </div>
            <div>
              <button class="action danger" type="button" data-remove-split="1">Remove</button>
            </div>
          </div>
        `;
      }

      function resetSplitRows(matchData) {
        const select = document.getElementById('createBankLineId');
        const container = document.getElementById('splitRows');
        if (!select || !container) {
          return;
        }
        const line = getBankLineById(matchData, select.value);
        container.innerHTML = renderSplitRow(line, getBankLineAmount(line), 0);
        bindSplitRemoveButtons();
        updateSplitRemaining();
      }

      function addSplitRow(matchData) {
        const select = document.getElementById('createBankLineId');
        const container = document.getElementById('splitRows');
        if (!select || !container) {
          return;
        }
        const line = getBankLineById(matchData, select.value);
        container.insertAdjacentHTML('beforeend', renderSplitRow(line, '', container.children.length));
        bindSplitRemoveButtons();
        updateSplitRemaining();
      }

      function bindSplitRemoveButtons() {
        document.querySelectorAll('[data-remove-split]').forEach(function(button) {
          button.onclick = function() {
            const rows = document.querySelectorAll('[data-split-row]');
            if (rows.length <= 1) {
              alert('Keep at least one category row.');
              return;
            }
            button.closest('[data-split-row]').remove();
            updateSplitRemaining();
          };
        });
        document.querySelectorAll('[data-split-row] [name="Split Amount"]').forEach(function(input) {
          input.oninput = updateSplitRemaining;
        });
      }

      function updateSplitRemaining() {
        const output = document.getElementById('splitRemaining');
        const select = document.getElementById('createBankLineId');
        if (!output || !select || !state.bankMatchData) { return; }
        const line = getBankLineById(state.bankMatchData, select.value);
        const total = Array.prototype.reduce.call(document.querySelectorAll('[data-split-row] [name="Split Amount"]'), function(sum, input) {
          return sum + (Number(String(input.value || '0').replace(/,/g, '')) || 0);
        }, 0);
        const remaining = Math.round((getBankLineAmount(line) - total) * 100) / 100;
        output.textContent = 'Remaining to allocate: ' + formatMoney(remaining);
      }

        return Array.prototype.map.call(document.querySelectorAll('[data-split-row]'), function(row) {

      function renderMatchSuggestions(suggestions) {
        document.getElementById('matchSuggestions').innerHTML = suggestions.length ? `
          <h3>Suggested Matches</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Score</th><th>Transaction</th><th>Amount</th></tr></thead>
              <tbody>
                ${suggestions.map(function(item) {
                  return `<tr><td>${escapeHtml(item.score)}</td><td>${escapeHtml(item.transaction.transactionId + ' - ' + item.transaction.description)}</td><td>${formatMoney(item.transaction.amount)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        ` : '<p class="muted">No likely matches found.</p>';
      }

      function renderSimpleMatchTable(matches) {
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Match ID</th><th>Bank Line</th><th>Transaction</th><th>Status</th></tr></thead>
              <tbody>
                ${matches.map(function(match) {
                  return `<tr><td>${escapeHtml(match.matchId)}</td><td>${escapeHtml(match.bankLineId)}</td><td>${escapeHtml(match.transactionId)}</td><td>${escapeHtml(match.matchStatus)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderReconciliations(reconciliations, canPublish) {
        return `
          <section class="panel">
            <h3>Reconciliations</h3>
            ${reconciliations.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>ID</th><th>Period</th><th>Expected</th><th>Statement</th><th>Difference</th><th>Status</th><th>Action</th></tr></thead>
                  <tbody>
                    ${reconciliations.map(function(item) {
                      return `<tr><td>${escapeHtml(item.reconciliationId)}</td><td>${escapeHtml(item.periodStart + ' to ' + item.periodEnd)}</td><td>${formatMoney(item.expectedClosingBalance)}</td><td>${formatMoney(item.statementClosingBalance)}</td><td>${formatMoney(item.difference)}</td><td><span class="badge">${escapeHtml(item.status)}</span></td><td>${canPublish && item.status === 'Ready to Publish' ? `<button class="action secondary" type="button" data-publish-reconciliation="${escapeAttr(item.reconciliationId)}">Publish</button>` : ''}</td></tr>`;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<p class="muted">No reconciliations prepared yet.</p>'}
          </section>
        `;
      }

      function submitUnifiedStatementPreview(event) {
        event.preventDefault();
        const accountId = event.target.querySelector('[name="Account ID"]').value;
        const file = event.target.querySelector('input[type="file"]').files[0];
        if (!file) {
          alert('Choose a PDF, Excel, or CSV statement first.');
          return;
        }
        if (state.statementObjectUrl) {
          URL.revokeObjectURL(state.statementObjectUrl);
          state.statementObjectUrl = '';
        }
        if (/\.pdf$/i.test(file.name)) {
          state.statementObjectUrl = URL.createObjectURL(file);
        }
        showBusy('Reading and checking the bank statement...');
        readFileAsBase64(file, function(base64) {
          google.script.run
            .withSuccessHandler(function(preview) {
              hideBusy();
              state.statementPreview = preview;
              renderUnifiedStatementWorkbench(preview);
            })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .previewBankStatement({
              accountId: accountId,
              fileName: file.name,
              mimeType: file.type,
              base64: base64
            });
        });
      }

      function renderUnifiedStatementWorkbench(preview) {
        const container = document.getElementById('statementWorkbench');
        if (!container) {
          return;
        }
        if (preview.needsMapping) {
          renderUnifiedStatementMapping(preview);
          return;
        }
        const rows = (preview.rows || []).filter(function(row) {
          return Number(row.moneyIn || 0) > 0 || Number(row.moneyOut || 0) > 0;
        });
        preview.rows = rows;
        const originalPreview = preview.sourceFormat === 'PDF' && state.statementObjectUrl
          ? `<section class="message" style="margin-top:12px;"><h3>Original PDF</h3><p>Chrome cannot display a PDF inside the restricted Google Apps Script frame. Open it in a separate tab and switch between the PDF and this review screen.</p><a class="action secondary" href="${escapeAttr(state.statementObjectUrl)}" target="_blank" rel="noopener noreferrer">Open Original PDF In New Tab</a></section>`
          : '';
        container.innerHTML = `
          <hr>
          <h3>Statement Review</h3>
          <div class="message ${preview.balanceBreakCount ? 'warn' : ''}">
            <p><strong>${escapeHtml(rows.length)} complete transaction rows</strong> found from ${escapeHtml(preview.sourceFormat || '')}. ${escapeHtml(preview.highConfidenceCount || 0)} passed the running-balance check.</p>
            <p class="small">Green rows balance mathematically. Gold rows need a person to compare them with the original statement before ticking them.</p>
            ${preview.duplicateFile ? '<p><strong>This exact file was imported before.</strong> Rows will be quarantined as possible duplicates unless the earlier import is investigated.</p>' : ''}
          </div>
          ${originalPreview}
          <div class="panel" style="box-shadow:none; margin-top:12px;">
            <div class="action-row">
              <button class="action secondary" type="button" id="selectVerifiedRows">Select Verified Rows</button>
              <button class="action secondary" type="button" id="selectCompleteRows">Select All Complete Rows</button>
              <button class="action secondary" type="button" id="clearStatementRows">Clear Selection</button>
            </div>
            <div class="form-grid" style="margin-top:12px;">
              <div>
                <label for="bulkStatementCategory">Apply classification to selected matching rows</label>
                <select id="bulkStatementCategory">
                  <option value="">Choose classification</option>
                  ${(state.finance.categories || []).map(function(category) {
                    return `<option value="${escapeAttr(category.categoryId)}" data-category-type="${escapeAttr(category.categoryType)}">${escapeHtml(category.categoryType + ' — ' + category.categoryName)}</option>`;
                  }).join('')}
                </select>
              </div>
              <div style="align-self:end;"><button class="action secondary" type="button" id="applyBulkStatementCategory">Apply To Selected</button></div>
            </div>
          </div>
          <form id="statementCommitForm">
            <div class="statement-workbench">
              ${rows.map(renderUnifiedStatementRow).join('') || '<p class="muted">No complete rows were found. Use the manual statement tool below.</p>'}
            </div>
            ${rows.length ? `<div class="action-row"><button class="action" type="submit">Send Classified Rows To Publisher</button><button class="action secondary" type="button" id="saveStatementDraft">Save and Continue Later</button><button class="action secondary" type="button" id="saveReviewRows">Save Selected As Needs Review</button></div>` : ''}
          </form>
        `;
        bindUnifiedStatementControls(preview);
      }

      function renderUnifiedStatementMapping(preview) {
        const options = [{ value: '', label: 'Not used' }].concat((preview.headers || []).map(function(header) { return { value: header, label: header }; }));
        const fields = [
          { key: 'date', label: 'Date column' },
          { key: 'description', label: 'Description column' },
          { key: 'moneyIn', label: 'Money-in column' },
          { key: 'moneyOut', label: 'Money-out column' },
          { key: 'amount', label: 'Signed amount column' },
          { key: 'balance', label: 'Running balance column' },
          { key: 'reference', label: 'Reference column' }
        ];
        document.getElementById('statementWorkbench').innerHTML = `
          <hr><h3>Match the Bank Columns</h3>
          <p class="muted">The bank used unfamiliar headings. Choose which column contains each item.</p>
          <form id="unifiedMappingForm" class="form-grid">
            ${fields.map(function(field) {
              return selectField(field.label, field.key, options.map(function(option) {
                return { value: option.value, label: option.label, selected: option.value === preview.suggestedMapping[field.key] };
              }));
            }).join('')}
            <div style="grid-column:1/-1;"><button class="action" type="submit">Continue To Statement Review</button></div>
          </form>
        `;
        document.getElementById('unifiedMappingForm').addEventListener('submit', function(event) {
          event.preventDefault();
          showBusy('Applying the bank column choices...');
          google.script.run
            .withSuccessHandler(function(rows) {
              hideBusy();
              preview.rows = rows;
              preview.needsMapping = false;
              preview.parserProfile = 'Officer-confirmed column mapping';
              preview.highConfidenceCount = rows.filter(function(row) { return row.confidence === 'High'; }).length;
              preview.reviewCount = rows.length - preview.highConfidenceCount;
              renderUnifiedStatementWorkbench(preview);
            })
            .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
            .previewMappedBankStatement({ headers: preview.headers, rawRows: preview.rawRows, mapping: readFormValues(event.target) });
        });
      }

      function renderUnifiedStatementRow(row, index) {
        const type = Number(row.moneyIn || 0) > 0 ? 'Money In' : 'Money Out';
        const verified = row.confidence === 'High';
        const selectedCategory = row.categoryId || row.suggestedCategoryId || '';
        const selectedForUse = Object.prototype.hasOwnProperty.call(row, 'include') ? row.include : verified;
        const categories = (state.finance.categories || []).filter(function(category) { return category.categoryType === type; });
        return `
          <article class="statement-card ${verified ? 'verified' : ''}" data-workbench-row="${index}" data-transaction-type="${escapeAttr(type)}" data-confidence="${escapeAttr(row.confidence || 'Review')}">
            <div class="statement-card-head">
              <input type="checkbox" name="Include Row" ${selectedForUse ? 'checked' : ''} aria-label="Include row ${index + 1}">
              <div><strong>${escapeHtml(type)}: ${formatMoney(type === 'Money In' ? row.moneyIn : row.moneyOut)}</strong><br><span class="small muted">Row ${escapeHtml(row.rowNumber || index + 1)} · Balance ${formatMoney(row.runningBalance || 0)}</span></div>
              <span class="badge ${verified ? 'ok' : 'warn'}">${escapeHtml(verified ? 'Balance verified' : 'Check original')}</span>
            </div>
            ${row.reviewReason ? `<p class="message small">${escapeHtml(row.reviewReason)}</p>` : ''}
            <div class="statement-fields">
              <div>${inputField('Date', 'Statement Date', isoToDisplayDate(row.statementDate || ''))}</div>
              <div>${selectField('Classification', 'Category ID', [{ value: '', label: 'Leave for later review' }].concat(categories.map(function(category) {
                return { value: category.categoryId, label: category.categoryName, selected: category.categoryId === selectedCategory };
              })))}</div>
              <div class="statement-description">${textAreaField('Bank description', 'Description', row.description || '')}</div>
              <div>${inputField('Money In', 'Money In', row.moneyIn || '')}</div>
              <div>${inputField('Money Out', 'Money Out', row.moneyOut || '')}</div>
              <div>${inputField('Running Balance', 'Running Balance', row.runningBalance || '')}</div>
              <div>${inputField('Reference', 'Reference Number', row.referenceNumber || '')}</div>
              <div>${inputField('Payer or payee', 'Counterparty', row.counterparty || '')}</div>
              <div>${selectField('Fund or project', 'Fund ID', [{ value: '', label: 'General / none', selected: !row.fundId }].concat((state.finance.funds || []).map(function(fund) {
                return { value: fund.fundId, label: fund.fundName, selected: fund.fundId === row.fundId };
              })))}</div>
              <input type="hidden" name="Source Text" value="${escapeAttr(row.sourceText || '')}">
              <input type="hidden" name="Row Number" value="${escapeAttr(row.rowNumber || index + 1)}">
              <input type="hidden" name="Review Reason" value="${escapeAttr(row.reviewReason || '')}">
              <input type="hidden" name="Balance Check" value="${escapeAttr(row.balanceCheck || '')}">
            </div>
          </article>
        `;
      }

      function bindUnifiedStatementControls(preview) {
        function setSelection(mode) {
          document.querySelectorAll('[data-workbench-row]').forEach(function(card) {
            card.querySelector('[name="Include Row"]').checked = mode === 'all' || (mode === 'verified' && card.dataset.confidence === 'High');
          });
        }
        document.getElementById('selectVerifiedRows').onclick = function() { setSelection('verified'); };
        document.getElementById('selectCompleteRows').onclick = function() {
          if (confirm('Select every complete row only after comparing gold rows with the original statement. Continue?')) { setSelection('all'); }
        };
        document.getElementById('clearStatementRows').onclick = function() { setSelection('none'); };
        document.getElementById('applyBulkStatementCategory').onclick = function() {
          const select = document.getElementById('bulkStatementCategory');
          const option = select.options[select.selectedIndex];
          if (!select.value) { alert('Choose a classification first.'); return; }
          document.querySelectorAll('[data-workbench-row]').forEach(function(card) {
            if (card.querySelector('[name="Include Row"]').checked && card.dataset.transactionType === option.dataset.categoryType) {
              card.querySelector('[name="Category ID"]').value = select.value;
            }
          });
        };
        document.getElementById('statementCommitForm').addEventListener('submit', function(event) {
          event.preventDefault();
          commitUnifiedStatement(preview, false);
        });
        document.getElementById('saveStatementDraft').onclick = function() { saveStatementDraft(preview); };
        document.getElementById('saveReviewRows').onclick = function() { commitUnifiedStatement(preview, true); };
      }

      function readUnifiedStatementRows(forceReview, includeAll) {
        return Array.prototype.map.call(document.querySelectorAll('[data-workbench-row]'), function(card) {
          const values = readFormValues(card);
          return {
            include: card.querySelector('[name="Include Row"]').checked,
            statementDate: displayToIsoDate(values['Statement Date']) || values['Statement Date'],
            description: values.Description,
            moneyIn: values['Money In'],
            moneyOut: values['Money Out'],
            runningBalance: values['Running Balance'],
            referenceNumber: values['Reference Number'],
            counterparty: values.Counterparty,
            categoryId: forceReview ? '' : values['Category ID'],
            fundId: values['Fund ID'],
            sourceText: values['Source Text'],
            rowNumber: values['Row Number'],
            confidence: card.dataset.confidence,
            reviewReason: values['Review Reason'],
            balanceCheck: values['Balance Check'],
            resolution: forceReview ? 'Needs Review' : 'Classify'
          };
        }).filter(function(row) { return includeAll || row.include; });
      }

      function commitUnifiedStatement(preview, forceReview) {
        const rows = readUnifiedStatementRows(forceReview);
        if (!rows.length) { alert('Select at least one reviewed row.'); return; }
        showBusy(forceReview ? 'Saving rows for later review...' : 'Saving classifications and preparing Publisher records...');
        google.script.run
          .withSuccessHandler(function(result) {
            hideBusy();
            refreshBankStatements('Statement saved: ' + result.transactionsPrepared + ' classified record(s), ' + result.reviewCount + ' needing review, and ' + result.duplicateCount + ' duplicate(s) quarantined.');
          })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .commitStatementWorkbench({
            accountId: preview.accountId,
            fileName: preview.fileName,
            fileId: preview.fileId,
            documentId: preview.documentId,
            fileHash: preview.fileHash,
            sourceFormat: preview.sourceFormat,
            parserProfile: preview.parserProfile,
            draftId: preview.draftId || '',
            rows: rows
          });
      }

      function saveStatementDraft(preview) {
        const rows = readUnifiedStatementRows(false, true);
        showBusy('Saving the statement review...');
        google.script.run
          .withSuccessHandler(function(result) { hideBusy(); refreshBankStatements('Statement review saved: ' + result.draftId); })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .saveStatementReviewDraft({
            accountId: preview.accountId,
            fileName: preview.fileName,
            fileId: preview.fileId,
            documentId: preview.documentId,
            fileHash: preview.fileHash,
            sourceFormat: preview.sourceFormat,
            parserProfile: preview.parserProfile,
            duplicateFile: preview.duplicateFile,
            draftId: preview.draftId || '',
            rows: rows
          });
      }

      function resumeStatementDraft(draftId) {
        showBusy('Opening the saved statement review...');
        google.script.run
          .withSuccessHandler(function(preview) {
            hideBusy();
            preview.highConfidenceCount = (preview.rows || []).filter(function(row) { return row.confidence === 'High'; }).length;
            preview.reviewCount = (preview.rows || []).length - preview.highConfidenceCount;
            preview.balanceBreakCount = (preview.rows || []).filter(function(row) { return row.balanceCheck === 'Break'; }).length;
            state.statementPreview = preview;
            state.statementObjectUrl = '';
            if (preview.sourceFormat === 'PDF') {
              showBusy('Opening the original PDF evidence...');
              google.script.run
                .withSuccessHandler(function(evidence) {
                  hideBusy();
                  const binary = atob(evidence.base64);
                  const bytes = new Uint8Array(binary.length);
                  for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
                  state.statementObjectUrl = URL.createObjectURL(new Blob([bytes], { type: evidence.mimeType }));
                  renderUnifiedStatementWorkbench(preview);
                  document.getElementById('statementWorkbench').scrollIntoView({ behavior: 'smooth', block: 'start' });
                })
                .withFailureHandler(function() {
                  hideBusy();
                  renderUnifiedStatementWorkbench(preview);
                  showMessage('Draft opened. The original PDF could not be displayed, but the saved rows are available.');
                })
                .getStatementEvidenceForReview(preview.documentId);
              return;
            }
            renderUnifiedStatementWorkbench(preview);
            document.getElementById('statementWorkbench').scrollIntoView({ behavior: 'smooth', block: 'start' });
          })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .resumeStatementReviewDraft(draftId);
      }

      function discardStatementDraft(draftId) {
        if (!confirm('Discard this saved review? The original bank statement evidence will remain stored.')) { return; }
        showBusy('Discarding the saved review...');
        google.script.run
          .withSuccessHandler(function() { hideBusy(); refreshBankStatements('Saved review discarded.'); })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .discardStatementReviewDraft(draftId);
      }

      function submitCsvPreview(event) {
        event.preventDefault();
        const accountId = event.target.querySelector('[name="Account ID"]').value;
        const file = event.target.querySelector('input[type="file"]').files[0];
        if (!file) {
          alert('Choose a CSV file first.');
          return;
        }

        readFileAsBase64(file, function(base64) {
          google.script.run
            .withSuccessHandler(function(preview) {
              renderCsvPreview(preview, accountId);
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .previewBankCsv({
              fileName: file.name,
              base64: base64
            });
        });
      }

      function renderCsvPreview(preview, accountId) {
        const fields = [
          { key: 'date', label: 'Date column' },
          { key: 'description', label: 'Description column' },
          { key: 'moneyIn', label: 'Money-in column' },
          { key: 'moneyOut', label: 'Money-out column' },
          { key: 'amount', label: 'Amount column' },
          { key: 'balance', label: 'Balance column' },
          { key: 'reference', label: 'Reference column' }
        ];
        const options = [{ value: '', label: 'Not used' }].concat(preview.headers.map(function(header) {
          return { value: header, label: header };
        }));

        document.getElementById('csvPreview').innerHTML = `
          <hr>
          <h3>CSV Preview</h3>
          <p class="muted">${escapeHtml(preview.rowCount)} rows found. Confirm the columns before importing.</p>
          <form id="csvImportForm" class="form-grid">
            ${fields.map(function(field) {
              return selectField(field.label, field.key, options.map(function(option) {
                return {
                  value: option.value,
                  label: option.label,
                  selected: option.value === preview.suggestedMapping[field.key]
                };
              }));
            }).join('')}
            <div style="grid-column: 1 / -1;"><button class="action" type="submit">Import CSV Lines</button></div>
          </form>
          <div class="table-wrap">
            <table>
              <thead><tr>${preview.headers.map(function(header) { return `<th>${escapeHtml(header)}</th>`; }).join('')}</tr></thead>
              <tbody>
                ${preview.previewRows.map(function(row) {
                  return `<tr>${row.map(function(value) { return `<td>${escapeHtml(value)}</td>`; }).join('')}</tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('csvImportForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const mapping = readFormValues(event.target);
          google.script.run
            .withSuccessHandler(function(result) {

            .withFailureHandler(function(error) {

      function submitPdfPreview(event) {
        event.preventDefault();
        const accountId = event.target.querySelector('[name="Account ID"]').value;
        const file = event.target.querySelector('input[type="file"]').files[0];
        if (!file) {
          alert('Choose a PDF file first.');
          return;
        }

        showBusy('Extracting PDF...');
        readFileAsBase64(file, function(base64) {
          google.script.run
            .withSuccessHandler(function(preview) {
              hideBusy();
              renderPdfPreview(preview, accountId);
            })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .previewBankPdf({
              fileName: file.name,
              base64: base64
            });
        });
      }

      function renderPdfPreview(preview, accountId) {
        document.getElementById('pdfPreview').innerHTML = `
          <hr>
          <h3>PDF Review</h3>
          <p class="muted">${escapeHtml(preview.rowCount)} possible rows found using ${escapeHtml(preview.parserProfile || 'automatic review')}. ${escapeHtml(preview.highConfidenceCount || 0)} are ready to import; ${escapeHtml(preview.reviewCount || 0)} need review.</p>
          ${preview.needsManualReview ? `
            <div class="message warn">
              <p>No complete statement rows were detected automatically. The PDF text is shown below so you can copy details into manual rows.</p>
            </div>
          ` : preview.reviewCount ? `

              <button class="action secondary" type="button" id="tickAllPdfRowsButton">Tick All</button>
              <button class="action secondary" type="button" id="untickPdfRowsButton">Untick All</button>
            </div>
          </form>
          ${preview.extractedTextPreview && preview.extractedTextPreview.length ? `
            <h3>Extracted PDF Text</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Line</th><th>Extracted text</th></tr></thead>
                <tbody>
                  ${preview.extractedTextPreview.map(function(line, index) {
                    return `<tr><td>${index + 1}</td><td>${escapeHtml(line)}</td></tr>`;

                </tbody>
              </table>

        document.getElementById('addPdfRowButton').addEventListener('click', function() {
          const tbody = document.getElementById('pdfReviewRows');
          tbody.insertAdjacentHTML('beforeend', renderPdfReviewRow({

            description: '',

            runningBalance: '',

        document.getElementById('tickHighPdfRowsButton').addEventListener('click', function() {

        document.getElementById('tickAllPdfRowsButton').addEventListener('click', function() {
          document.querySelectorAll('#pdfImportForm input[name="Use Row"]').forEach(function(input) {
            input.checked = true;
          });
        });

        document.getElementById('untickPdfRowsButton').addEventListener('click', function() {
          document.querySelectorAll('#pdfImportForm input[name="Use Row"]').forEach(function(input) {
            input.checked = false;
          });
        });

        document.getElementById('pdfImportForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const rows = readPdfReviewRows();
          if (!rows.length) {
            alert('Tick at least one reviewed row to import.');
            return;
          }
          google.script.run
            .withSuccessHandler(function(result) {

            <td><input type="checkbox" name="Use Row" ${checked}></td>
            <td><span class="badge ${confidence === 'High' || confidence === 'Manual' ? 'ok' : 'warn'}">${escapeHtml(confidence === 'High' ? 'Ready' : confidence)}</span></td>

            <td><input name="Description" value="${escapeAttr(row.description)}" title="${escapeAttr(row.sourceText || '')}"></td>
            <td><input name="Money In" value="${escapeAttr(row.moneyIn || '')}" inputmode="decimal"></td>
            <td><input name="Money Out" value="${escapeAttr(row.moneyOut || '')}" inputmode="decimal"></td>
            <td><input name="Running Balance" value="${escapeAttr(row.runningBalance || '')}" inputmode="decimal"></td>
            <td><input name="Reference Number" value="${escapeAttr(row.referenceNumber || '')}"></td>

      function readPdfReviewRows() {
        return Array.prototype.map.call(document.querySelectorAll('#pdfImportForm [data-pdf-row]'), function(row) {

            return null;
          }
          return {
            statementDate: displayToIsoDate(row.querySelector('[name="Statement Date"]').value) || row.querySelector('[name="Statement Date"]').value,
            description: row.querySelector('[name="Description"]').value,
            moneyIn: row.querySelector('[name="Money In"]').value,
            moneyOut: row.querySelector('[name="Money Out"]').value,
            runningBalance: row.querySelector('[name="Running Balance"]').value,
            referenceNumber: row.querySelector('[name="Reference Number"]').value,

              alert(error.message || String(error));

          .withSuccessHandler(function(result) {
            hideBusy();
            state.filteredBankLines = result.lines;

            document.querySelectorAll('[data-bank-page]').forEach(function(button) {
              button.onclick = function() { loadFilteredBankLines(Number(button.dataset.bankPage)); };

        document.querySelectorAll('[data-resolve-duplicate]').forEach(function(button) {

              .withSuccessHandler(function() { loadFilteredBankLines(1); showMessage('Duplicate review saved.'); })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .resolveDuplicateBankLine(button.dataset.resolveDuplicate, button.dataset.decision, note);

      function openQuickBankLineClassification(bankLineId) {
        const line = (state.filteredBankLines || []).filter(function(item) { return item.bankLineId === bankLineId; })[0];

        document.getElementById('bankLineQuickClassify').innerHTML = `
          <section class="message" style="margin-top:12px;"><h3>Classify ${escapeHtml(bankLineId)}</h3>

            <form id="quickClassifyForm" class="form-grid">
              ${selectField('Classification', 'Category ID', state.finance.categories.filter(function(category) { return category.categoryType === transactionType; }).map(categoryOption))}
              ${selectField('Fund or project', 'Fund ID', [{ value: '', label: 'General / none' }].concat(state.finance.funds.map(fundOption)))}

            .withSuccessHandler(function() { refreshBankStatements('Bank line sent to the Publisher.'); })

            .createTransactionFromBankLine(bankLineId, readFormValues(event.target));

      function editUserAccess(event) {
        const userId = event.target.dataset.editUser;
        const user = state.administration.users.find(function(item) {
          return item.userId === userId;
        });
        if (!user) {
          return;
        }

        const form = document.getElementById('userAccessForm');
        form.querySelector('[name="User ID"]').value = user.userId;
        form.querySelector('[name="Email"]').value = user.email;
        form.querySelector('[name="Full Name"]').value = user.fullName;
        form.querySelector('[name="Member ID"]').value = user.memberId || '';
        form.querySelector('[name="Status"]').value = user.status || 'Active';
        const roles = user.roles.split(',').map(function(role) { return role.trim(); });
        form.querySelectorAll('input[name="Roles"]').forEach(function(input) {
          input.checked = roles.indexOf(input.value) !== -1;
