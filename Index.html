      function renderCategoryOptionsForLine(line, selectedValue) {
        const categoryType = getBankLineCategoryType(line);
        const categories = state.finance ? state.finance.categories : [];
        return categories.filter(function(category) {
          return category.categoryType === categoryType;
        }).map(function(category) {
          return `<option value="${escapeAttr(category.categoryId)}" ${category.categoryId === selectedValue ? 'selected' : ''}>${escapeHtml(category.categoryName)}</option>`;
        }).join('');
      }

      function renderFundOptions(selectedValue) {
        const funds = state.finance ? state.finance.funds : [];
        return `<option value="">None</option>` + funds.map(function(fund) {
          return `<option value="${escapeAttr(fund.fundId)}" ${fund.fundId === selectedValue ? 'selected' : ''}>${escapeHtml(fund.fundName)}</option>`;
        }).join('');
      }

      function renderSplitRow(line, amount, index) {
        return `
          <div class="split-row" data-split-row="1">
            <div>
              <label>Amount</label>
              <input name="Split Amount" value="${escapeAttr(amount || '')}" inputmode="decimal">
            </div>
            <div>
              <label>Category</label>
              <select name="Split Category">${renderCategoryOptionsForLine(line, '')}</select>
            </div>
            <div>
              <label>Fund</label>
              <select name="Split Fund">${renderFundOptions('')}</select>
            </div>
            <div>
              <label>Description</label>
              <input name="Split Description" value="${escapeAttr(line && index === 0 ? line.description : '')}">
            </div>
            <div>
              <button class="action danger" type="button" data-remove-split="1">Remove</button>
            </div>
          </div>
        `;
      }

      function resetSplitRows(matchData) {
        const select = document.getElementById('createBankLineId');
        const container = document.getElementById('splitRows');
        if (!select || !container) {
          return;
        }
        const line = getBankLineById(matchData, select.value);
        container.innerHTML = renderSplitRow(line, getBankLineAmount(line), 0);
        bindSplitRemoveButtons();
        updateSplitRemaining();
      }

      function addSplitRow(matchData) {
        const select = document.getElementById('createBankLineId');
        const container = document.getElementById('splitRows');
        if (!select || !container) {
          return;
        }
        const line = getBankLineById(matchData, select.value);
        container.insertAdjacentHTML('beforeend', renderSplitRow(line, '', container.children.length));
        bindSplitRemoveButtons();
        updateSplitRemaining();
      }

      function bindSplitRemoveButtons() {
        document.querySelectorAll('[data-remove-split]').forEach(function(button) {
          button.onclick = function() {
            const rows = document.querySelectorAll('[data-split-row]');
            if (rows.length <= 1) {
              alert('Keep at least one category row.');
              return;
            }
            button.closest('[data-split-row]').remove();
            updateSplitRemaining();
          };
        });
        document.querySelectorAll('[data-split-row] [name="Split Amount"]').forEach(function(input) {
          input.oninput = updateSplitRemaining;
        });
      }

      function updateSplitRemaining() {
        const output = document.getElementById('splitRemaining');
        const select = document.getElementById('createBankLineId');
        if (!output || !select || !state.bankMatchData) { return; }
        const line = getBankLineById(state.bankMatchData, select.value);
        const total = Array.prototype.reduce.call(document.querySelectorAll('[data-split-row] [name="Split Amount"]'), function(sum, input) {
          return sum + (Number(String(input.value || '0').replace(/,/g, '')) || 0);
        }, 0);
        const remaining = Math.round((getBankLineAmount(line) - total) * 100) / 100;
        output.textContent = 'Remaining to allocate: ' + formatMoney(remaining);
      }

      function readSplitRows() {
        return Array.prototype.map.call(document.querySelectorAll('[data-split-row]'), function(row) {
          return {
            Amount: row.querySelector('[name="Split Amount"]').value,
            'Category ID': row.querySelector('[name="Split Category"]').value,
            'Fund ID': row.querySelector('[name="Split Fund"]').value,
            Description: row.querySelector('[name="Split Description"]').value
          };
        });
      }

      function bindMatchingControls(matchData) {
        const matchButton = document.getElementById('matchSelectedButton');
        if (matchButton) {
          matchButton.addEventListener('click', function() {
            const bankLineId = document.getElementById('selectedBankLine').value;
            const transactionId = document.getElementById('selectedTransaction').value;
            google.script.run
              .withSuccessHandler(function(result) {
                refreshBankStatements('Matched: ' + result.matchId);
              })
              .withFailureHandler(function(error) {
                alert(error.message || String(error));
              })
              .matchBankLineToTransaction(bankLineId, transactionId, '');
          });
        }

        const suggestButton = document.getElementById('suggestMatchesButton');
        if (suggestButton) {
          suggestButton.addEventListener('click', function() {
            const bankLineId = document.getElementById('selectedBankLine').value;
            google.script.run
              .withSuccessHandler(renderMatchSuggestions)
              .withFailureHandler(function(error) {
                alert(error.message || String(error));
              })
              .getMatchSuggestions(bankLineId);
          });
        }

        const needsReviewButton = document.getElementById('needsReviewButton');
        if (needsReviewButton) {
          needsReviewButton.addEventListener('click', function() {
            const note = prompt('Why does this need review?', '') || '';
            google.script.run
              .withSuccessHandler(function() { refreshBankStatements('Bank line marked for review.'); })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .markBankLineNeedsReview(document.getElementById('selectedBankLine').value, note);
          });
        }

        const transferButton = document.getElementById('internalTransferButton');
        if (transferButton) {
          transferButton.addEventListener('click', function() {
            const bankLineId = document.getElementById('selectedBankLine').value;
            const destinationAccountId = document.getElementById('transferDestinationAccount').value;
            if (!bankLineId || !destinationAccountId) {
              alert('Choose the bank line and the other association account.');
              return;
            }
            const note = prompt('Internal transfer note', '') || '';
            if (!confirm('Prepare both sides of this internal transfer for Publisher review?')) {
              return;
            }
            google.script.run
              .withSuccessHandler(function(result) { refreshBankStatements('Internal transfer prepared: ' + result.transferGroupId); })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .createInternalTransferFromBankLine(bankLineId, destinationAccountId, note);
          });
        }

        const createForm = document.getElementById('createFromBankLineForm');
        if (createForm) {
          resetSplitRows(matchData);
          document.getElementById('createBankLineId').addEventListener('change', function() {
            resetSplitRows(matchData);
          });
          document.getElementById('addSplitRowButton').addEventListener('click', function() {
            addSplitRow(matchData);
          });
          document.getElementById('resetSplitRowsButton').addEventListener('click', function() {
            resetSplitRows(matchData);
          });
          createForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const values = readFormValues(event.target);
            const bankLineId = values['Bank Line ID'];
            delete values['Bank Line ID'];
            values.Splits = JSON.stringify(readSplitRows());
            google.script.run
              .withSuccessHandler(function(result) {
                const count = result.transactionIds ? result.transactionIds.length : 1;
                refreshBankStatements(count + ' category record(s) sent to the Publisher.');
              })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .createTransactionFromBankLine(bankLineId, values);
          });
        }

        const reconciliationForm = document.getElementById('reconciliationForm');
        if (reconciliationForm) {
          reconciliationForm.addEventListener('submit', function(event) {
            event.preventDefault();
            google.script.run
              .withSuccessHandler(function(result) {
                refreshBankStatements('Reconciliation prepared: ' + result.reconciliationId + '. Difference: ' + formatMoney(result.summary.difference));
              })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .prepareReconciliation(readFormValues(event.target));
          });
        }

        document.querySelectorAll('[data-publish-reconciliation]').forEach(function(button) {
          button.addEventListener('click', function() {
            const note = prompt('Publish reconciliation note', '') || '';
            google.script.run
              .withSuccessHandler(function() { refreshBankStatements('Reconciliation published and locked.'); })
              .withFailureHandler(function(error) { alert(error.message || String(error)); })
              .publishReconciliation(button.dataset.publishReconciliation, note);
          });
        });
      }

      function renderMatchSuggestions(suggestions) {
        document.getElementById('matchSuggestions').innerHTML = suggestions.length ? `
          <h3>Suggested Matches</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Score</th><th>Transaction</th><th>Amount</th></tr></thead>
              <tbody>
                ${suggestions.map(function(item) {
                  return `<tr><td>${escapeHtml(item.score)}</td><td>${escapeHtml(item.transaction.transactionId + ' - ' + item.transaction.description)}</td><td>${formatMoney(item.transaction.amount)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        ` : '<p class="muted">No likely matches found.</p>';
      }

      function renderSimpleMatchTable(matches) {
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Match ID</th><th>Bank Line</th><th>Transaction</th><th>Status</th></tr></thead>
              <tbody>
                ${matches.map(function(match) {
                  return `<tr><td>${escapeHtml(match.matchId)}</td><td>${escapeHtml(match.bankLineId)}</td><td>${escapeHtml(match.transactionId)}</td><td>${escapeHtml(match.matchStatus)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderReconciliations(reconciliations, canPublish) {
        return `
          <section class="panel">
            <h3>Reconciliations</h3>
            ${reconciliations.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>ID</th><th>Period</th><th>Expected</th><th>Statement</th><th>Difference</th><th>Status</th><th>Action</th></tr></thead>
                  <tbody>
                    ${reconciliations.map(function(item) {
                      return `<tr><td>${escapeHtml(item.reconciliationId)}</td><td>${escapeHtml(item.periodStart + ' to ' + item.periodEnd)}</td><td>${formatMoney(item.expectedClosingBalance)}</td><td>${formatMoney(item.statementClosingBalance)}</td><td>${formatMoney(item.difference)}</td><td><span class="badge">${escapeHtml(item.status)}</span></td><td>${canPublish && item.status === 'Ready to Publish' ? `<button class="action secondary" type="button" data-publish-reconciliation="${escapeAttr(item.reconciliationId)}">Publish</button>` : ''}</td></tr>`;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<p class="muted">No reconciliations prepared yet.</p>'}
          </section>
        `;
      }

      function submitUnifiedStatementPreview(event) {
        event.preventDefault();
        const accountId = event.target.querySelector('[name="Account ID"]').value;
        const file = event.target.querySelector('input[type="file"]').files[0];
        if (!file) {
          alert('Choose an Excel or CSV statement first.');
          return;
        }
        if (!/\.(xls|xlsx|csv)$/i.test(file.name)) {
          alert('Please use an Excel (.xls or .xlsx) or CSV file.');
          return;
        }
        showBusy('Opening the bank statement...');
        readFileAsBase64(file, function(base64) {
          google.script.run
            .withSuccessHandler(function(preview) {
              hideBusy();
              state.statementPreview = preview;
              renderUnifiedStatementWorkbench(preview);
            })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .previewBankStatement({
              accountId: accountId,
              fileName: file.name,
              mimeType: file.type,
              base64: base64
            });
        });
      }

      function renderUnifiedStatementWorkbench(preview) {
        const container = document.getElementById('statementWorkbench');
        if (!container) {
          return;
        }
        if (preview.needsMapping) {
          renderUnifiedStatementMapping(preview);
          return;
        }
        const rows = (preview.rows || []).filter(function(row) {
          return Number(row.moneyIn || 0) > 0 || Number(row.moneyOut || 0) > 0;
        });
        preview.rows = rows;
        container.innerHTML = `
          <hr>
          <h3>Review the statement</h3>
          <div class="message">
            <p><strong>${escapeHtml(rows.length)} bank item(s)</strong> found. Tick the rows to use, choose a classification, or use <strong>Split amount</strong> when one bank payment belongs to several classifications.</p>
            <p class="muted small">You can send only a few rows now. Any unticked rows will stay on this screen and will also be saved under <strong>Saved Work</strong>, so you can send them later without uploading the statement again.</p>
            ${preview.duplicateFile ? '<p><strong>This exact file was imported before.</strong> The app will hold possible duplicates for checking.</p>' : ''}
          </div>
          <form id="statementCommitForm">
            ${rows.length ? `<div class="statement-scroll-controls" aria-label="Statement table scrolling controls">
              <button class="action secondary" type="button" data-scroll-statement="left">← Scroll left</button>
              <span class="statement-scroll-hint muted">Swipe the table, or use these buttons to see every column.</span>
              <button class="action secondary" type="button" data-scroll-statement="right">Scroll right →</button>
            </div>` : ''}
            <div class="statement-review-scroll" id="statementReviewScroller" tabindex="0" role="region" aria-label="Scrollable statement review table">
              ${rows.length ? `<table class="statement-grid">
                <colgroup><col style="width:38px"><col style="width:96px"><col style="width:190px"><col style="width:92px"><col style="width:92px"><col style="width:165px"><col style="width:150px"><col style="width:125px"><col style="width:142px"></colgroup>
                <thead><tr><th class="include-cell"><input type="checkbox" id="toggleAllStatementRows" checked aria-label="Include all rows"></th><th>Date</th><th>Bank description</th><th>Money In</th><th>Money Out</th><th>Classification</th><th>Fund / Project</th><th>Member explanation</th><th>Evidence</th></tr></thead>
                <tbody>${rows.map(renderUnifiedStatementRow).join('')}</tbody>
              </table>` : '<p class="muted">No transaction rows were found. Use manual entry below.</p>'}
            </div>
            ${rows.length ? `<p class="muted small">Evidence is optional. You may attach one PDF, JPG, or PNG receipt/proof to each row.</p><div class="action-row"><button class="action" type="submit">Send Selected Rows To Publisher</button><button class="action secondary" type="button" id="saveStatementDraft">Save For Later</button></div>` : ''}
          </form>
        `;
        bindUnifiedStatementControls(preview);
      }

      function renderUnifiedStatementMapping(preview) {
        const options = [{ value: '', label: 'Not used' }].concat((preview.headers || []).map(function(header) { return { value: header, label: header }; }));
        const fields = [
          { key: 'date', label: 'Transaction date (required)' },
          { key: 'description', label: 'Bank description (required)' },
          { key: 'moneyIn', label: 'Money In / Credit' },
          { key: 'moneyOut', label: 'Money Out / Debit' },
          { key: 'amount', label: 'Single amount column (only if used)' },
          { key: 'balance', label: 'Running balance (optional)' },
          { key: 'reference', label: 'Reference (optional)' }
        ];
        const sampleRows = (preview.rawRows || []).slice(0, 5);
        document.getElementById('statementWorkbench').innerHTML = `
          <hr><h3>Confirm the bank columns</h3>
          <p class="muted">We selected likely columns for you. Check the choices below, then continue. For statements with separate Debit and Credit columns, leave the single amount column as “Not used”.</p>
          <form id="unifiedMappingForm" class="form-grid">
            ${fields.map(function(field) {
              return selectField(field.label, field.key, options.map(function(option) {
                return { value: option.value, label: option.label, selected: option.value === preview.suggestedMapping[field.key] };
              }));
            }).join('')}
            <div style="grid-column:1/-1;"><button class="action" type="submit">Use These Columns</button></div>
          </form>
          <h4>Sample from the uploaded file</h4>
          <div class="table-wrap">
            <table>
              <thead><tr>${(preview.headers || []).map(function(header) { return `<th>${escapeHtml(header)}</th>`; }).join('')}</tr></thead>
              <tbody>${sampleRows.map(function(row) {
                return `<tr>${(preview.headers || []).map(function(header, index) { return `<td>${escapeHtml(row[index] || '')}</td>`; }).join('')}</tr>`;
              }).join('')}</tbody>
            </table>
          </div>
        `;
        document.getElementById('unifiedMappingForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const mapping = readFormValues(event.target);
          if (!mapping.date || !mapping.description) {
            alert('Choose the transaction date and bank description columns.');
            return;
          }
          if (!mapping.moneyIn && !mapping.moneyOut && !mapping.amount) {
            alert('Choose a Money In, Money Out, or single amount column.');
            return;
          }
          showBusy('Applying the bank column choices...');
          google.script.run
            .withSuccessHandler(function(rows) {
              hideBusy();
              preview.rows = rows;
              preview.needsMapping = false;
              preview.parserProfile = 'Officer-confirmed column mapping';
              preview.highConfidenceCount = rows.filter(function(row) { return row.confidence === 'High'; }).length;
              preview.reviewCount = rows.length - preview.highConfidenceCount;
              renderUnifiedStatementWorkbench(preview);
            })
            .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
            .previewMappedBankStatement({ headers: preview.headers, rawRows: preview.rawRows, mapping: mapping });
        });
      }

      function renderUnifiedStatementRow(row, index) {
        const type = Number(row.moneyIn || 0) > 0 ? 'Money In' : 'Money Out';
        const selectedCategory = row.categoryId || row.suggestedCategoryId || '';
        const selectedForUse = Object.prototype.hasOwnProperty.call(row, 'include') ? row.include : true;
        const splits = Array.isArray(row.splits) ? row.splits : [];
        const bankAmount = Number(row.moneyIn || 0) > 0 ? Number(row.moneyIn || 0) : Number(row.moneyOut || 0);
        return `
          <tr data-workbench-row="${index}" data-confidence="${escapeAttr(row.confidence || 'Review')}" data-evidence-document-id="${escapeAttr(row.evidenceDocumentId || '')}" data-transaction-type="${escapeAttr(type)}" data-bank-amount="${escapeAttr(bankAmount)}" data-use-split="${splits.length ? '1' : '0'}">
            <td class="include-cell"><input type="checkbox" name="Include Row" ${selectedForUse ? 'checked' : ''} aria-label="Include row ${index + 1}"></td>
            <td><input name="Statement Date" value="${escapeAttr(isoToDisplayDate(row.statementDate || ''))}" inputmode="numeric" aria-label="Date for row ${index + 1}"></td>
            <td class="description-cell"><textarea name="Description" aria-label="Description for row ${index + 1}">${escapeHtml(row.description || '')}</textarea></td>
            <td class="amount-cell"><input name="Money In" value="${escapeAttr(row.moneyIn || '')}" inputmode="decimal" aria-label="Money In for row ${index + 1}"></td>
            <td class="amount-cell"><input name="Money Out" value="${escapeAttr(row.moneyOut || '')}" inputmode="decimal" aria-label="Money Out for row ${index + 1}"></td>
            <td class="category-cell"><select name="Category ID" data-statement-category-type="${escapeAttr(type)}" aria-label="Classification for row ${index + 1}" ${splits.length ? 'disabled' : ''}>${renderStatementCategoryOptions(type, selectedCategory)}</select><span class="small muted">${escapeHtml(type)}</span><button class="action secondary" type="button" data-toggle-statement-split="${index}" style="margin-top:6px;">${splits.length ? 'Cancel split' : 'Split amount'}</button></td>
            <td><select name="Fund ID" aria-label="Fund or project for row ${index + 1}" ${splits.length ? 'disabled' : ''}>${renderFundOptions(row.fundId || '')}</select><span class="small muted">Optional</span></td>
            <td><textarea name="Notes" placeholder="Optional plain-language explanation" aria-label="Member explanation for row ${index + 1}">${escapeHtml(row.notes || '')}</textarea></td>
            <td class="evidence-cell"><input type="file" name="Evidence File" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" aria-label="Evidence for row ${index + 1}"><span class="small muted" data-evidence-status>${row.evidenceDocumentId ? 'Evidence already attached' : 'Optional receipt/proof'}</span>
              <input type="hidden" name="Running Balance" value="${escapeAttr(row.runningBalance || '')}">
              <input type="hidden" name="Reference Number" value="${escapeAttr(row.referenceNumber || '')}">
              <input type="hidden" name="Counterparty" value="${escapeAttr(row.counterparty || '')}">
              <input type="hidden" name="Source Text" value="${escapeAttr(row.sourceText || '')}">
              <input type="hidden" name="Row Number" value="${escapeAttr(row.rowNumber || index + 1)}">
              <input type="hidden" name="Review Reason" value="${escapeAttr(row.reviewReason || '')}">
              <input type="hidden" name="Balance Check" value="${escapeAttr(row.balanceCheck || '')}">
            </td>
          </tr>
          <tr class="statement-split-row" data-statement-split-for="${index}" ${splits.length ? '' : 'hidden'}>
            <td colspan="9">
              <div class="statement-split-editor">
                <strong>Split <span data-statement-split-total>${formatMoney(bankAmount)}</span> across classifications</strong>
                <p class="muted small">Enter each part. The parts must add up exactly to the bank amount.</p>
                <div class="statement-split-list" data-statement-split-list>${splits.map(function(split, splitIndex) { return renderStatementSplitLine(type, split, splitIndex); }).join('')}</div>
                <p class="message small" data-statement-split-remaining>Remaining: ${formatMoney(bankAmount)}</p>
                <button class="action secondary" type="button" data-add-statement-split="${index}">Add another classification</button>
              </div>
            </td>
          </tr>
        `;
      }

      function renderStatementCategoryOptions(type, selectedCategory) {
        const categories = (state.finance.categories || []).filter(function(category) { return category.categoryType === type; });
        return `<option value="">Choose classification</option>` + categories.map(function(category) {
          return `<option value="${escapeAttr(category.categoryId)}" ${category.categoryId === selectedCategory ? 'selected' : ''}>${escapeHtml(category.categoryName)}</option>`;
        }).join('') + '<option value="__create__">+ Create new classification</option>';
      }

      function renderStatementSplitLine(type, split, splitIndex) {
        split = split || {};
        const amount = split.Amount || split.amount || '';
        const categoryId = split['Category ID'] || split.categoryId || '';
        const fundId = split['Fund ID'] || split.fundId || '';
        return `
          <div class="statement-split-line" data-statement-split-line>
            <div><label>Amount</label><input name="Split Amount" value="${escapeAttr(amount)}" inputmode="decimal"></div>
            <div><label>Classification</label><select name="Split Category" data-statement-category-type="${escapeAttr(type)}">${renderStatementCategoryOptions(type, categoryId)}</select></div>
            <div><label>Fund / Project</label><select name="Split Fund">${renderFundOptions(fundId)}</select></div>
            <button class="action danger" type="button" data-remove-statement-split aria-label="Remove split ${splitIndex + 1}">Remove</button>
          </div>
        `;
      }

      function bindUnifiedStatementControls(preview) {
        const toggleAll = document.getElementById('toggleAllStatementRows');
        if (toggleAll) {
          toggleAll.onchange = function() {
            document.querySelectorAll('[data-workbench-row] [name="Include Row"]').forEach(function(input) {
              input.checked = toggleAll.checked;
            });
          };
        }
        document.querySelectorAll('[data-workbench-row] [name="Evidence File"]').forEach(function(input) {
          input.onchange = function() {
            const row = input.closest('[data-workbench-row]');
            row.dataset.evidenceDocumentId = '';
            row.querySelector('[data-evidence-status]').textContent = input.files[0] ? input.files[0].name : 'Optional receipt/proof';
          };
        });
        bindStatementReviewScroller();
        bindStatementSplitControls();
        bindStatementCategoryCreation(document.getElementById('statementCommitForm'));
        document.getElementById('statementCommitForm').addEventListener('submit', function(event) {
          event.preventDefault();
          commitUnifiedStatement(preview, false);
        });
        document.getElementById('saveStatementDraft').onclick = function() { saveStatementDraft(preview); };
      }

      function bindStatementReviewScroller() {
        const scroller = document.getElementById('statementReviewScroller');
        if (!scroller) { return; }
        document.querySelectorAll('[data-scroll-statement]').forEach(function(button) {
          button.onclick = function() {
            const direction = button.dataset.scrollStatement === 'left' ? -1 : 1;
            scroller.scrollBy({ left: direction * Math.max(280, scroller.clientWidth * 0.75), behavior: 'smooth' });
          };
        });
      }

      function bindStatementSplitControls() {
        document.querySelectorAll('[data-toggle-statement-split]').forEach(function(button) {
          button.onclick = function() {
            const row = document.querySelector('[data-workbench-row="' + button.dataset.toggleStatementSplit + '"]');
            const splitRow = document.querySelector('[data-statement-split-for="' + button.dataset.toggleStatementSplit + '"]');
            const categorySelect = row.querySelector('[name="Category ID"]');
            const fundSelect = row.querySelector('[name="Fund ID"]');
            const opening = row.dataset.useSplit !== '1';
            row.dataset.useSplit = opening ? '1' : '0';
            splitRow.hidden = !opening;
            categorySelect.disabled = opening;
            fundSelect.disabled = opening;
            button.textContent = opening ? 'Cancel split' : 'Split amount';
            if (opening && !splitRow.querySelector('[data-statement-split-line]')) {
              const type = row.dataset.transactionType;
              const selectedCategory = categorySelect.value;
              const selectedFund = fundSelect.value;
              splitRow.querySelector('[data-statement-split-list]').innerHTML = renderStatementSplitLine(type, { categoryId: selectedCategory, fundId: selectedFund }, 0) + renderStatementSplitLine(type, {}, 1);
              bindStatementSplitLineControls(row, splitRow);
              bindStatementCategoryCreation(splitRow);
            }
            updateStatementSplitRemaining(row, splitRow);
          };
        });
        document.querySelectorAll('[data-add-statement-split]').forEach(function(button) {
          button.onclick = function() {
            const row = document.querySelector('[data-workbench-row="' + button.dataset.addStatementSplit + '"]');
            const splitRow = document.querySelector('[data-statement-split-for="' + button.dataset.addStatementSplit + '"]');
            const list = splitRow.querySelector('[data-statement-split-list]');
            list.insertAdjacentHTML('beforeend', renderStatementSplitLine(row.dataset.transactionType, {}, list.children.length));
            bindStatementSplitLineControls(row, splitRow);
            bindStatementCategoryCreation(splitRow);
            updateStatementSplitRemaining(row, splitRow);
          };
        });
        document.querySelectorAll('[data-workbench-row]').forEach(function(row) {
          const splitRow = document.querySelector('[data-statement-split-for="' + row.dataset.workbenchRow + '"]');
          row.querySelectorAll('[name="Money In"], [name="Money Out"]').forEach(function(input) {
            input.oninput = function() { updateStatementSplitRemaining(row, splitRow); };
          });
          bindStatementSplitLineControls(row, splitRow);
          updateStatementSplitRemaining(row, splitRow);
        });
      }

      function bindStatementSplitLineControls(row, splitRow) {
        if (!row || !splitRow) { return; }
        splitRow.querySelectorAll('[data-remove-statement-split]').forEach(function(button) {
          button.onclick = function() {
            if (splitRow.querySelectorAll('[data-statement-split-line]').length <= 2) {
              alert('A split needs at least two classifications. Use Cancel split to return to one classification.');
              return;
            }
            button.closest('[data-statement-split-line]').remove();
            updateStatementSplitRemaining(row, splitRow);
          };
        });
        splitRow.querySelectorAll('[name="Split Amount"]').forEach(function(input) {
          input.oninput = function() { updateStatementSplitRemaining(row, splitRow); };
        });
      }

      function updateStatementSplitRemaining(row, splitRow) {
        if (!row || !splitRow) { return; }
        const bankAmount = readStatementBankAmount(row);
        row.dataset.bankAmount = bankAmount;
        const allocated = Array.prototype.reduce.call(splitRow.querySelectorAll('[name="Split Amount"]'), function(total, input) {
          return total + (Number(String(input.value || '0').replace(/,/g, '')) || 0);
        }, 0);
        const remaining = Math.round((bankAmount - allocated) * 100) / 100;
        const output = splitRow.querySelector('[data-statement-split-remaining]');
        if (!output) { return; }
        const totalLabel = splitRow.querySelector('[data-statement-split-total]');
        if (totalLabel) { totalLabel.textContent = formatMoney(bankAmount); }
        output.textContent = Math.abs(remaining) <= 0.01 ? 'Balanced: the split equals ' + formatMoney(bankAmount) : 'Remaining: ' + formatMoney(remaining);
        output.classList.toggle('split-balanced', Math.abs(remaining) <= 0.01);
      }

      function readStatementBankAmount(row) {
        const moneyIn = Number(String(row.querySelector('[name="Money In"]').value || '0').replace(/,/g, '')) || 0;
        const moneyOut = Number(String(row.querySelector('[name="Money Out"]').value || '0').replace(/,/g, '')) || 0;
        return moneyIn > 0 ? moneyIn : moneyOut;
      }

      function readStatementSplits(row) {
        if (row.dataset.useSplit !== '1') { return []; }
        const splitRow = document.querySelector('[data-statement-split-for="' + row.dataset.workbenchRow + '"]');
        return Array.prototype.map.call(splitRow.querySelectorAll('[data-statement-split-line]'), function(line) {
          return {
            Amount: line.querySelector('[name="Split Amount"]').value,
            'Category ID': line.querySelector('[name="Split Category"]').value,
            'Fund ID': line.querySelector('[name="Split Fund"]').value
          };
        });
      }

      function bindStatementCategoryCreation(container) {
        if (!container) { return; }
        container.querySelectorAll('select[data-statement-category-type]').forEach(function(select) {
          select.onfocus = function() { select.dataset.previousValue = select.value; };
          select.onchange = function() {
            if (select.value !== '__create__') { return; }
            const previousValue = select.dataset.previousValue || '';
            const categoryName = prompt('Name the new ' + select.dataset.statementCategoryType + ' classification:', '');
            if (!categoryName || !categoryName.trim()) {
              select.value = previousValue;
              return;
            }
            showBusy('Creating the new classification...');
            google.script.run
              .withSuccessHandler(function(result) {
                hideBusy();
                if (!(state.finance.categories || []).some(function(category) { return category.categoryId === result.categoryId; })) {
                  state.finance.categories.push({ categoryId: result.categoryId, categoryType: result.categoryType, categoryName: result.categoryName });
                }
                document.querySelectorAll('select[data-statement-category-type]').forEach(function(categorySelect) {
                  const currentValue = categorySelect === select ? result.categoryId : categorySelect.value;
                  categorySelect.innerHTML = renderStatementCategoryOptions(categorySelect.dataset.statementCategoryType, currentValue);
                  categorySelect.value = currentValue;
                });
                bindStatementCategoryCreation(document.getElementById('statementCommitForm'));
                showMessage(result.created ? 'Classification created.' : 'That classification already existed and has been selected.');
              })
              .withFailureHandler(function(error) {
                hideBusy();
                select.value = previousValue;
                alert(error.message || String(error));
              })
              .addStatementClassification({ categoryType: select.dataset.statementCategoryType, categoryName: categoryName.trim() });
          };
        });
      }

      function readUnifiedStatementRows(forceReview, includeAll) {
        return Array.prototype.map.call(document.querySelectorAll('[data-workbench-row]'), function(card, clientIndex) {
          const values = readFormValues(card);
          return {
            clientIndex: clientIndex,
            include: card.querySelector('[name="Include Row"]').checked,
            statementDate: displayToIsoDate(values['Statement Date']) || values['Statement Date'],
            description: values.Description,
            moneyIn: values['Money In'],
            moneyOut: values['Money Out'],
            runningBalance: values['Running Balance'],
            referenceNumber: values['Reference Number'],
            counterparty: values.Counterparty,
            categoryId: forceReview || card.dataset.useSplit === '1' ? '' : values['Category ID'],
            fundId: values['Fund ID'],
            splits: forceReview ? [] : readStatementSplits(card),
            notes: values.Notes,
            evidenceDocumentId: card.dataset.evidenceDocumentId || '',
            sourceText: values['Source Text'],
            rowNumber: values['Row Number'],
            confidence: card.dataset.confidence,
            reviewReason: values['Review Reason'],
            balanceCheck: values['Balance Check'],
            resolution: forceReview ? 'Needs Review' : 'Classify'
          };
        }).filter(function(row) { return includeAll || row.include; });
      }

      function commitUnifiedStatement(preview, forceReview) {
        const allRows = readUnifiedStatementRows(forceReview, true);
        const rows = allRows.filter(function(row) { return row.include; });
        const remainingRows = allRows.filter(function(row) { return !row.include; }).map(function(row) {
          row.include = true;
          return row;
        });
        if (!rows.length) { alert('Tick at least one row to send.'); return; }
        for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
          const row = rows[rowIndex];
          if (row.splits && row.splits.length) {
            if (row.splits.length < 2) {
              alert('Row ' + (rowIndex + 1) + ': a split needs at least two classifications.');
              return;
            }
            let splitTotal = 0;
            for (let splitIndex = 0; splitIndex < row.splits.length; splitIndex++) {
              const split = row.splits[splitIndex];
              const splitAmount = Number(String(split.Amount || '0').replace(/,/g, '')) || 0;
              if (splitAmount <= 0 || !split['Category ID'] || split['Category ID'] === '__create__') {
                alert('Row ' + (rowIndex + 1) + ': enter an amount and classification for every split line.');
                return;
              }
              splitTotal += splitAmount;
            }
            const moneyIn = Number(String(row.moneyIn || '0').replace(/,/g, '')) || 0;
            const bankAmount = Number(String((moneyIn > 0 ? row.moneyIn : row.moneyOut) || '0').replace(/,/g, '')) || 0;
            if (Math.abs(splitTotal - bankAmount) > 0.01) {
              alert('Row ' + (rowIndex + 1) + ': split amounts must equal ' + formatMoney(bankAmount) + '.');
              return;
            }
          } else if (!row.categoryId || row.categoryId === '__create__') {
            alert('Choose a classification for every selected row.');
            return;
          }
        }
        showBusy('Uploading any evidence and saving the statement...');
        uploadStatementRowEvidence(rows, function(completedRows) {
          google.script.run
            .withSuccessHandler(function(result) {
              const sentMessage = 'Statement saved: ' + result.transactionsPrepared + ' item(s) sent to the Publisher' + (result.duplicateCount ? ', with ' + result.duplicateCount + ' possible duplicate(s) held for checking.' : '.');
              if (remainingRows.length) {
                saveRemainingStatementRows(preview, remainingRows, sentMessage);
                return;
              }
              hideBusy();
              refreshBankStatements(sentMessage);
            })
            .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
            .commitStatementWorkbench({
              accountId: preview.accountId,
              fileName: preview.fileName,
              fileId: preview.fileId,
              documentId: preview.documentId,
              fileHash: preview.fileHash,
              sourceFormat: preview.sourceFormat,
              parserProfile: preview.parserProfile,
              draftId: remainingRows.length ? '' : (preview.draftId || ''),
              rows: completedRows
            });
        });
      }

      function saveRemainingStatementRows(preview, remainingRows, sentMessage) {
        showBusy('Saving the rows that were not sent...');
        google.script.run
          .withSuccessHandler(function(result) {
            hideBusy();
            preview.draftId = result.draftId;
            preview.rows = remainingRows;
            state.statementPreview = preview;
            renderUnifiedStatementWorkbench(preview);
            showMessage(sentMessage + ' ' + remainingRows.length + ' unsent row(s) remain below and were saved under Saved Work.');
            const workbench = document.getElementById('statementWorkbench');
            if (workbench) { workbench.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
          })
          .withFailureHandler(function(error) {
            hideBusy();
            preview.rows = remainingRows;
            state.statementPreview = preview;
            renderUnifiedStatementWorkbench(preview);
            showMessage(sentMessage + ' The unsent rows remain below, but automatic Saved Work backup failed. Click Save For Later before leaving this page.');
            alert('The selected rows were sent, but the remaining rows could not be backed up automatically. They are still shown below. Click Save For Later before leaving this page.\n\n' + (error.message || String(error)));
          })
          .saveStatementReviewDraft({
            accountId: preview.accountId,
            fileName: preview.fileName,
            fileId: preview.fileId,
            documentId: preview.documentId,
            fileHash: preview.fileHash,
            sourceFormat: preview.sourceFormat,
            parserProfile: preview.parserProfile,
            duplicateFile: preview.duplicateFile,
            draftId: preview.draftId || '',
            rows: remainingRows
          });
      }

      function uploadStatementRowEvidence(rows, done) {
        const pending = rows.filter(function(row) {
          const element = document.querySelector('[data-workbench-row="' + row.clientIndex + '"]');
          const input = element && element.querySelector('[name="Evidence File"]');
          row.evidenceFile = input && input.files ? input.files[0] : null;
          row.evidenceDocumentId = element ? (element.dataset.evidenceDocumentId || '') : '';
          return row.evidenceFile && !row.evidenceDocumentId;
        });
        const invalid = pending.filter(function(row) {
          return row.evidenceFile.size > 5 * 1024 * 1024 || !/\.(pdf|jpe?g|png)$/i.test(row.evidenceFile.name);
        })[0];
        if (invalid) {
          hideBusy();
          alert('Evidence must be a PDF, JPG, or PNG file no larger than 5 MB.');
          return;
        }
        function uploadNext(position) {
          if (position >= pending.length) {
            rows.forEach(function(row) { delete row.evidenceFile; });
            done(rows);
            return;
          }
          const row = pending[position];
          const file = row.evidenceFile;
          readFileAsBase64(file, function(base64) {
            google.script.run
              .withSuccessHandler(function(result) {
                row.evidenceDocumentId = result.documentId;
                const element = document.querySelector('[data-workbench-row="' + row.clientIndex + '"]');
                if (element) {
                  element.dataset.evidenceDocumentId = result.documentId;
                  element.querySelector('[data-evidence-status]').textContent = 'Attached: ' + file.name;
                }
                uploadNext(position + 1);
              })
              .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
              .uploadFinanceDocument({ fileName: file.name, mimeType: file.type || evidenceMimeType(file.name), base64: base64, visibility: 'Finance Only' });
          });
        }
        uploadNext(0);
      }

      function evidenceMimeType(fileName) {
        if (/\.pdf$/i.test(fileName)) { return 'application/pdf'; }
        if (/\.png$/i.test(fileName)) { return 'image/png'; }
        return 'image/jpeg';
      }

      function saveStatementDraft(preview) {
        const rows = readUnifiedStatementRows(false, true);
        showBusy('Saving the statement review...');
        google.script.run
          .withSuccessHandler(function(result) { hideBusy(); refreshBankStatements('Statement review saved: ' + result.draftId); })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .saveStatementReviewDraft({
            accountId: preview.accountId,
            fileName: preview.fileName,
            fileId: preview.fileId,
            documentId: preview.documentId,
            fileHash: preview.fileHash,
            sourceFormat: preview.sourceFormat,
            parserProfile: preview.parserProfile,
            duplicateFile: preview.duplicateFile,
            draftId: preview.draftId || '',
            rows: rows
          });
      }

      function resumeStatementDraft(draftId) {
        showBusy('Opening the saved statement review...');
        google.script.run
          .withSuccessHandler(function(preview) {
            hideBusy();
            preview.highConfidenceCount = (preview.rows || []).filter(function(row) { return row.confidence === 'High'; }).length;
            preview.reviewCount = (preview.rows || []).length - preview.highConfidenceCount;
            preview.balanceBreakCount = (preview.rows || []).filter(function(row) { return row.balanceCheck === 'Break'; }).length;
            state.statementPreview = preview;
            state.statementObjectUrl = '';
            if (preview.sourceFormat === 'PDF') {
              showBusy('Opening the original PDF evidence...');
              google.script.run
                .withSuccessHandler(function(evidence) {
                  hideBusy();
                  const binary = atob(evidence.base64);
                  const bytes = new Uint8Array(binary.length);
                  for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
                  state.statementObjectUrl = URL.createObjectURL(new Blob([bytes], { type: evidence.mimeType }));
                  renderUnifiedStatementWorkbench(preview);
                  document.getElementById('statementWorkbench').scrollIntoView({ behavior: 'smooth', block: 'start' });
                })
                .withFailureHandler(function() {
                  hideBusy();
                  renderUnifiedStatementWorkbench(preview);
                  showMessage('Draft opened. The original PDF could not be displayed, but the saved rows are available.');
                })
                .getStatementEvidenceForReview(preview.documentId);
              return;
            }
            renderUnifiedStatementWorkbench(preview);
            document.getElementById('statementWorkbench').scrollIntoView({ behavior: 'smooth', block: 'start' });
          })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .resumeStatementReviewDraft(draftId);
      }

      function discardStatementDraft(draftId) {
        if (!confirm('Discard this saved review? The original bank statement evidence will remain stored.')) { return; }
        showBusy('Discarding the saved review...');
        google.script.run
          .withSuccessHandler(function() { hideBusy(); refreshBankStatements('Saved review discarded.'); })
          .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
          .discardStatementReviewDraft(draftId);
      }

      function submitCsvPreview(event) {
        event.preventDefault();
        const accountId = event.target.querySelector('[name="Account ID"]').value;
        const file = event.target.querySelector('input[type="file"]').files[0];
        if (!file) {
          alert('Choose a CSV file first.');
          return;
        }

        readFileAsBase64(file, function(base64) {
          google.script.run
            .withSuccessHandler(function(preview) {
              renderCsvPreview(preview, accountId);
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .previewBankCsv({
              fileName: file.name,
              base64: base64
            });
        });
      }

      function renderCsvPreview(preview, accountId) {
        const fields = [
          { key: 'date', label: 'Date column' },
          { key: 'description', label: 'Description column' },
          { key: 'moneyIn', label: 'Money-in column' },
          { key: 'moneyOut', label: 'Money-out column' },
          { key: 'amount', label: 'Amount column' },
          { key: 'balance', label: 'Balance column' },
          { key: 'reference', label: 'Reference column' }
        ];
        const options = [{ value: '', label: 'Not used' }].concat(preview.headers.map(function(header) {
          return { value: header, label: header };
        }));

        document.getElementById('csvPreview').innerHTML = `
          <hr>
          <h3>CSV Preview</h3>
          <p class="muted">${escapeHtml(preview.rowCount)} rows found. Confirm the columns before importing.</p>
          <form id="csvImportForm" class="form-grid">
            ${fields.map(function(field) {
              return selectField(field.label, field.key, options.map(function(option) {
                return {
                  value: option.value,
                  label: option.label,
                  selected: option.value === preview.suggestedMapping[field.key]
                };
              }));
            }).join('')}
            <div style="grid-column: 1 / -1;"><button class="action" type="submit">Import CSV Lines</button></div>
          </form>
          <div class="table-wrap">
            <table>
              <thead><tr>${preview.headers.map(function(header) { return `<th>${escapeHtml(header)}</th>`; }).join('')}</tr></thead>
              <tbody>
                ${preview.previewRows.map(function(row) {
                  return `<tr>${row.map(function(value) { return `<td>${escapeHtml(value)}</td>`; }).join('')}</tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById('csvImportForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const mapping = readFormValues(event.target);
          google.script.run
            .withSuccessHandler(function(result) {
              refreshBankStatements('Imported ' + result.rowsImported + ' bank lines' + (result.duplicateWarning ? ' with duplicate warning.' : '.'));
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .importBankCsv({
              accountId: accountId,
              fileName: preview.fileName,
              rawBase64: preview.rawBase64,
              mapping: mapping
            });
        });
      }

      function submitPdfPreview(event) {
        event.preventDefault();
        const accountId = event.target.querySelector('[name="Account ID"]').value;
        const file = event.target.querySelector('input[type="file"]').files[0];
        if (!file) {
          alert('Choose a PDF file first.');
          return;
        }

        showBusy('Extracting PDF...');
        readFileAsBase64(file, function(base64) {
          google.script.run
            .withSuccessHandler(function(preview) {
              hideBusy();
              renderPdfPreview(preview, accountId);
            })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .previewBankPdf({
              fileName: file.name,
              base64: base64
            });
        });
      }

      function renderPdfPreview(preview, accountId) {
        document.getElementById('pdfPreview').innerHTML = `
          <hr>
          <h3>PDF Review</h3>
          <p class="muted">${escapeHtml(preview.rowCount)} possible rows found using ${escapeHtml(preview.parserProfile || 'automatic review')}. ${escapeHtml(preview.highConfidenceCount || 0)} are ready to import; ${escapeHtml(preview.reviewCount || 0)} need review.</p>
          ${preview.needsManualReview ? `
            <div class="message warn">
              <p>No complete statement rows were detected automatically. The PDF text is shown below so you can copy details into manual rows.</p>
            </div>

              <button class="action secondary" type="button" id="untickPdfRowsButton">Untick All</button>
            </div>

          ${preview.extractedTextPreview && preview.extractedTextPreview.length ? `

            <div class="table-wrap">

                <tbody>

                </tbody>

            </div>

        document.getElementById('addPdfRowButton').addEventListener('click', function() {

          tbody.insertAdjacentHTML('beforeend', renderPdfReviewRow({

          }, tbody.children.length));

        document.getElementById('pdfImportForm').addEventListener('submit', function(event) {
          event.preventDefault();

          google.script.run
            .withSuccessHandler(function(result) {
              refreshBankStatements('Imported ' + result.rowsImported + ' PDF bank lines' + (result.duplicateWarning ? ' with duplicate warning.' : '.'));

            .importBankPdfRows({

      function renderPdfReviewRow(row, index) {
        const confidence = row.confidence || 'Manual';
        const checked = confidence === 'Review' ? '' : 'checked';
        return `
          <tr data-pdf-row="${index}" data-confidence="${escapeAttr(confidence)}">
            <td><input type="checkbox" name="Use Row" ${checked}></td>
            <td><span class="badge ${confidence === 'High' || confidence === 'Manual' ? 'ok' : 'warn'}">${escapeHtml(confidence === 'High' ? 'Ready' : confidence)}</span></td>
            <td><input name="Statement Date" value="${escapeAttr(isoToDisplayDate(row.statementDate))}" placeholder="dd-mm-yyyy"></td>
            <td><input name="Description" value="${escapeAttr(row.description)}" title="${escapeAttr(row.sourceText || '')}"></td>
            <td><input name="Money In" value="${escapeAttr(row.moneyIn || '')}" inputmode="decimal"></td>
            <td><input name="Money Out" value="${escapeAttr(row.moneyOut || '')}" inputmode="decimal"></td>
            <td><input name="Running Balance" value="${escapeAttr(row.runningBalance || '')}" inputmode="decimal"></td>
            <td><input name="Reference Number" value="${escapeAttr(row.referenceNumber || '')}"></td>
          </tr>
        `;

      function readPdfReviewRows() {
        return Array.prototype.map.call(document.querySelectorAll('#pdfImportForm [data-pdf-row]'), function(row) {
          if (!row.querySelector('[name="Use Row"]').checked) {
            return null;
          }
          return {

      function submitPdfUpload(event) {
        event.preventDefault();

          return;
        }
        readFileAsBase64(file, function(base64) {

            .withSuccessHandler(function(result) {

            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));

            .uploadBankStatementPdf({
              fileName: file.name,
              mimeType: file.type,
              base64: base64
            });
        });

      function submitManualBankLine(event) {
        event.preventDefault();
        const form = event.target;
        const record = readFormValues(form);
        const evidenceInput = form.querySelector('[name="Evidence File"]');
        const evidence = evidenceInput && evidenceInput.files ? evidenceInput.files[0] : null;
        if (!record['Category ID']) {
          alert('Choose a classification.');
          return;
        }
        if (evidence && (evidence.size > 5 * 1024 * 1024 || !/\.(pdf|jpe?g|png)$/i.test(evidence.name))) {
          alert('Evidence must be a PDF, JPG, or PNG file no larger than 5 MB.');
          return;
        }
        showBusy(evidence ? 'Uploading evidence and saving the item...' : 'Saving the bank item...');
        function saveRecord() {
          google.script.run
            .withSuccessHandler(function(result) {
              hideBusy();
              refreshBankStatements('Bank item sent to the Publisher' + (result.duplicateWarning ? ', but held as a possible duplicate.' : '.'));
            })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .addManualBankStatementLine(record);
        }
        if (!evidence) {
          saveRecord();
          return;
        }
        readFileAsBase64(evidence, function(base64) {
          google.script.run
            .withSuccessHandler(function(result) {
              record['Document ID'] = result.documentId;
              saveRecord();
            })
            .withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); })
            .uploadFinanceDocument({ fileName: evidence.name, mimeType: evidence.type || evidenceMimeType(evidence.name), base64: base64, visibility: 'Finance Only' });
        });
      }

              ${inputField('City', 'City', profile.city)}
              ${inputField('State', 'State', profile.state)}
              ${inputField('Country', 'Country', profile.country)}
              ${inputField('Occupation', 'Occupation', profile.occupation)}
              ${inputField('Employer or Business', 'Employer or Business', profile.employerOrBusiness)}
              <div style="grid-column: 1 / -1;">

              ${privacyCheck('Show City Country', 'Show my city and country', data.privacy['Show City Country'])}
              ${privacyCheck('Show Occupation', 'Show my occupation', data.privacy['Show Occupation'])}
              ${privacyCheck('Show Phone', 'Show my phone number', data.privacy['Show Phone'])}

              <button class="action" type="submit">Save Privacy Settings</button>
