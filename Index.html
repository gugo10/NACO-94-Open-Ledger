          ${renderPendingRequests(data.pendingRequests)}
        `;

        document.getElementById('profileUpdateForm').addEventListener('submit', submitProfileUpdate);
        document.getElementById('privacyForm').addEventListener('submit', submitPrivacySettings);
      }

      function renderMembers() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Members</h2>
            <p class="muted">Loading the member directory...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(directory) {
            state.directory = directory;
            drawMembers(directory);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Members', error.message || String(error));
          })
          .getMemberDirectory();
      }

      function renderReports() {
        state.currentReport = null;
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Reports</h2>
            <p class="muted">Loading reports...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(stage6) {
            drawReports(stage6);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Reports', error.message || String(error));
          })
          .getStage6Data();
      }

      function drawReports(stage6) {
        const yearStart = isoToDisplayDate(new Date().getFullYear() + '-01-01');
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Reports</h2>
            <p class="muted">Generate professional nonprofit financial statements from published records for any period.</p>
            <p class="report-disclosure small"><strong>Accounting basis:</strong> day-to-day records remain cash-derived. A Publisher-approved report pack can add disclosed receivables, unpaid expenses, deferred income, and prepaid expenses for the selected period. This improves accrual-style reporting but is not a full accrual general ledger.</p>
          </section>
          <section class="grid">
            ${metricCard('Money In This Month', formatMoney(stage6.reportSummaries.monthly.moneyIn))}
            ${metricCard('Money Out This Month', formatMoney(stage6.reportSummaries.monthly.moneyOut))}
            ${metricCard('Money In This Year', formatMoney(stage6.reportSummaries.annual.moneyIn))}
            ${metricCard('Money Out This Year', formatMoney(stage6.reportSummaries.annual.moneyOut))}
          </section>
          ${renderReportPackWorkspace(stage6)}
          <section class="panel" id="reportControls">
            <h3>Generate Financial Statement</h3>
            <form id="reportForm" class="form-grid">
              ${selectField('Report type', 'Report Type', [
                { value: 'Complete Financial Statements', label: 'Complete Financial Statements' },
                { value: 'Statement of Financial Activities', label: 'Statement of Financial Activities' },
                { value: 'Statement of Financial Position', label: 'Statement of Financial Position' },
                { value: 'Statement of Cash Flows', label: 'Statement of Cash Flows' },
                { value: 'Fund / Project Statement', label: 'Fund / Project Statement' },
                { value: 'Transaction Register', label: 'Transaction Register' }
              ])}
              ${dateInputField('Start Date', 'Start Date', yearStart)}
              ${dateInputField('End Date', 'End Date', todayDisplay())}
              <div id="reportFundField" hidden>
                ${selectField('Fund or specialized project', 'Fund ID', [{ value: '', label: 'Choose fund or project' }, { value: 'GENERAL', label: 'General / Unallocated Activity' }].concat((stage6.funds || []).map(fundOption)))}
              </div>
              <p class="muted small" style="grid-column: 1 / -1;">The Statement of Financial Position uses the End Date as its “as at” date. All reports include published transactions only.</p>
              <div class="action-row" style="grid-column: 1 / -1;">
                <button class="action" type="submit">View Report</button>
                <button class="action secondary" type="button" id="exportReportButton">Export CSV</button>
                <button class="action secondary" type="button" id="printReportButton">Print / Save as PDF</button>
                <button class="action secondary" type="button" id="copyReportSummaryButton">Copy Meeting Summary</button>
              </div>
            </form>
          </section>
          <section id="reportOutput"></section>
        `;

        const reportForm = document.getElementById('reportForm');
        const reportTypeSelect = reportForm.querySelector('[name="Report Type"]');
        function updateReportFields() {
          document.getElementById('reportFundField').hidden = reportTypeSelect.value !== 'Fund / Project Statement';
        }
        reportTypeSelect.addEventListener('change', updateReportFields);
        updateReportFields();

        reportForm.addEventListener('submit', function(event) {
          event.preventDefault();
          const values = readFormValues(event.target);
          if (values['Report Type'] === 'Fund / Project Statement' && !values['Fund ID']) {
            alert('Choose a fund or specialized project.');
            return;
          }
          showBusy('Preparing the financial statement...');
          google.script.run
            .withSuccessHandler(function(report) { hideBusy(); drawReportOutput(report); })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .getReportData(values['Report Type'], values['Start Date'], values['End Date'], values['Fund ID']);
        });

        document.getElementById('exportReportButton').addEventListener('click', function() {
          const values = readFormValues(document.getElementById('reportForm'));
          if (state.currentReport && state.currentReport.reportPack) {
            showBusy('Exporting the displayed report pack...');
            google.script.run.withSuccessHandler(function(csv) {
              hideBusy();
              downloadCsv(csv, makeReportFileName(state.currentReport.reportType + '-' + state.currentReport.reportPack.reportPackId));
              showMessage('Report-pack CSV exported.');
            }).withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); }).exportReportPackCsv(state.currentReport.reportPack.reportPackId);
            return;
          }
          if (values['Report Type'] === 'Fund / Project Statement' && !values['Fund ID']) {
            alert('Choose a fund or specialized project.');
            return;
          }
          showBusy('Preparing the CSV export...');
          google.script.run
            .withSuccessHandler(function(csv) {
              hideBusy();
              downloadCsv(csv, makeReportFileName(values['Report Type']));
              showMessage('Report CSV exported.');
            })
            .withFailureHandler(function(error) {
              hideBusy();
              alert(error.message || String(error));
            })
            .exportReportCsv(values['Report Type'], values['Start Date'], values['End Date'], values['Fund ID']);
        });

        document.getElementById('printReportButton').addEventListener('click', function() {
          if (!document.querySelector('#reportOutput .financial-report')) {
            alert('View a report first, then use Print / Save as PDF.');
            return;
          }
          window.print();
        });
        document.getElementById('copyReportSummaryButton').addEventListener('click', function() {
          if (!state.currentReport) {
            alert('View a report first, then copy its meeting summary.');
            return;
          }
          copyTextForSharing(makeReportMeetingSummary(state.currentReport));
        });
        bindReportPackControls(stage6);
      }

      function renderReportPackWorkspace(stage6) {
        const packs = stage6.reportPacks || [];
        const published = packs.filter(function(pack) { return pack.status === 'Published'; });
        const working = packs.filter(function(pack) { return pack.status !== 'Published'; });
        return `
          ${stage6.canPrepareReportPacks ? `<section class="panel" id="reportPackEditor">
            <h3>Prepare Notes and Period-End Items</h3>
            <p class="muted">Most notes are generated automatically. Use this short guided form only for information that cannot be learned from bank transactions. Leaving a box blank means “Nothing to report.”</p>
            <form id="reportPackForm" class="form-grid">
              <input type="hidden" name="Report Pack ID" value="">
              ${selectField('Report package', 'Pack Report Type', [
                { value: 'Complete Financial Statements', label: 'Complete Financial Statements' },
                { value: 'Fund / Project Statement', label: 'Fund / Project Statement' }
              ])}
              ${dateInputField('Period Start', 'Pack Period Start', isoToDisplayDate(new Date().getFullYear() + '-01-01'))}
              ${dateInputField('Period End', 'Pack Period End', todayDisplay())}
              <div id="reportPackFundField" hidden>${selectField('Fund or specialized project', 'Pack Fund ID', [{ value: '', label: 'Choose fund or project' }, { value: 'GENERAL', label: 'General / Unallocated Activity' }].concat((stage6.funds || []).map(fundOption)))}</div>
              <details style="grid-column:1/-1;" open>
                <summary><strong>Guided notes for members</strong></summary>
                <div class="form-grid" style="margin-top:12px;">
                  <div style="grid-column:1/-1;">${textAreaField('Main activities or achievements during the period', 'Period Highlights', '')}</div>
                  <div style="grid-column:1/-1;">${textAreaField('Significant or unusual income and spending', 'Significant Items', '')}</div>
                  <div style="grid-column:1/-1;">${textAreaField('Important events after the reporting date', 'Subsequent Events', '')}</div>
                  <div style="grid-column:1/-1;">${textAreaField('Anything else members should know', 'Other Information', '')}</div>
                  <label class="check-item" style="grid-column:1/-1;"><input type="checkbox" name="Include Transaction Explanations" value="Yes"><span>Include bank-row member explanations in this report. Preview carefully because older notes may contain internal wording.</span></label>
                </div>
              </details>
              <details style="grid-column:1/-1;">
                <summary><strong>Period-end items (optional)</strong></summary>
                <p class="muted small" style="margin-top:8px;">Enter only amounts that exist at the End Date. These are non-cash reporting adjustments and require Publisher approval.</p>
                <div class="request-list">
                  ${renderReportAdjustmentInput('Income Earned but Not Received', 'Money owed to NACO\'94 for income already earned')}
                  ${renderReportAdjustmentInput('Expense Incurred but Not Paid', 'Bills or expenses NACO\'94 owes but has not paid')}
                  ${renderReportAdjustmentInput('Income Received in Advance', 'Money received now for a future period or event')}
                  ${renderReportAdjustmentInput('Expense Paid in Advance', 'Payments made now for a future period')}
                </div>
              </details>
              <div class="action-row" style="grid-column:1/-1;">
                <button class="action secondary" type="submit">Save Draft</button>
                <button class="action" type="button" id="sendReportPackButton">Send to Publisher</button>
                <button class="action secondary" type="button" id="clearReportPackButton">Start New</button>
              </div>
            </form>
          </section>` : ''}
          ${working.length ? `<section class="panel"><h3>Report Packs in Progress</h3><div class="request-list">${working.map(function(pack) { return renderReportPackCard(pack, stage6); }).join('')}</div></section>` : ''}
          <section class="panel">
            <h3>Published Report Archive</h3>
            <p class="muted">These reports are frozen Publisher-approved snapshots. Later corrections create a new report version instead of silently changing this one.</p>
            <div class="request-list">${published.length ? published.map(function(pack) { return renderReportPackCard(pack, stage6); }).join('') : '<p class="muted">No report pack has been published yet.</p>'}</div>
          </section>
        `;
      }

      function renderReportAdjustmentInput(type, helpText) {
        return `<div class="request-card" data-report-adjustment="${escapeAttr(type)}"><strong>${escapeHtml(type)}</strong><p class="small muted">${escapeHtml(helpText)}</p><div class="form-grid"><div><label>Amount</label><input name="Adjustment Amount" inputmode="decimal" placeholder="0.00"></div><div><label>Short explanation or classification</label><input name="Adjustment Description" placeholder="Nothing to report"></div></div></div>`;
      }

      function renderReportPackCard(pack, stage6) {
        const roles = state.bootstrap.user.roles || [];
        const isAdmin = roles.indexOf('System Administrator') !== -1;
        const isOwner = String(pack.preparedBy || '').toLowerCase() === String(state.bootstrap.user.email || '').toLowerCase();
        const canEdit = stage6.canPrepareReportPacks && (isOwner || isAdmin) && (pack.status === 'Draft' || pack.status === 'Sent Back');
        const canReview = stage6.canPublishReportPacks && pack.status === 'Ready to Publish' && !isOwner;
        return `
          <div class="request-card">
            <strong>${escapeHtml(pack.reportPackId)} · ${escapeHtml(pack.reportType)}</strong>
            <p class="small">${escapeHtml(pack.periodStart)} to ${escapeHtml(pack.periodEnd)}${pack.fundId ? ' · Fund ' + escapeHtml(pack.fundId) : ''}</p>
            <p><span class="badge ${pack.status === 'Published' ? 'ok' : (pack.status === 'Sent Back' ? 'warn' : '')}">${escapeHtml(pack.status)}</span></p>
            <p class="small muted">Prepared by ${escapeHtml(pack.preparedBy)}${pack.reviewedBy ? ' · Reviewed by ' + escapeHtml(pack.reviewedBy) : ''}</p>
            ${pack.publisherNote ? `<p class="message small"><strong>Publisher note:</strong> ${escapeHtml(pack.publisherNote)}</p>` : ''}
            <div class="action-row">
              ${pack.status === 'Published' ? `<button class="action secondary" type="button" data-open-published-report="${escapeAttr(pack.reportPackId)}">Open Published Report</button>` : `<button class="action secondary" type="button" data-preview-report-pack="${escapeAttr(pack.reportPackId)}">Preview</button>`}
              ${canEdit ? `<button class="action secondary" type="button" data-edit-report-pack="${escapeAttr(pack.reportPackId)}">Edit</button>` : ''}
              ${canReview ? `<button class="action" type="button" data-review-report-pack="${escapeAttr(pack.reportPackId)}" data-report-decision="Published">Publish</button><button class="action danger" type="button" data-review-report-pack="${escapeAttr(pack.reportPackId)}" data-report-decision="Sent Back">Send Back</button>` : ''}
            </div>
          </div>
        `;
      }

      function bindReportPackControls(stage6) {
        const form = document.getElementById('reportPackForm');
        if (form) {
          const typeSelect = form.querySelector('[name="Pack Report Type"]');
          const fundField = document.getElementById('reportPackFundField');
          function updateFundField() { fundField.hidden = typeSelect.value !== 'Fund / Project Statement'; }
          typeSelect.addEventListener('change', updateFundField);
          updateFundField();
          form.addEventListener('submit', function(event) { event.preventDefault(); saveReportPackFromUi(false); });
          document.getElementById('sendReportPackButton').onclick = function() { saveReportPackFromUi(true); };
          document.getElementById('clearReportPackButton').onclick = clearReportPackForm;
        }
        document.querySelectorAll('[data-edit-report-pack]').forEach(function(button) {
          button.onclick = function() {
            showBusy('Opening the guided report notes...');
            google.script.run.withSuccessHandler(function(pack) {
              hideBusy();
              populateReportPackForm(pack);
            }).withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); }).getReportPackForEditing(button.dataset.editReportPack);
          };
        });
        document.querySelectorAll('[data-preview-report-pack]').forEach(function(button) {
          button.onclick = function() { openReportPackFromServer('previewReportPack', button.dataset.previewReportPack); };
        });
        document.querySelectorAll('[data-open-published-report]').forEach(function(button) {
          button.onclick = function() { openReportPackFromServer('getPublishedReportPack', button.dataset.openPublishedReport); };
        });
        document.querySelectorAll('[data-review-report-pack]').forEach(function(button) {
          button.onclick = function() {
            const decision = button.dataset.reportDecision;
            const note = prompt(decision === 'Published' ? 'Optional Publisher note' : 'Explain what needs to be changed', '') || '';
            if (decision === 'Sent Back' && !note.trim()) {
              alert('Enter a short reason before sending the report back.');
              return;
            }
            if (!confirm(decision === 'Published' ? 'Publish and freeze this report pack for members?' : 'Send this report pack back to the Finance Officer?')) { return; }
            showBusy(decision === 'Published' ? 'Publishing the report pack...' : 'Sending the report pack back...');
            google.script.run.withSuccessHandler(function() { hideBusy(); showMessage('Report pack ' + decision.toLowerCase() + '.'); renderReports(); }).withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); }).reviewReportPack(button.dataset.reviewReportPack, decision, note);
          };
        });
      }

      function readReportPackForm() {
        const form = document.getElementById('reportPackForm');
        const values = readFormValues(form);
        return {
          reportPackId: values['Report Pack ID'],
          reportType: values['Pack Report Type'],
          periodStart: values['Pack Period Start'],
          periodEnd: values['Pack Period End'],
          fundId: values['Pack Fund ID'],
          narrative: {
            periodHighlights: values['Period Highlights'],
            significantItems: values['Significant Items'],
            subsequentEvents: values['Subsequent Events'],
            otherInformation: values['Other Information'],
            includeTransactionExplanations: Boolean(form.querySelector('[name="Include Transaction Explanations"]').checked)
          },
          adjustments: Array.prototype.map.call(form.querySelectorAll('[data-report-adjustment]'), function(card) {
            return { type: card.dataset.reportAdjustment, amount: card.querySelector('[name="Adjustment Amount"]').value, description: card.querySelector('[name="Adjustment Description"]').value };
          })
        };
      }

      function saveReportPackFromUi(submitForPublishing) {
        const payload = readReportPackForm();
        if (payload.reportType === 'Fund / Project Statement' && !payload.fundId) {
          alert('Choose a fund or project.');
          return;
        }
        payload.submitForPublishing = submitForPublishing;
        if (submitForPublishing && !confirm('Send this report pack to a separate Publisher for checking?')) { return; }
        showBusy(submitForPublishing ? 'Sending the report pack to the Publisher...' : 'Saving the report pack draft...');
        google.script.run.withSuccessHandler(function(result) {
          hideBusy();
          showMessage('Report pack ' + result.reportPackId + ' saved as ' + result.status + '.');
          renderReports();
        }).withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); }).saveReportPack(payload);
      }

      function populateReportPackForm(pack) {
        const form = document.getElementById('reportPackForm');
        if (!form) { return; }
        form.querySelector('[name="Report Pack ID"]').value = pack.reportPackId;
        form.querySelector('[name="Pack Report Type"]').value = pack.reportType;
        form.querySelector('[name="Pack Period Start"]').value = isoToDisplayDate(pack.periodStartIso);
        form.querySelector('[name="Pack Period End"]').value = isoToDisplayDate(pack.periodEndIso);
        form.querySelector('[name="Pack Fund ID"]').value = pack.fundId || '';
        form.querySelector('[name="Period Highlights"]').value = pack.narrative.periodHighlights || '';
        form.querySelector('[name="Significant Items"]').value = pack.narrative.significantItems || '';
        form.querySelector('[name="Subsequent Events"]').value = pack.narrative.subsequentEvents || '';
        form.querySelector('[name="Other Information"]').value = pack.narrative.otherInformation || '';
        form.querySelector('[name="Include Transaction Explanations"]').checked = Boolean(pack.narrative.includeTransactionExplanations);
        form.querySelectorAll('[data-report-adjustment]').forEach(function(card) {
          const item = (pack.adjustments || []).filter(function(adjustment) { return adjustment.type === card.dataset.reportAdjustment; })[0] || {};
          card.querySelector('[name="Adjustment Amount"]').value = item.amount || '';
          card.querySelector('[name="Adjustment Description"]').value = item.description || '';
        });
        form.querySelector('[name="Pack Report Type"]').dispatchEvent(new Event('change'));
        document.getElementById('reportPackEditor').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function clearReportPackForm() {
        const form = document.getElementById('reportPackForm');
        form.reset();
        form.querySelector('[name="Report Pack ID"]').value = '';
        form.querySelector('[name="Pack Report Type"]').dispatchEvent(new Event('change'));
      }

      function openReportPackFromServer(functionName, reportPackId) {
        showBusy('Opening the report pack...');
        const runner = google.script.run.withSuccessHandler(function(report) {
          hideBusy();
          drawReportOutput(report);
          document.getElementById('reportOutput').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }).withFailureHandler(function(error) { hideBusy(); alert(error.message || String(error)); });
        if (functionName === 'getPublishedReportPack') {
          runner.getPublishedReportPack(reportPackId);
        } else {
          runner.previewReportPack(reportPackId);
        }
      }

      function drawReportOutput(report) {
        state.currentReport = report;
        if (report.reportType === 'Complete Financial Statements') {
          drawCompleteFinancialStatements(report);
          return;
        }
        if (report.reportType === 'Statement of Financial Activities' || report.reportType === 'Income and Expenditure Statement' || report.reportType === 'Receipts and Payments Statement') {
          document.getElementById('reportOutput').innerHTML = `<div class="financial-report">${renderActivitiesStatement(report)}</div>`;
          return;
        }
        if (report.reportType === 'Statement of Financial Position' || report.reportType === 'Statement of Funds Available') {
          document.getElementById('reportOutput').innerHTML = `<div class="financial-report">${renderFinancialPositionStatement(report)}</div>`;
          return;
        }
        if (report.reportType === 'Statement of Cash Flows') {
          document.getElementById('reportOutput').innerHTML = `<div class="financial-report">${renderCashFlowStatement(report)}</div>`;
          return;
        }
        if (report.reportType === 'Fund / Project Statement') {
          document.getElementById('reportOutput').innerHTML = `<div class="financial-report">${renderFundProjectStatement(report)}</div>`;
          return;
        }

        document.getElementById('reportOutput').innerHTML = `
          <div class="financial-report">
          <section class="panel financial-statement">
            ${renderFinancialReportHeading(report)}
            <div class="grid">
              ${metricCard('Money In', formatMoney(report.summary.moneyIn))}
              ${metricCard('Money Out', formatMoney(report.summary.moneyOut))}
              ${metricCard('Net Movement', formatMoney(report.summary.netMovement))}
              ${metricCard('Records', report.summary.count)}
            </div>
            ${renderTransactionTable(report.transactions, false)}
          </section>
          ${renderReportNotes(report.notes)}
          </div>
        `;
      }

      function drawCompleteFinancialStatements(report) {
        document.getElementById('reportOutput').innerHTML = `
          <div class="financial-report">
            <section class="panel financial-report-cover">
              <h2>NACO'94 Alumni Association</h2>
              <h3>Complete Financial Statements</h3>
              <p>${escapeHtml(report.periodLabel)}</p>
              <p class="muted small">Generated ${escapeHtml(formatShortDateTime(report.generatedAt))} from published NACO'94 Open Ledger records</p>
              ${report.reportPack ? `<p><span class="badge ${report.reportPack.status === 'Published' ? 'ok' : 'warn'}">${escapeHtml(report.reportPack.reportPackId)} · ${escapeHtml(report.reportPack.status)}</span></p>` : ''}
            </section>
            ${renderActivitiesStatement(report.activities)}
            ${renderFinancialPositionStatement(report.position)}
            ${renderCashFlowStatement(report.cashFlow)}
          </div>
        `;
      }

      function renderFinancialReportHeading(report) {
        return `
          <div class="financial-report-cover">
            <h2>NACO'94 Alumni Association</h2>
            <h3>${escapeHtml(report.reportType)}</h3>
            <p>${escapeHtml(report.periodLabel)}</p>
            <p class="muted small">Generated ${escapeHtml(formatShortDateTime(report.generatedAt))} · Published records only</p>
            ${report.reportPack ? `<p><span class="badge ${report.reportPack.status === 'Published' ? 'ok' : 'warn'}">${escapeHtml(report.reportPack.reportPackId)} · ${escapeHtml(report.reportPack.status)}</span></p>` : ''}
          </div>
        `;
      }

      function renderActivitiesStatement(report) {
        return `
          <section class="panel financial-statement">
            ${renderFinancialReportHeading(report)}
            <div class="table-wrap"><table>
              <thead><tr><th>Description</th><th>Note</th><th>Amount</th></tr></thead>
              <tbody>
                <tr class="statement-section-row"><td colspan="3">Income</td></tr>
                ${renderStatementAmountRows(report.incomeRows, 3)}
                <tr class="statement-subtotal-row"><td>Total Income</td><td>3</td><td>${formatStatementMoney(report.summary.totalIncome)}</td></tr>
                <tr class="statement-section-row"><td colspan="3">Expenditure</td></tr>
                ${renderStatementAmountRows(report.expenditureRows, 4)}
                <tr class="statement-subtotal-row"><td>Total Expenditure</td><td>4</td><td>${formatStatementMoney(report.summary.totalExpenditure)}</td></tr>
                <tr class="statement-total-row"><td>Surplus / (Deficit) for the Period</td><td></td><td>${formatStatementMoney(report.summary.surplusDeficit)}</td></tr>
              </tbody>
            </table></div>
          </section>
          ${renderReportNotes(report.notes)}
        `;
      }

      function renderFinancialPositionStatement(report) {
        const fundsDifference = Number(report.summary.netAssets || 0) - Number(report.summary.representedFundsTotal || 0);
        return `
          <section class="panel financial-statement">
            ${renderFinancialReportHeading(report)}
            ${report.currencyWarning ? `<p class="message">${escapeHtml(report.currencyWarning)}</p>` : ''}
            <div class="table-wrap"><table>
              <thead><tr><th>Description</th><th>Note</th><th>Amount</th></tr></thead>
              <tbody>
                <tr class="statement-section-row"><td colspan="3">Assets</td></tr>
                ${renderStatementAmountRows(report.accountRows, 2)}
                <tr><td>Receivables / Debtors</td><td>3</td><td>${formatStatementMoney(report.summary.receivables)}</td></tr>
                <tr><td>Other Assets</td><td>3</td><td>${formatStatementMoney(report.summary.otherAssets)}</td></tr>
                <tr class="statement-total-row"><td>Total Assets</td><td></td><td>${formatStatementMoney(report.summary.totalAssets)}</td></tr>
                <tr class="statement-section-row"><td colspan="3">Liabilities</td></tr>
                <tr><td>Payables / Creditors</td><td>4</td><td>${formatStatementMoney(report.summary.payables)}</td></tr>
                <tr><td>Deferred Income</td><td>4</td><td>${formatStatementMoney(report.summary.deferredIncome)}</td></tr>
                <tr><td>Other Liabilities</td><td>4</td><td>${formatStatementMoney(report.summary.otherLiabilities)}</td></tr>
                <tr class="statement-subtotal-row"><td>Total Liabilities</td><td></td><td>${formatStatementMoney(report.summary.totalLiabilities)}</td></tr>
                <tr class="statement-total-row"><td>Net Assets</td><td></td><td>${formatStatementMoney(report.summary.netAssets)}</td></tr>
                <tr class="statement-section-row"><td colspan="3">Accumulated and Project Funds</td></tr>
                ${renderStatementAmountRows(report.fundRows, 5)}
                <tr class="statement-total-row"><td>Total Accumulated and Project Funds</td><td></td><td>${formatStatementMoney(report.summary.representedFundsTotal)}</td></tr>
              </tbody>
            </table></div>
            ${Math.abs(fundsDifference) > 0.01 ? `<p class="message error"><strong>Balance check:</strong> funds differ from net assets by ${escapeHtml(formatStatementMoney(fundsDifference))}. Ask the Finance Officer to review fund assignments and opening balances before publishing this statement.</p>` : '<p class="small muted">Balance check passed: accumulated and project funds equal net assets.</p>'}
          </section>
          ${renderReportNotes(report.notes)}
        `;
      }

      function renderCashFlowStatement(report) {
        return `
          <section class="panel financial-statement">
            ${renderFinancialReportHeading(report)}
            <div class="table-wrap"><table>
              <thead><tr><th>Description</th><th>Note</th><th>Amount</th></tr></thead>
              <tbody>
                <tr class="statement-section-row"><td colspan="3">Cash Flows from Operating Activities</td></tr>
                <tr><td>Cash receipts</td><td>2</td><td>${formatStatementMoney(report.summary.cashReceipts)}</td></tr>
                <tr><td>Cash payments</td><td>3</td><td>${formatStatementMoney(-Number(report.summary.cashPayments || 0))}</td></tr>
                <tr class="statement-subtotal-row"><td>Net Cash from Operating Activities</td><td></td><td>${formatStatementMoney(report.summary.netOperatingCashFlow)}</td></tr>
                <tr><td>Net Cash from Investing Activities</td><td>4</td><td>${formatStatementMoney(report.summary.netInvestingCashFlow)}</td></tr>
                <tr><td>Net Cash from Financing Activities</td><td>4</td><td>${formatStatementMoney(report.summary.netFinancingCashFlow)}</td></tr>
                <tr class="statement-subtotal-row"><td>Net Increase / (Decrease) in Cash</td><td></td><td>${formatStatementMoney(report.summary.netIncreaseInCash)}</td></tr>
                <tr><td>Cash and Cash Equivalents at Start</td><td></td><td>${formatStatementMoney(report.summary.openingCash)}</td></tr>
                <tr class="statement-total-row"><td>Cash and Cash Equivalents at End</td><td></td><td>${formatStatementMoney(report.summary.closingCash)}</td></tr>
              </tbody>
            </table></div>
            ${Math.abs(Number(report.summary.reconciliationDifference || 0)) > 0.01 ? `<p class="message"><strong>Cash-flow reconciliation difference:</strong> ${escapeHtml(formatStatementMoney(report.summary.reconciliationDifference))}. This may reflect opening-balance or currency differences.</p>` : '<p class="small muted">Cash-flow reconciliation passed.</p>'}
          </section>
          ${renderReportNotes(report.notes)}
        `;
      }

      function renderFundProjectStatement(report) {
        return `
          <section class="panel financial-statement">
            ${renderFinancialReportHeading(report)}
            <p class="report-disclosure"><strong>${escapeHtml(report.fund.name)}</strong><br><span class="small">${escapeHtml(report.fund.type)}</span></p>
            <div class="table-wrap"><table>
              <thead><tr><th>Description</th><th>Note</th><th>Amount</th></tr></thead>
              <tbody>
                <tr><td>Opening Fund Balance</td><td></td><td>${formatStatementMoney(report.summary.openingBalance)}</td></tr>
                <tr class="statement-section-row"><td colspan="3">Income / Receipts</td></tr>
                ${renderStatementAmountRows(report.incomeRows, 3)}
                <tr class="statement-subtotal-row"><td>Total Income / Receipts</td><td></td><td>${formatStatementMoney(report.summary.totalIncome)}</td></tr>
                <tr class="statement-section-row"><td colspan="3">Expenditure / Payments</td></tr>
                ${renderStatementAmountRows(report.expenditureRows, 4)}
                <tr class="statement-subtotal-row"><td>Total Expenditure / Payments</td><td></td><td>${formatStatementMoney(report.summary.totalExpenditure)}</td></tr>
                <tr><td>Surplus / (Deficit) for the Period</td><td></td><td>${formatStatementMoney(report.summary.surplusDeficit)}</td></tr>
                <tr class="statement-total-row"><td>Closing Fund Balance</td><td></td><td>${formatStatementMoney(report.summary.closingBalance)}</td></tr>
              </tbody>
            </table></div>
          </section>
          <section class="panel financial-statement">
            <h3>Published Project Transaction Detail</h3>
            ${renderProjectTransactionRows(report.transactions)}
          </section>
          ${renderReportNotes(report.notes)}
        `;
      }

      function renderStatementAmountRows(rows, noteNumber) {
        if (!rows || !rows.length) {
          return `<tr><td class="muted">No published records</td><td>${escapeHtml(noteNumber || '')}</td><td>${formatStatementMoney(0)}</td></tr>`;
        }
        return rows.map(function(row) {
          return `<tr><td>${escapeHtml(row.name)}${row.currency ? `<br><span class="small muted">${escapeHtml(row.currency)}</span>` : ''}</td><td>${escapeHtml(noteNumber || '')}</td><td>${formatStatementMoney(row.amount)}</td></tr>`;
        }).join('');
      }

      function renderReportNotes(notes) {
        if (!notes || !notes.length) { return ''; }
        return `
          <section class="panel financial-statement">
            <h3>Notes to the Financial Statements</h3>
            ${notes.map(function(note) {
              return `<article class="report-note"><h4>Note ${escapeHtml(note.number)} · ${escapeHtml(note.title)}</h4>${(note.paragraphs || []).map(function(paragraph) { return `<p>${escapeHtml(paragraph)}</p>`; }).join('')}${note.rows && note.rows.length ? `<div class="table-wrap"><table><thead><tr><th>Detail</th><th>Amount</th></tr></thead><tbody>${note.rows.map(function(row) { return `<tr><td>${escapeHtml(row.name)}</td><td>${formatStatementMoney(row.amount)}</td></tr>`; }).join('')}</tbody></table></div>` : ''}${note.details && note.details.length ? `<details><summary><strong>View ${escapeHtml(note.details.length)} supporting transaction explanation(s)</strong></summary><div class="table-wrap"><table><thead><tr><th>Date</th><th>Classification</th><th>Description</th><th>Officer explanation</th><th>Amount</th><th>Evidence</th></tr></thead><tbody>${note.details.map(function(detail) { return `<tr><td>${escapeHtml(detail.date)}</td><td>${escapeHtml(detail.category)}</td><td>${escapeHtml(detail.description)}</td><td>${escapeHtml(detail.explanation)}</td><td>${formatStatementMoney(detail.amount)}</td><td>${escapeHtml(detail.evidenceHeld ? 'Held by Finance' : 'Not attached')}</td></tr>`; }).join('')}</tbody></table></div></details>` : ''}</article>`;
            }).join('')}
          </section>
        `;
      }

      function renderProjectTransactionRows(transactions) {
        if (!transactions || !transactions.length) {
          return '<p class="muted">No published transactions were assigned to this fund/project for the selected period.</p>';
        }
        return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Classification</th><th>Description</th><th>Amount</th></tr></thead><tbody>${transactions.map(function(transaction) {
          return `<tr><td>${escapeHtml(transaction.date)}</td><td>${escapeHtml(transaction.transactionType)}</td><td>${escapeHtml(transaction.categoryName)}</td><td>${escapeHtml(transaction.description)}</td><td>${formatStatementMoney(transaction.amount)}</td></tr>`;
        }).join('')}</tbody></table></div>`;
      }

      function formatStatementMoney(value) {
        const amount = Number(value || 0);
        const formatted = Math.abs(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return amount < 0 ? '(' + formatted + ')' : formatted;
      }

      function makeReportMeetingSummary(report) {
        const lines = ["NACO'94 " + report.reportType, report.periodLabel];
        if (report.reportType === 'Complete Financial Statements') {
          lines.push('Income: ' + formatStatementMoney(report.activities.summary.totalIncome));
          lines.push('Expenditure: ' + formatStatementMoney(report.activities.summary.totalExpenditure));
          lines.push('Surplus/(Deficit): ' + formatStatementMoney(report.activities.summary.surplusDeficit));
          lines.push('Net Assets: ' + formatStatementMoney(report.position.summary.netAssets));
          lines.push('Closing Cash: ' + formatStatementMoney(report.cashFlow.summary.closingCash));
        } else if (report.reportType === 'Fund / Project Statement') {
          lines.push('Project: ' + report.fund.name);
          lines.push('Income: ' + formatStatementMoney(report.summary.totalIncome));
          lines.push('Expenditure: ' + formatStatementMoney(report.summary.totalExpenditure));
          lines.push('Closing Balance: ' + formatStatementMoney(report.summary.closingBalance));
        } else if (report.summary) {
          Object.keys(report.summary).slice(0, 5).forEach(function(key) { lines.push(key + ': ' + formatStatementMoney(report.summary[key])); });
        }
        if (report.reportPack) { lines.push('Report pack: ' + report.reportPack.reportPackId + ' (' + report.reportPack.status + ')'); }
        lines.push('Generated from published NACO\'94 Open Ledger records.');
        return lines.join('\n');
      }

      function copyTextForSharing(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() { showMessage('Meeting summary copied.'); }).catch(function() { prompt('Copy this summary:', text); });
          return;
        }
        prompt('Copy this summary:', text);
      }

      function downloadCsv(csv, fileName) {
        const blob = new Blob([csv || ''], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function makeReportFileName(reportType) {
        const safeName = String(reportType || 'report')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'report';
        return `naco-94-${safeName}-${todayIso()}.csv`;
      }

      function drawMembers(directory) {
        const canAdminMembers = state.bootstrap.user.roles.includes('Membership Administrator') || state.bootstrap.user.roles.includes('System Administrator');
        const adminPanel = canAdminMembers ? renderMembershipAdminPanel() : '';
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Members</h2>
            <p class="muted">The directory only shows details each member has agreed to share.</p>
          </section>
          <section class="directory-list">
            ${directory.length ? directory.map(renderDirectoryCard).join('') : '<div class="panel">No members are visible in the directory yet.</div>'}
          </section>
          ${adminPanel}
        `;

        if (canAdminMembers) {
          document.getElementById('addMemberForm').addEventListener('submit', submitAddMember);
          loadPendingRequests();
        }
      }

      function renderMembershipAdminPanel() {
        return `
          <section class="panel">
            <h3>Add Member</h3>
            <form id="addMemberForm" class="form-grid">
              ${inputField('Full Name', 'Full Name', '')}
              ${inputField('Preferred Name', 'Preferred Name', '')}
              ${inputField('Email Address', 'Email Address', '')}
              ${birthdayField('Birthday Day/Month', 'Date of Birth', '')}
              ${inputField('Phone Number', 'Phone Number', '')}
              ${inputField('City', 'City', '')}
              ${inputField('State', 'State', '')}
              ${inputField('Country', 'Country', 'Nigeria')}
              ${inputField('Occupation', 'Occupation', '')}
              <div style="grid-column: 1 / -1;">
                <button class="action" type="submit">Add Member</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <h3>Profile Update Requests</h3>
            <div id="pendingRequests" class="request-list">
              <p class="muted">Loading requests...</p>
            </div>
          </section>
        `;
      }

      function renderDirectoryCard(member) {
        return `
          <article class="directory-card">
            <div class="directory-name">${escapeHtml(member.name || 'Name hidden')}</div>
            ${member.cityCountry ? `<div>${escapeHtml(member.cityCountry)}</div>` : ''}
            ${member.occupation ? `<div>${escapeHtml(member.occupation)}</div>` : ''}
            ${member.phoneNumber ? `<div class="small">Phone: ${escapeHtml(member.phoneNumber)}</div>` : ''}
            ${member.emailAddress ? `<div class="small">Email: ${escapeHtml(member.emailAddress)}</div>` : ''}
          </article>
        `;
      }

      function loadPendingRequests() {
        google.script.run
          .withSuccessHandler(function(requests) {
            state.pendingRequests = requests;
            document.getElementById('pendingRequests').innerHTML = requests.length
              ? requests.map(renderRequestCard).join('')
              : '<p class="muted">No pending profile update requests.</p>';
            document.querySelectorAll('[data-review-request]').forEach(function(button) {
              button.addEventListener('click', reviewRequest);
            });
          })
          .withFailureHandler(function(error) {
            document.getElementById('pendingRequests').innerHTML = `<p class="muted">${escapeHtml(error.message || String(error))}</p>`;
          })
          .getPendingMemberUpdateRequests();
      }

      function renderRequestCard(request) {
        return `
          <article class="request-card">
            <div><strong>${escapeHtml(request.memberId)}</strong></div>
            <div class="small">Requested by ${escapeHtml(request.requestedByEmail)}</div>
            <pre class="small">${escapeHtml(JSON.stringify(request.requestedChanges, null, 2))}</pre>
            <div class="action-row">
              <button class="action" type="button" data-review-request="${escapeHtml(request.requestId)}" data-decision="Approved">Approve</button>
              <button class="action danger" type="button" data-review-request="${escapeHtml(request.requestId)}" data-decision="Rejected">Reject</button>
            </div>
          </article>
        `;
      }

      function submitProfileUpdate(event) {
        event.preventDefault();
        const changes = readFormValues(event.target);
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            renderMyProfile();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .requestMyProfileUpdate(changes);
      }

      function submitPrivacySettings(event) {
        event.preventDefault();
        const settings = {};
        event.target.querySelectorAll('input[type="checkbox"]').forEach(function(input) {
          settings[input.name] = input.checked ? 'Yes' : 'No';
        });
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            renderMyProfile();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .updateMyPrivacySettings(settings);
      }

      function submitAddMember(event) {
        event.preventDefault();
        const record = readFormValues(event.target);
        google.script.run
          .withSuccessHandler(function(result) {
            alert('Member added: ' + result.memberId);
            renderMembers();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .addMember(record);
      }

      function reviewRequest(event) {
        const requestId = event.target.dataset.reviewRequest;
        const decision = event.target.dataset.decision;
        if (!confirm(decision + ' this profile update request?')) {
          return;
        }
        google.script.run
          .withSuccessHandler(function() {
            loadPendingRequests();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .reviewMemberUpdateRequest(requestId, decision);
      }

      function readFormValues(form) {
        const values = {};
        form.querySelectorAll('input, textarea, select').forEach(function(input) {
          values[input.name] = input.value;
        });
        return values;
      }

      function profileLine(label, value) {
        return `
          <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value" style="font-size: 17px;">${escapeHtml(value || '--')}</div>
          </div>
        `;
      }

      function inputField(label, name, value, type) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input type="${escapeAttr(type || 'text')}" id="${escapeAttr(name)}" name="${escapeAttr(name)}" value="${escapeAttr(value)}">
          </div>
        `;
      }

      function dateInputField(label, name, value) {
        const id = escapeAttr(name);
        return `
          <div>
            <label for="${id}">${escapeHtml(label)}</label>
            <input id="${id}" name="${id}" value="${escapeAttr(value)}" placeholder="dd-mm-yyyy" inputmode="numeric" pattern="\\d{1,2}-\\d{1,2}-\\d{4}">
            <input type="date" data-calendar-for="${id}" aria-label="${escapeAttr(label)} calendar">
            <p class="muted small">Enter as dd-mm-yyyy or choose from the calendar.</p>
          </div>
        `;
      }

      function selectField(label, name, options) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <select id="${escapeAttr(name)}" name="${escapeAttr(name)}">
              ${options.map(function(option) {
                return `<option value="${escapeAttr(option.value)}" ${option.selected ? 'selected' : ''}>${escapeHtml(option.label)}</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }

      function fileField(label, name, accept, helpText) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input type="file" id="${escapeAttr(name)}" name="${escapeAttr(name)}" accept="${escapeAttr(accept || 'application/pdf,image/jpeg,image/png')}">
            <p class="muted small">${escapeHtml(helpText || 'Optional. PDF, JPG, or PNG up to 5 MB.')}</p>
          </div>
        `;
      }

      function birthdayField(label, name, value) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input id="${escapeAttr(name)}" name="${escapeAttr(name)}" value="${escapeAttr(value)}" inputmode="numeric" placeholder="DD/MM">
            <p class="muted small">Use day and month only, for example 14/08. Do not enter the year.</p>
          </div>
        `;
      }

      function textAreaField(label, name, value) {
        return `
          <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
          <textarea id="${escapeAttr(name)}" name="${escapeAttr(name)}">${escapeHtml(value)}</textarea>
        `;
      }

      function privacyCheck(name, label, value) {
        return `
          <label class="check-item">
            <input type="checkbox" name="${escapeAttr(name)}" ${value === 'Yes' ? 'checked' : ''}>
            <span>${escapeHtml(label)}</span>
          </label>
        `;
      }

      function renderPendingRequests(requests) {
        if (!requests || !requests.length) {
          return '';
        }

        return `
          <section class="panel">
            <h3>Pending Requests</h3>
            <p class="muted">Your request is waiting for review by the Membership Administrator.</p>
            <div class="request-list">
              ${requests.map(function(request) {
                return `<div class="request-card"><strong>${escapeHtml(request.requestId)}</strong><pre class="small">${escapeHtml(JSON.stringify(request.requestedChanges, null, 2))}</pre></div>`;
              }).join('')}
            </div>
          </section>
        `;
      }

      function renderInlineError(title, message) {
        document.getElementById('app').innerHTML = `
          <section class="panel message error">
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      function renderError(message) {
        document.getElementById('statusBar').innerHTML = '<span class="badge warn">Error</span>';
        document.getElementById('app').innerHTML = `
          <section class="panel message error">
            <h2>Something went wrong</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function metricCard(label, value) {
        return `
          <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value">${escapeHtml(value)}</div>
          </div>
        `;
      }

      function accountOption(account) {
        return { value: account.accountId, label: account.accountName + ' - ' + account.accountType };
      }

      function categoryOption(category) {
        return { value: category.categoryId, label: category.categoryName };
      }

      function fundOption(fund) {
        return { value: fund.fundId, label: fund.fundName };
      }

      function formatMoney(value) {
        const number = Number(value || 0);
        return number.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function todayIso() {
        return new Date().toISOString().slice(0, 10);
      }

      function todayDisplay() {
        return isoToDisplayDate(todayIso());
      }

      function isoToDisplayDate(value) {
        const parts = String(value || '').split('-');
        if (parts.length !== 3) {
          return value || '';
        }
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }

      function displayToIsoDate(value) {
        const parts = String(value || '').split('-');
        if (parts.length !== 3) {
          return '';
        }
        return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }

      function formatShortDateTime(value) {
        if (!value) {
          return '--';
        }
        return String(value).slice(0, 16).replace('T', ' ');
      }

      function readFileAsBase64(file, callback) {
        if (file.size > 10 * 1024 * 1024) {
          alert('File is too large. Maximum size is 10 MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function() {
          callback(String(reader.result).split(',')[1]);
        };
        reader.readAsDataURL(file);
      }

      loadApp();
    </script>
  </body>
</html>
