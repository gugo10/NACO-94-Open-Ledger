              ${profileLine('Preferred Name', profile.preferredName)}
              ${profileLine('Phone Number', profile.phoneNumber)}
              ${profileLine('Email Address', profile.emailAddress)}
              ${profileLine('Birthday Day/Month', profile.dateOfBirth)}
              ${profileLine('City', profile.city)}
              ${profileLine('Country', profile.country)}
              ${profileLine('Occupation', profile.occupation)}
              ${profileLine('Membership Status', profile.membershipStatus)}
            </div>
          </section>

          <section class="panel">
            <h3>Request an Update</h3>
            <form id="profileUpdateForm" class="form-grid">
              ${inputField('Preferred Name', 'Preferred Name', profile.preferredName)}
              ${inputField('Phone Number', 'Phone Number', profile.phoneNumber)}
              ${inputField('Email Address', 'Email Address', profile.emailAddress)}
              ${birthdayField('Birthday Day/Month', 'Date of Birth', profile.dateOfBirth)}
              ${inputField('City', 'City', profile.city)}
              ${inputField('State', 'State', profile.state)}
              ${inputField('Country', 'Country', profile.country)}
              ${inputField('Occupation', 'Occupation', profile.occupation)}
              ${inputField('Employer or Business', 'Employer or Business', profile.employerOrBusiness)}
              <div style="grid-column: 1 / -1;">
                ${textAreaField('Residential Address', 'Residential Address', profile.residentialAddress)}
              </div>
              <div style="grid-column: 1 / -1;">
                <button class="action" type="submit">Send Update Request</button>
              </div>
            </form>
          </section>

          <section class="panel">
            <h3>Directory Privacy</h3>
            <p class="muted">Choose what other members can see in the member directory.</p>
            <form id="privacyForm" class="check-list">
              ${privacyCheck('Show Name', 'Show my name', data.privacy['Show Name'])}
              ${privacyCheck('Show City Country', 'Show my city and country', data.privacy['Show City Country'])}
              ${privacyCheck('Show Occupation', 'Show my occupation', data.privacy['Show Occupation'])}
              ${privacyCheck('Show Phone', 'Show my phone number', data.privacy['Show Phone'])}
              ${privacyCheck('Show Email', 'Show my email address', data.privacy['Show Email'])}
              ${privacyCheck('Show Photo', 'Show my profile photo', data.privacy['Show Photo'])}
              <button class="action" type="submit">Save Privacy Settings</button>
            </form>
          </section>

          ${renderPendingRequests(data.pendingRequests)}
        `;

        document.getElementById('profileUpdateForm').addEventListener('submit', submitProfileUpdate);
        document.getElementById('privacyForm').addEventListener('submit', submitPrivacySettings);
      }

      function renderMembers() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Members</h2>
            <p class="muted">Loading the member directory...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(directory) {
            state.directory = directory;
            drawMembers(directory);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Members', error.message || String(error));
          })
          .getMemberDirectory();
      }

      function renderReports() {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Reports</h2>
            <p class="muted">Loading reports...</p>
          </section>
        `;

        google.script.run
          .withSuccessHandler(function(stage6) {
            drawReports(stage6);
          })
          .withFailureHandler(function(error) {
            renderInlineError('Reports', error.message || String(error));
          })
          .getStage6Data();
      }

      function drawReports(stage6) {
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Reports</h2>
            <p class="muted">Simple financial summaries for meetings, email, and WhatsApp sharing.</p>
          </section>
          <section class="grid">
            ${metricCard('Money In This Month', formatMoney(stage6.reportSummaries.monthly.moneyIn))}
            ${metricCard('Money Out This Month', formatMoney(stage6.reportSummaries.monthly.moneyOut))}
            ${metricCard('Money In This Year', formatMoney(stage6.reportSummaries.annual.moneyIn))}
            ${metricCard('Money Out This Year', formatMoney(stage6.reportSummaries.annual.moneyOut))}
          </section>
          <section class="panel">
            <h3>Generate Report</h3>
            <form id="reportForm" class="form-grid">
              ${selectField('Report type', 'Report Type', [
                { value: 'Receipts and Payments Statement', label: 'Receipts and Payments Statement' },
                { value: 'Statement of Funds Available', label: 'Statement of Funds Available' },
                { value: 'Monthly Financial Summary', label: 'Monthly Financial Summary' },
                { value: 'Quarterly Financial Summary', label: 'Quarterly Financial Summary' },
                { value: 'Annual Financial Summary', label: 'Annual Financial Summary' },
                { value: 'Transaction Register', label: 'Transaction Register' }
              ])}
              ${dateInputField('Start Date', 'Start Date', todayDisplay())}
              ${dateInputField('End Date', 'End Date', todayDisplay())}
              <p class="muted small" style="grid-column: 1 / -1;">For Statement of Funds Available, use End Date as the "as at" date.</p>
              <div class="action-row" style="grid-column: 1 / -1;">
                <button class="action" type="submit">View Report</button>
                <button class="action secondary" type="button" id="exportReportButton">Export CSV</button>
              </div>
            </form>
          </section>
          <section id="reportOutput"></section>
        `;

        document.getElementById('reportForm').addEventListener('submit', function(event) {
          event.preventDefault();
          const values = readFormValues(event.target);
          google.script.run
            .withSuccessHandler(drawReportOutput)
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .getReportData(values['Report Type'], values['Start Date'], values['End Date']);
        });

        document.getElementById('exportReportButton').addEventListener('click', function() {
          const values = readFormValues(document.getElementById('reportForm'));
          google.script.run
            .withSuccessHandler(function(csv) {
              downloadCsv(csv, makeReportFileName(values['Report Type']));
              showMessage('Report CSV exported.');
            })
            .withFailureHandler(function(error) {
              alert(error.message || String(error));
            })
            .exportReportCsv(values['Report Type'], values['Start Date'], values['End Date']);
        });
      }

      function drawReportOutput(report) {
        if (report.reportType === 'Income and Expenditure Statement' || report.reportType === 'Receipts and Payments Statement') {
          drawIncomeExpenditureOutput(report);
          return;
        }
        if (report.reportType === 'Statement of Financial Position' || report.reportType === 'Statement of Funds Available') {
          drawFinancialPositionOutput(report);
          return;
        }

        document.getElementById('reportOutput').innerHTML = `
          <section class="panel">
            <h3>${escapeHtml(report.reportType)}</h3>
            <p class="muted">${escapeHtml(report.periodLabel)} | Generated ${escapeHtml(formatShortDateTime(report.generatedAt))}</p>
            <div class="grid">
              ${metricCard('Money In', formatMoney(report.summary.moneyIn))}
              ${metricCard('Money Out', formatMoney(report.summary.moneyOut))}
              ${metricCard('Net Movement', formatMoney(report.summary.netMovement))}
              ${metricCard('Records', report.summary.count)}
            </div>
            ${renderTransactionTable(report.transactions, false)}
          </section>
        `;
      }

      function drawIncomeExpenditureOutput(report) {
        document.getElementById('reportOutput').innerHTML = `
          <section class="panel">
            <h3>${escapeHtml(report.reportType)}</h3>
            <p class="muted">${escapeHtml(report.periodLabel)} | Generated ${escapeHtml(formatShortDateTime(report.generatedAt))}</p>
            <div class="grid">
              ${metricCard('Total Receipts', formatMoney(report.summary.totalIncome))}
              ${metricCard('Total Payments', formatMoney(report.summary.totalExpenditure))}
              ${metricCard('Net Receipts / Payments', formatMoney(report.summary.surplusDeficit))}
            </div>
          </section>
          <section class="panel">
            <h3>Receipts</h3>
            ${renderAmountRows(report.incomeRows, 'No income records for this period.')}
          </section>
          <section class="panel">
            <h3>Payments</h3>
            ${renderAmountRows(report.expenditureRows, 'No expenditure records for this period.')}
          </section>
        `;
      }

      function drawFinancialPositionOutput(report) {
        document.getElementById('reportOutput').innerHTML = `
          <section class="panel">
            <h3>${escapeHtml(report.reportType)}</h3>
            <p class="muted">${escapeHtml(report.periodLabel)} | Generated ${escapeHtml(formatShortDateTime(report.generatedAt))}</p>
            ${report.currencyWarning ? `<p class="message">${escapeHtml(report.currencyWarning)}</p>` : ''}
            <div class="grid">
              ${metricCard('Bank Balance', report.mixedCurrencies ? 'See currency totals' : formatMoney(report.summary.bankBalance))}
              ${metricCard('Cash at Hand', report.mixedCurrencies ? 'See currency totals' : formatMoney(report.summary.cashAtHand))}
              ${metricCard('Total Funds Available', report.mixedCurrencies ? 'See currency totals' : formatMoney(report.summary.totalFundsAvailable))}
              ${metricCard('Represented Funds', report.mixedCurrencies ? 'Not combined' : formatMoney(report.summary.representedFundsTotal))}
            </div>
          </section>
          <section class="panel">
            <h3>Funds Available</h3>
            ${renderAmountRows(report.accountRows, 'No active accounts found.')}
          </section>
          ${report.mixedCurrencies ? `<section class="panel"><h3>Totals By Currency</h3>${renderAmountRows(report.currencyRows, 'No currency totals found.')}</section>` : ''}
          <section class="panel">
            <h3>Represented By</h3>
            ${renderAmountRows(report.fundRows, 'No fund/project balances found.')}
          </section>
        `;
      }

      function renderAmountRows(rows, emptyText) {
        if (!rows || !rows.length) {
          return `<p class="muted">${escapeHtml(emptyText)}</p>`;
        }

        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Description</th><th>Amount</th></tr></thead>
              <tbody>
                ${rows.map(function(row) {
                  return `<tr><td>${escapeHtml(row.name)}${row.currency ? `<br><span class="small muted">${escapeHtml(row.currency)}</span>` : ''}</td><td>${formatMoney(row.amount)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function downloadCsv(csv, fileName) {
        const blob = new Blob([csv || ''], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function makeReportFileName(reportType) {
        const safeName = String(reportType || 'report')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'report';
        return `naco-94-${safeName}-${todayIso()}.csv`;
      }

      function drawMembers(directory) {
        const canAdminMembers = state.bootstrap.user.roles.includes('Membership Administrator') || state.bootstrap.user.roles.includes('System Administrator');
        const adminPanel = canAdminMembers ? renderMembershipAdminPanel() : '';
        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>Members</h2>
            <p class="muted">The directory only shows details each member has agreed to share.</p>
          </section>
          <section class="directory-list">
            ${directory.length ? directory.map(renderDirectoryCard).join('') : '<div class="panel">No members are visible in the directory yet.</div>'}
          </section>
          ${adminPanel}
        `;

        if (canAdminMembers) {
          document.getElementById('addMemberForm').addEventListener('submit', submitAddMember);
          loadPendingRequests();
        }
      }

      function renderMembershipAdminPanel() {
        return `
          <section class="panel">
            <h3>Add Member</h3>
            <form id="addMemberForm" class="form-grid">
              ${inputField('Full Name', 'Full Name', '')}
              ${inputField('Preferred Name', 'Preferred Name', '')}
              ${inputField('Email Address', 'Email Address', '')}
              ${birthdayField('Birthday Day/Month', 'Date of Birth', '')}
              ${inputField('Phone Number', 'Phone Number', '')}
              ${inputField('City', 'City', '')}
              ${inputField('State', 'State', '')}
              ${inputField('Country', 'Country', 'Nigeria')}
              ${inputField('Occupation', 'Occupation', '')}
              <div style="grid-column: 1 / -1;">
                <button class="action" type="submit">Add Member</button>
              </div>
            </form>
          </section>
          <section class="panel">
            <h3>Profile Update Requests</h3>
            <div id="pendingRequests" class="request-list">
              <p class="muted">Loading requests...</p>
            </div>
          </section>
        `;
      }

      function renderDirectoryCard(member) {
        return `
          <article class="directory-card">
            <div class="directory-name">${escapeHtml(member.name || 'Name hidden')}</div>
            ${member.cityCountry ? `<div>${escapeHtml(member.cityCountry)}</div>` : ''}
            ${member.occupation ? `<div>${escapeHtml(member.occupation)}</div>` : ''}
            ${member.phoneNumber ? `<div class="small">Phone: ${escapeHtml(member.phoneNumber)}</div>` : ''}
            ${member.emailAddress ? `<div class="small">Email: ${escapeHtml(member.emailAddress)}</div>` : ''}
          </article>
        `;
      }

      function loadPendingRequests() {
        google.script.run
          .withSuccessHandler(function(requests) {
            state.pendingRequests = requests;
            document.getElementById('pendingRequests').innerHTML = requests.length
              ? requests.map(renderRequestCard).join('')
              : '<p class="muted">No pending profile update requests.</p>';
            document.querySelectorAll('[data-review-request]').forEach(function(button) {
              button.addEventListener('click', reviewRequest);
            });
          })
          .withFailureHandler(function(error) {
            document.getElementById('pendingRequests').innerHTML = `<p class="muted">${escapeHtml(error.message || String(error))}</p>`;
          })
          .getPendingMemberUpdateRequests();
      }

      function renderRequestCard(request) {
        return `
          <article class="request-card">
            <div><strong>${escapeHtml(request.memberId)}</strong></div>
            <div class="small">Requested by ${escapeHtml(request.requestedByEmail)}</div>
            <pre class="small">${escapeHtml(JSON.stringify(request.requestedChanges, null, 2))}</pre>
            <div class="action-row">
              <button class="action" type="button" data-review-request="${escapeHtml(request.requestId)}" data-decision="Approved">Approve</button>
              <button class="action danger" type="button" data-review-request="${escapeHtml(request.requestId)}" data-decision="Rejected">Reject</button>
            </div>
          </article>
        `;
      }

      function submitProfileUpdate(event) {
        event.preventDefault();
        const changes = readFormValues(event.target);
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            renderMyProfile();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .requestMyProfileUpdate(changes);
      }

      function submitPrivacySettings(event) {
        event.preventDefault();
        const settings = {};
        event.target.querySelectorAll('input[type="checkbox"]').forEach(function(input) {
          settings[input.name] = input.checked ? 'Yes' : 'No';
        });
        google.script.run
          .withSuccessHandler(function(result) {
            alert(result.message);
            renderMyProfile();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .updateMyPrivacySettings(settings);
      }

      function submitAddMember(event) {
        event.preventDefault();
        const record = readFormValues(event.target);
        google.script.run
          .withSuccessHandler(function(result) {
            alert('Member added: ' + result.memberId);
            renderMembers();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .addMember(record);
      }

      function reviewRequest(event) {
        const requestId = event.target.dataset.reviewRequest;
        const decision = event.target.dataset.decision;
        if (!confirm(decision + ' this profile update request?')) {
          return;
        }
        google.script.run
          .withSuccessHandler(function() {
            loadPendingRequests();
          })
          .withFailureHandler(function(error) {
            alert(error.message || String(error));
          })
          .reviewMemberUpdateRequest(requestId, decision);
      }

      function readFormValues(form) {
        const values = {};
        form.querySelectorAll('input, textarea, select').forEach(function(input) {
          values[input.name] = input.value;
        });
        return values;
      }

      function profileLine(label, value) {
        return `
          <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value" style="font-size: 17px;">${escapeHtml(value || '--')}</div>
          </div>
        `;
      }

      function inputField(label, name, value, type) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input type="${escapeAttr(type || 'text')}" id="${escapeAttr(name)}" name="${escapeAttr(name)}" value="${escapeAttr(value)}">
          </div>
        `;
      }

      function dateInputField(label, name, value) {
        const id = escapeAttr(name);
        return `
          <div>
            <label for="${id}">${escapeHtml(label)}</label>
            <input id="${id}" name="${id}" value="${escapeAttr(value)}" placeholder="dd-mm-yyyy" inputmode="numeric" pattern="\\d{1,2}-\\d{1,2}-\\d{4}">
            <input type="date" data-calendar-for="${id}" aria-label="${escapeAttr(label)} calendar">
            <p class="muted small">Enter as dd-mm-yyyy or choose from the calendar.</p>
          </div>
        `;
      }

      function selectField(label, name, options) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <select id="${escapeAttr(name)}" name="${escapeAttr(name)}">
              ${options.map(function(option) {
                return `<option value="${escapeAttr(option.value)}" ${option.selected ? 'selected' : ''}>${escapeHtml(option.label)}</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }

      function fileField(label, name, accept, helpText) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input type="file" id="${escapeAttr(name)}" name="${escapeAttr(name)}" accept="${escapeAttr(accept || 'application/pdf,image/jpeg,image/png')}">
            <p class="muted small">${escapeHtml(helpText || 'Optional. PDF, JPG, or PNG up to 5 MB.')}</p>
          </div>
        `;
      }

      function birthdayField(label, name, value) {
        return `
          <div>
            <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
            <input id="${escapeAttr(name)}" name="${escapeAttr(name)}" value="${escapeAttr(value)}" inputmode="numeric" placeholder="DD/MM">
            <p class="muted small">Use day and month only, for example 14/08. Do not enter the year.</p>
          </div>
        `;
      }

      function textAreaField(label, name, value) {
        return `
          <label for="${escapeAttr(name)}">${escapeHtml(label)}</label>
          <textarea id="${escapeAttr(name)}" name="${escapeAttr(name)}">${escapeHtml(value)}</textarea>
        `;
      }

      function privacyCheck(name, label, value) {
        return `
          <label class="check-item">
            <input type="checkbox" name="${escapeAttr(name)}" ${value === 'Yes' ? 'checked' : ''}>
            <span>${escapeHtml(label)}</span>
          </label>
        `;
      }

      function renderPendingRequests(requests) {
        if (!requests || !requests.length) {
          return '';
        }

        return `
          <section class="panel">
            <h3>Pending Requests</h3>
            <p class="muted">Your request is waiting for review by the Membership Administrator.</p>
            <div class="request-list">
              ${requests.map(function(request) {
                return `<div class="request-card"><strong>${escapeHtml(request.requestId)}</strong><pre class="small">${escapeHtml(JSON.stringify(request.requestedChanges, null, 2))}</pre></div>`;
              }).join('')}
            </div>
          </section>
        `;
      }

      function renderInlineError(title, message) {
        document.getElementById('app').innerHTML = `
          <section class="panel message error">
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      function renderError(message) {
        document.getElementById('statusBar').innerHTML = '<span class="badge warn">Error</span>';
        document.getElementById('app').innerHTML = `
          <section class="panel message error">
            <h2>Something went wrong</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function metricCard(label, value) {
        return `
          <div class="metric">
            <div class="metric-label">${escapeHtml(label)}</div>
            <div class="metric-value">${escapeHtml(value)}</div>
          </div>
        `;
      }

      function accountOption(account) {
        return { value: account.accountId, label: account.accountName + ' - ' + account.accountType };
      }

      function categoryOption(category) {
        return { value: category.categoryId, label: category.categoryName };
      }

      function fundOption(fund) {
        return { value: fund.fundId, label: fund.fundName };
      }

      function formatMoney(value) {
        const number = Number(value || 0);
        return number.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function todayIso() {
        return new Date().toISOString().slice(0, 10);
      }

      function todayDisplay() {
        return isoToDisplayDate(todayIso());
      }

      function isoToDisplayDate(value) {
        const parts = String(value || '').split('-');
        if (parts.length !== 3) {
          return value || '';
        }
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }

      function displayToIsoDate(value) {
        const parts = String(value || '').split('-');
        if (parts.length !== 3) {
          return '';
        }
        return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }

      function formatShortDateTime(value) {
        if (!value) {
          return '--';
        }
        return String(value).slice(0, 16).replace('T', ' ');
      }

      function readFileAsBase64(file, callback) {
        if (file.size > 10 * 1024 * 1024) {
          alert('File is too large. Maximum size is 10 MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function() {
          callback(String(reader.result).split(',')[1]);
        };
        reader.readAsDataURL(file);
      }

      loadApp();
    </script>
  </body>
</html>
